# I. 追いかけダイヤル (docs/puzzle_stage_ideas.md §2.3)
# 「残り時間の十の位と同じ位置にロータリーを合わせて○色を切れ」。
# 正解が時間とともに変わり続ける。判定はデバイス内で行う。
#
# ロータリーは0-5しかないため、十の位が6-9の間は合わせられない。
# 十の位が0-5に入る時間帯を待つ必要があり、それ自体が難度になる。

id = "I"
name = "追いかけダイヤル"
difficulty = "hard"

[random]
cut = { pick = "line" }

[core]
leds = { "${cut}" = "blink" }
led_blink_ms = 400
cut = "${cut}"
precondition = { timer_digit = { digit = "tens", match = "rotary" } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "残り時間の十の位の数字と、ダイヤルの位置を一致させた状態で線を切る。時間が進むと正解の位置も変わり続ける。"
answer = "正解はタイマーの秒の十の位とダイヤルの位置を一致させて${cut}色の線を切ること。ダイヤルは0-5しかないため、十の位が6-9の間は切れない。"
procedure = "十の位が変わるタイミングを読み上げて支援する。ダイヤルが届かない数字の時間帯があることを伝え、待つ判断を促す。"
hint_l1 = "タイマーの数字とダイヤルの位置に関係があることを伝える"
hint_l2 = "残り時間の十の位に注目させ、ダイヤルをその数字に合わせるよう促す"
hint_l3 = "「十の位とダイヤルを一致させた状態で切る」と手順を教えてよい。合わせられない時間帯は待つよう伝える"
