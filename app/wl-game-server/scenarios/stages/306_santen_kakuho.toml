# 306. 三点確保 (docs/puzzle_stage_ideas.md §2.3)
#
# ボタンを**2つ同時に押さえたまま**線を切る。
# 片手でボタン2つを押さえ、もう片方の手でニッパーを扱うことになり、
# 指の使い方に工夫が要る。1人プレイでの「体を使う」体験になる。
#
# 103 ホールド&カット (ボタン1つ + ダイヤル) の発展形だが、
# ダイヤル操作をなくして**保持そのものの難しさ**に寄せている。
#
# 押さえる2色は隣り合うとは限らないため、届かない組み合わせを引いた場合は
# 持ち替えや姿勢の工夫が必要になる (それも含めて体験の一部)。

id = "306"
name = "三点確保"
difficulty = "hard"

[random]
cut = { pick = "line" }
# 押さえる2色。切る線とは別の色にして、押さえた指が邪魔にならないようにする
hold1 = { pick = "color", exclude = ["${cut}"] }
hold2 = { pick = "color", exclude = ["${cut}", "${hold1}"] }

[core]
# 押さえる2色を点滅、切る線を点灯で示す
leds = { "${cut}" = "on", "${hold1}" = "blink", "${hold2}" = "blink" }
led_blink_ms = 600
cut = "${cut}"
precondition = { push = [
  "${hold1}",
  "${hold2}",
] }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "2つのボタンを同時に押さえたまま、指定の線を切る必要がある。押さえたまま切るため、手の使い方に工夫が要る。"
answer = "正解は${hold1}色と${hold2}色のボタンを2つとも押さえた状態で、${cut}色の線を切ること。"
procedure = "点滅している2つのランプが押さえるボタン、点灯しているランプが切る線であることを伝える。『押さえたまま切る』点を強調し、指が届かなければ持ち替えてよいと助言する。ボタンから指が離れると失敗するので、切る直前に押さえ直すよう促してもよい。"
hint_l1 = "点滅しているランプが2つ、点灯しているランプが1つあることを確認させる"
hint_l2 = "点滅している色のボタンを2つとも押さえる必要があること、押さえたまま切ることを伝える"
hint_l3 = "押さえる2色と、押さえたまま切る手順を伝えてよい(切る線の色は言わない)"
