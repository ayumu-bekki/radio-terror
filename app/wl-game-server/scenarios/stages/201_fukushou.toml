# 201. 復唱 (docs/puzzle_stage_ideas.md §2.2)
# 「赤赤黄黄赤の順でボタンを押してから、○色の線を切ってください」
# 無線で1回聞いて覚えられる長さ(5個)にする。ミスは列の先頭からやり直し。
# より難しい版は 305 二重復唱 (同じ列を2周)。

id = "201"
name = "復唱"
difficulty = "normal"

[random]
cut = { pick = "line" }
p1 = { pick = "color" }
p2 = { pick = "color" }
p3 = { pick = "color" }
p4 = { pick = "color" }
p5 = { pick = "color" }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { push_seq = { entries = [
  { push = "${p1}" },
  { push = "${p2}" },
  { push = "${p3}" },
  { push = "${p4}" },
  { push = "${p5}" },
], on_wrong_press = { action = "retry" } } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "5個のボタン列を順番どおりに押し切る必要がある。1つでも間違えると最初からやり直しになる。"
answer = "正解はボタンを${p1}→${p2}→${p3}→${p4}→${p5}の順に押してから、${cut}色の線を切ること。"
procedure = "聞き返されたら何度でも繰り返す。区切って伝えてもよい。ミスしたら先頭からやり直しになることを伝える。"
hint_l1 = "ボタン列を順番に押す必要があることを伝える"
hint_l2 = "列を区切って読み上げ、押せたところまで確認しながら進める"
hint_l3 = "列を最初から通しで読み上げ、押し終わったら切る線も伝えてよい"
