# 05. ホールド&カット (docs/puzzle_stage_ideas.md §2.1)
# 「ロータリーを3に合わせ、緑のボタンを押しながら○色の線を切る」。
# 片手でボタンを押さえてもう片手で切る、または2人協力になる。

id = "05"
name = "ホールド&カット"
difficulty = "easy"

[random]
cut = { pick = "line" }
hold = { pick = "color" }
rotary = { pick = "int", min = 0, max = 5 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 600
cut = "${cut}"
precondition = { rotary = "${rotary}", push = [
  "${hold}",
] }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "ダイヤルを指定位置に合わせ、指定のボタンを押したままの状態で線を切る必要がある。"
answer = "正解はダイヤルを${rotary}に合わせ、${hold}色のボタンを押しながら${cut}色の線を切ること。"
hint_l1 = "点灯しているランプと点滅しているランプがあることに気づかせる"
hint_l2 = "ダイヤルの位置合わせと、ボタンを押したままにする操作の2つが必要だと伝える"
hint_l3 = "手を離さずに切る必要があること、2人がかりでもよいことを含めて手順を伝えてよい(色名は言わない)"
