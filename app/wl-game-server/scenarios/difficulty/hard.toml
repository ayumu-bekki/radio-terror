# ハード (docs/scenario_design.md §4・§4.1)
# 構成: 普通 ×2 + 難しい ×2 (4ステージ)
#
# 配線は5本あるが、最大5ステージにすると全色を使い切ってしまい、
# 切断線の選択に余地が無くなる (抽選の幅が消え、色の制約を持つステージが
# 組み立て不能になる)。1本余らせて4ステージを上限とする。

name = "ハード"
countdown_ms = 600000 # 10分
detonate_delay_ms = 2000

[compose]
random = { normal = 2, hard = 2 }

[crosstalk]
jamming = 1
ambient = 1
uneasy = 1

[hints]
# ハードは L4 (正解の直言) を出さない (docs/navigator_design.md §3.2)
l2_pct = 25
l3_pct = 50
l4_pct = 0 # 0 = L4無効
