# macOS 開発用 compose: Webクライアント配信 (nginx) + wl-game-server。
#
# radio-bridge-emulator は portaudio で Mac の実マイク・スピーカーを直接使うため
# コンテナ化できない (Docker Desktop は CoreAudio をコンテナへ渡せない)。
# 先にホストで起動しておくこと:
#   cd radio-bridge-emulator && ./radio-bridge-emulator config.toml
#
# wl-game-server コンテナはホスト上の emulator へ host.docker.internal:50051 で接続する。
# config-mac-docker.toml は config.toml のコピーに radio_bridge.host = "host.docker.internal"
# を設定したもの (APIキーを含むため gitignore 対象)。
services:
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./wl-web-client/public:/usr/share/nginx/html:ro
      - ./wl-web-client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wl-game-server
    networks:
      - whisperlink-network

  wl-game-server:
    build:
      context: .
      dockerfile: wl-game-server/Dockerfile
    ports:
      - 8080:8080
    volumes:
      - type: bind
        source: ./wl-game-server/config-mac-docker.toml
        target: /app/config.toml
        read_only: true
      - type: bind
        source: ./wl-game-server/transcribe_prompt.txt
        target: /app/transcribe_prompt.txt
        read_only: true
      - type: bind
        source: ./wl-game-server/transcribe_schema.json
        target: /app/transcribe_schema.json
        read_only: true
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - whisperlink-network

networks:
  whisperlink-network:
