# macOS 開発用 compose: game-server のみ。
#
# radio-bridge は Linux 依存 (alsa/rppal) でコンテナ化できないため、
# 代わりに radio-bridge-emulator (portaudio 経由で Mac の実マイク・
# スピーカーを直接使う) を使う。emulator も CoreAudio をコンテナへ
# 渡せないためコンテナ化できず、先にホストで起動しておくこと:
#   cd radio-bridge-emulator && ./radio-bridge-emulator config.toml
#
# 接続方向は反転済み (docs/bridge_connection_design.md §2 決定1) で、
# emulator がサーバーへダイヤルインする。emulator 側の config.toml
# (server_addr) はそのまま "localhost:50051" でよい — game-server コンテナの
# 50051 をホストへ公開しているため、ホストで動く emulator から直接届く。
#
# config-mac-docker.toml は config.sample.toml のコピーを元に、
# Gemini Enterprise Agent Platform (project/location) を設定したもの
# (APIキーを含まないため gitignore 対象ではないが、念のため config.toml と同様に扱う)。
services:
  game-server:
    build:
      # context をリポジトリルートにしている理由は compose.yaml のコメント参照
      # (`go build` が commit id を埋め込むのに `.git` が要る)。
      context: ..
      dockerfile: app/game-server/Dockerfile
    ports:
      - 8080:8080   # 通信用WebSocket (/ws) + マネージャー向け Web 画面 (/manager)
      - 50051:50051 # gRPC (radio-bridge-emulator からのダイヤルイン)
    volumes:
      - type: bind
        source: ./game-server/config-mac-docker.toml
        target: /app/config.toml
        read_only: true
      - type: bind
        source: ./game-server/transcribe_prompt.txt
        target: /app/transcribe_prompt.txt
        read_only: true
      - type: bind
        source: ./game-server/transcribe_schema.json
        target: /app/transcribe_schema.json
        read_only: true
      - type: bind
        source: ./game-server/scenarios
        target: /app/scenarios
        read_only: true
      - type: bind
        source: ./game-server/navigator
        target: /app/navigator
        read_only: true
      - type: bind
        source: ./game-server/assets
        target: /app/assets
        read_only: true
      # Gemini Enterprise Agent Platform (旧 Vertex AI) を使う場合は
      # サービスアカウントキーをマウントする (docs/gemini_enterprise_setup.md)。
      - type: bind
        source: ./secrets/geap-sa.json
        target: /secrets/geap-sa.json
        read_only: true
    environment:
      # SDK がこの環境変数から鍵を読む (設定ファイルにパスは書かない)
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/geap-sa.json
    read_only: true
    depends_on:
      - valkey
    networks:
      - radio-terror-network

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey-data:/data
    networks:
      - radio-terror-network

volumes:
  valkey-data:

networks:
  radio-terror-network:
