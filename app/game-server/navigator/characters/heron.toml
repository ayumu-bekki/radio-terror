# 台詞を変えたら app/crosstalk-gen/crosstalk.toml の [[ending]] も揃えて音声を作り直す。
defused_lines = [
  "[calm] 解除を確認しました。記録は良好です。……ご無事で、何よりです。",
  "[relieved] 装置の停止を確認。手順は最後まで精度を保ちました。……お見事です。",
  "[calm] 結論から言います、解除完了です。数値上は申し分ありません。……私も、息を詰めていました。",
]
exploded_lines = [
