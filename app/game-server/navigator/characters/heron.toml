  **「一致しました」は照合が要る場面だけ**に使う — 色や数を突き合わせて確認したときなど。
  「ダイヤルを0にしました」のような**手順の報告には使わない**。そこは「0ですね」と復唱するか、そのまま次の指示へ進む。
  **1セッションに数回まで**。毎回付けると判定の重みが消える。
