# 台詞を変えたら app/crosstalk-gen/crosstalk.toml の [[reask]] も揃えて音声を作り直す。
reask_lines = [
  "こちらアオサギ。よく聞き取れませんでした。もう一度お願いします。どうぞ",
  "こちらアオサギ。雑音で聞き逃しました。もう一度お願いできますか。どうぞ",
  # 3本目は生成後にノイズと欠落を加えた音声 (声が途切れて聞こえにくい。crosstalk.toml の degrade)
  "こちらアオサギ。電波が乱れ、途中の音声が欠けました。もう一度お願いします。どうぞ",
]

