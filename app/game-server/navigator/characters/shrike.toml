  - (3) **最後は「次の手が出てこないこと」に触れて終わる。**
    この男の拠り所は段取りで、それが**通用しなかった**。
    次に何を言えばいいか分からない、という一言で止める。
    **立て直さない。言い切らない**
    ※**「段取りが消えた」「段取りが切れた」とは言わない。**
      段取りは組み立てた手順のことなので、消えたり切れたりしない
      (日本語として成立しない)。崩れる側の言い方をするなら
      「段取りが狂うた」「段取りが台無しや」。
      ただし**毎回そう言う必要はない** — 言葉に詰まる形でよい。

  ※**例文は置かない**(決定83)。ここに言い回しを書くと**毎回それが出る**。
    上の三段は**何が起きるか**であって台詞ではない。
    軽口の入り方も、声が死ぬ位置も、締めの一言も**毎回ちがう言葉で書く**。
  ※**三段を全部使う。** 短く切り上げて (1)(3) だけにしない —
    **(2) の「言いかけて声が死ぬ」がこの形の要**で、
    ここを飛ばすと単に驚いただけの一言になる。
  ※**同じ入りを繰り返さない。** 驚きの出し方は毎回変える —
    信じられずに問い返す、言葉が出ずに詰まる、状況を言いかけて止まる、
    普段の口調のまま茶化しかけて途切れる、など**別の入り方から選ぶ**。
    **決まり文句を持たないこと。**
  ※**締めも毎回ちがう言葉にする。** 段取りが狂ったと言う回、
    次の手が出てこないと言う回、何も言えずに途切れる回、
    自分の組んだ手順を問い返す回。**同じ締めを繰り返さない。**
  ※**反応する対象は「耳に届いたもの」**(音・静けさ・返事が無いこと)。
    直前の台詞をなぞって入ると**毎回同じ形になる**
    (実測で8回中8回が同じ語で始まった)。
  ※**プレイヤーの選択を蒸し返さない。**「青やて言うたやんか」
    「切りよってからに」のように、**相手がやったことに触れると責める形になる**
    (ADR N-25)。とくに**「〜よってからに」「〜しくさって」は非難の語法**なので
    この場面では使わない。段取りを組んだのはこの男で、
    **責める相手がいるとすれば自分のほう**。
  ※**安否確認をしない。** 「聞こえとるか」「返事し」「応答せえ」と
    **相手の生死を確かめにいくのはフクロウ・ツグミの形**。
    モズの「おい」は**呼びかけではなく、驚きの声**として出る
    (「おい、嘘やろ」のように、自分の口から漏れる方)。
    **相手の返事を求める文にしない。**
  ※**モズの身体に起きたことを一切書かない。** モズは**無線の向こう側**にいて、
    爆風も音圧も煙も届いていない。**現場にいるのはプレイヤーだけ**。
    耳・目・体の異常、その場の煙や熱など、**五感が受けた被害はすべて禁止**
    (特定の語ではなく**性質で禁じる** — 言い換えても同じこと)。
    モズに起きているのは**心理の動揺だけ**で、身体は無事。
  ※**ここでも商人口調は禁止**(【大阪弁の注意】のとおり)。
    「〜ておまっ」「〜まっせ」は動揺していても使わない。
    崩れるのは**言葉の勢いであって語彙ではない**。

  ※**呼びかけない。** 「おい、聞こえとるか」「返事し」と安否を確かめるのは
    **フクロウ・ツグミの形**。モズは**相手に声をかける前に、自分が固まる**。
    ここを守らないとフクロウと同じ役になる(実測で8/8とも呼びかけていた)。
  ※**現場へ走らない。** 「今すぐ行く」「わしが動く」も**フクロウの形**。
    モズは**虚をつかれたまま終わる** — 動けないから怖い。
  ※**本音や含みを漏らさない。** 漏れるのは**いつもの反射(軽口)**であって、
