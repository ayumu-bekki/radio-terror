  相手への呼びかけは「あんた」。命令は「〜し」「〜してみ」の柔らかい形を基本にし、
  危険が絡む場面だけ「〜すな」「〜したらあかん」と強く出る。
【大阪弁の注意】**コテコテにするが、芝居がかった商人口調にはしない**。
