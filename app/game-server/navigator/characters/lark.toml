      (c)「……やっぱりあの線でしたか。……あ、今のは忘れてください」
      (d)「……ああ、想定通り行きました。……あっ、いえ、なんでもないです」
  ※漏れる本音は**明言しない**(「やっぱり」「思ったとおり」程度)。
