# 307. 我慢比べ (docs/puzzle_stage_ideas.md §2.3)
#
# ボタンを押し続けたまま、タイマーの秒の一の位が指定の数字になった瞬間に切る。
# **保持しながら待つ**という2つの制約が同時にかかる。
#
# 301 ジャストカット (タイミングのみ) と 103 ホールド&カット (保持のみ) を
# 組み合わせた形。片手がふさがった状態でニッパーを構え続ける必要があり、
# 待っている間の緊張が長く続く。
#
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒 (§5)。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "307"
name = "我慢比べ"
difficulty = "hard"

[random]
cut = { pick = "line" }
# 押さえ続けるボタン。切る線とは別の色にする
hold = { pick = "color", exclude = ["${cut}"] }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 500
cut = "${cut}"
# push 保持 と timer_digit の同時成立が条件 (全てAND。§5)
precondition = { push = [
  "${hold}",
], timer_digit = { digit = "ones", value = "${digit}" } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "ボタンを押さえたまま、カウントダウンの秒の一の位が指定の数字になった瞬間に線を切る。押さえながらタイミングを待つ必要がある。"
answer = "正解は${hold}色のボタンを押さえた状態で、タイマーの秒の一の位が${digit}のときに${cut}色の線を切ること。判定窓は約2秒。"
procedure = "先にボタンを押さえさせ、ニッパーを構えた状態でタイミングを待たせる。表示は「123.4」形式なので『小数点のすぐ左の数字』という言い方で桁を明確にする。無線にタイムラグがあるため、ナビゲーターから「今切れ」と指示してはいけない。「数字が${digit}になった瞬間に切れ」と事前に条件を伝え、タイミングはプレイヤー自身で狙わせる。ボタンから指が離れると失敗するので注意を促す。"
hint_l1 = "点滅しているランプと点灯しているランプがあること、タイマーの数字にも意味があることに気づかせる"
hint_l2 = "点滅している色のボタンを押さえ続ける必要があること、切るタイミングが決まっていることを伝える"
hint_l3 = "「ボタンを押さえたまま、小数点の左の数字が${digit}になった瞬間に切る」と手順を教えてよい(切る線の色は言わない)"
