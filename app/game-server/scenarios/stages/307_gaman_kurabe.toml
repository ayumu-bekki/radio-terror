# 307. 我慢比べ (docs/puzzle_stage_ideas.md §2.3)
#
# ボタンを押し続けたまま、タイマーの秒の一の位が指定の数字になった瞬間に切る。
# **保持しながら待つ**という2つの制約が同時にかかる。
#
# 301 ジャストカット (タイミングのみ) と 103 ホールド&カット (保持のみ) を
# 組み合わせた形。片手がふさがった状態でニッパーを構え続ける必要があり、
# 待っている間の緊張が長く続く。
#
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒 (§5)。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "307"
name = "我慢比べ"
difficulty = "hard"

[random]
cut = { pick = "line" }
# 押さえ続けるボタン。切る線とは別の色にする
hold = { pick = "color", exclude = ["${cut}"] }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 500
cut = "${cut}"
# push 保持 と timer_digit の同時成立が条件 (全てAND。§5)
precondition = { push = [
  "${hold}",
], timer_digit = { digit = "ones", value = "${digit}" } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "ボタンを押さえたまま、カウントダウンの秒の一の位が指定の数字になった瞬間に線を切る。押さえながらタイミングを待つ必要がある。"
# 押さえるボタンの色は言ってよいが、切る線の色は「照合の材料」として書く
# (208/301 と同じ方針)。「${cut}色の線を切ること」とだけ書くと、なぞられて
# 第一声から色名が漏れる (アオサギのシミュレーションで発生)。
answer = "正解は${hold}色のボタンを押さえた状態で、タイマーの秒の一の位が${digit}のときに、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない(押さえるボタンの${hold}色は言ってよい)。判定窓は約2秒。"
# **1発話に1つずつ**。押さえる・待つ・切るの3要素を1度に言うと
# 60文字を超える (アオサギで74文字になった)。手順を分けて往復させる。
procedure = "**1回の発話で伝えるのは1つだけ**にし、返答を待ってから次へ進む。(1) まず**「${hold}色のボタンを押さえる」**ことを伝える。(2) 押さえたら**「小数点のすぐ左の数字が${digit}になった瞬間」**という条件を伝える。(3) 切る線は**「光っているランプと同じ色の線」**という言い方で伝える。3つを1度にまとめて言ってはいけない。表示は「123.4」形式なので『小数点のすぐ左の数字』という言い方で桁を明確にする。無線にタイムラグがあるため、ナビゲーターから「今切れ」と指示してはいけない。タイミングはプレイヤー自身で狙わせる。ボタンから指が離れると失敗するので注意を促す。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『点滅と点灯がある』という報告を受けてから、タイマーの数字にも意味があることを伝える。切る線の色名はこちらから言わず、プレイヤーに報告させること"
hint_l2 = "点滅している色のボタンを押さえ続ける必要があること、切るタイミングが決まっていることを伝える。切る線の色名はこちらから言わないこと"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると読み落とされる。
hint_l3 = "「ボタンを押さえたまま、小数点の左の数字が${digit}になった瞬間に切る」と手順を教えてよい。切る線の色名は言わないこと。点灯しているランプは1つだけなので、『光っているランプと同じ色の線』と言えば伝わる"
