# 104. 早い者勝ち (docs/puzzle_stage_ideas.md §2.1)
# 2つのLEDのうち「速く点滅している色」の線を切る。

id = "104"
name = "早い者勝ち"
difficulty = "easy"

[random]
cut = { pick = "line" }             # 速く点滅する側 = 正解
slow = { pick = "color", exclude = ["${cut}"] } # 比較用のもう1本

[core]
# **150ms vs 300ms (2.0倍)**。2026-08-24 に 700ms から締めた。
#
# 4.67倍 (150/700) は「片方がほぼ点きっぱなし」に見えて簡単すぎた。
# 2.0倍なら 3.3Hz vs 1.7Hz で、片方が「チカチカ」もう片方が「点滅」と
# **質的に違って見える** — 見比べれば分かるが、ぼんやり見ただけでは分からない。
#
# **これ以上詰めない。** 150 vs 200 (1.33倍) だと両方とも 2.5Hz 以上の
# 「速い点滅」帯に入り、**どちらも速く見えて差が読めない**。
# 205 速さくらべ (ノーマル・隣接2.0倍) より難しくなり、難易度も逆転する。
# セーフティーグラス着用・立ったまま・無線で急かされている状態で見る。
leds = { "${cut}" = { pattern = "blink", on_ms = 150, off_ms = 150 }, "${slow}" = { pattern = "blink", on_ms = 300, off_ms = 300 } }
cut = "${cut}"

[navigator]
briefing = "2つのランプが点滅している。速く点滅している色の線を切れば解除できる。"
answer = "正解は${cut}色の線(${slow}色より速く点滅している方)。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**報告の内容で返し方を変える**:\n\n- **2つ点滅している、までの報告なら**、点滅の**速さに違いがないか**を見るよう観点を示す。\n- **速い/遅いの差まで報告できていれば**、そこで止めずに、**速く点滅している方の色の線を切る**と伝える。**プレイヤーが速い方の色を言っていれば、その色名で指してよい**(言っていなければ色名はプレイヤーより先に発話に入れない)。**報告済みの相手に、見比べるよう促し直してはいけない**。\n\n色名はプレイヤーが先に言ったときだけ復唱してよい。"
