# 203. 暗号電文 (docs/puzzle_stage_ideas.md §2.2)
# LEDがNATOフォネティックコードの語をモールスでループ表示する。
# 手元の紙資料のモールス対照表 (資料1。各文字に色付きの固定印刷。5色を循環割当) で
# 解読し、頭文字に対応する色の線を切る。
# 資料の呼称は config.toml の [mission_sheet.documents] から引く
# (${sheet_morse})。
#
# 対照表の色割当: A=赤(A) B=黄(B) C=緑(C) D=青(D) E=白(E) F=赤(A) ... と5色循環。
# したがって語の頭文字から切る線が一意に決まるため、cut は word から導出する
# (pick = "morse_word" が語と頭文字対応色の組を解決する)。
#
# 候補語は5色すべてをカバーするよう揃える。どの色が残っていても語を選べるため、
# このステージは他ステージと同じ順序で組み立てられる(特別扱い不要)。
# モールス表示が長くなりすぎないよう、各色から短めの語を選んでいる。

id = "202"
name = "暗号電文"
difficulty = "normal"

# **切る線の色名は L4 (直言) でも伏せる** (ADR N-38)。
# 色名を言うとモールスを解読する工程が消え、この課題が成立しなくなる。
keep_cut_secret = true

[random]
# 語を選ぶと、その頭文字→対照表の色 が cut として同時に決まる。
# 頭文字の色が既に他ステージで使われている語は、組み立て時に候補から外れる。
word = { pick = "morse_word", candidates = [
  # A=赤
  "ALFA",
  "KILO",
  "PAPA",
  # B=黄
  "BRAVO",
  "GOLF",
  "LIMA",
  # C=緑
  "MIKE",
  "HOTEL",
  "ROMEO",
  # D=青
  "DELTA",
  "INDIA",
  "XRAY",
  # E=白
  "ECHO",
  "TANGO",
  "OSCAR",
] }
cut = { derive = "morse_word_color", from = "${word}" }
# モールスを表示するLED (テンプレート抽選)
display = { pick = "color" }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
cut = "${cut}"

[navigator]
briefing = "1つのランプがモールス信号で単語を繰り返し表示している。手元の${sheet_morse}(モールス対照表)で解読し、その単語の頭文字の色と同じ色の線を切る。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "1つのランプが**長短の混じった不規則な点滅**をしていることを報告できたか。『長いのと短いのがある』『チカチカが不揃い』など、モールス信号らしい点滅だと分かる報告であればよい"
answer = "表示されている単語は${word}。${sheet_morse}で頭文字を引くと${cut}色になるため、${cut}色の線を切るのが正解。**${cut}色という色名はこちらからは言わない**(色を言うと解読の工程が消える)。色名はプレイヤーの報告と照合するために使う。"
procedure = "『アルファ』等の単語名、1文字ずつのアルファベット、『トンツー/短長』のオノマトペ、いずれの報告も受け付ける。音声認識で漢字等に誤変換（例: 三毛→MIKE、パパ→PAPA、キロ→KILO）されても、該当する正解の語（${word}）として解釈してよい。単語が特定できたら『${sheet_morse}でその頭文字（${word}の最初の文字）の色を確認してください』と促す。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つが長短で点滅している』という報告を受けたら、**それがモールス信号であることと、手元の${sheet_morse}にモールスの対照表があることを続けて伝える**(気づかせるだけで止めない)。**資料番号と中身をひとまとまりで言う** — どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない。**面 (表裏) は言わない**"
hint_l2 = "手元の${sheet_morse}を使って1文字ずつ解読するよう促す"
hint_l3 = "「解読した単語の頭文字を${sheet_morse}で引き、その色の線を切る」と手順を教えてよい。**切る線の色名は最後まで言わない** — 解読はプレイヤーの仕事。読めた文字を報告させ、引いた色が合っているかを照合して認める形にする"
