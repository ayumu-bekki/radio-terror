# 202. 暗号電文 (docs/puzzle_stage_ideas.md §2.2)
# LEDがNATOフォネティックコードの語をモールスでループ表示する。
# 手元の紙資料のモールス対照表 (資料1。各文字に色付きの固定印刷。5色を循環割当) で
# 解読し、頭文字に対応する色の線を切る。
# 資料の呼称は config.toml の [mission_sheet.documents] から引く
# (${sheet_morse})。
#
# 対照表の色割当: A=赤(A) B=黄(B) C=緑(C) D=青(D) E=白(E) F=赤(A) ... と5色循環。
# したがって語の頭文字から切る線が一意に決まるため、cut は word から導出する
# (pick = "morse_word" が語と頭文字対応色の組を解決する)。
#
# 候補語は5色すべてをカバーするよう揃える。どの色が残っていても語を選べるため、
# このステージは他ステージと同じ順序で組み立てられる(特別扱い不要)。
# モールス表示が長くなりすぎないよう、各色から短めの語を選んでいる。

id = "202"
name = "暗号電文"
difficulty = "normal"

# **切る線の色名は L4 (直言) でも伏せる** (ADR N-38)。
# 色名を言うとモールスを解読する工程が消え、この課題が成立しなくなる。
keep_cut_secret = true

[random]
# 語を選ぶと、その頭文字→対照表の色 が cut として同時に決まる。
# 頭文字の色が既に他ステージで使われている語は、組み立て時に候補から外れる。
word = { pick = "morse_word", candidates = [
  # A=赤
  "ALFA",
  "KILO",
  "PAPA",
  # B=黄
  "BRAVO",
  "GOLF",
  "LIMA",
  # C=緑
  "MIKE",
  "HOTEL",
  "ROMEO",
  # D=青
  "DELTA",
  "INDIA",
  "XRAY",
  # E=白
  "ECHO",
  "TANGO",
  "OSCAR",
] }
cut = { derive = "morse_word_color", from = "${word}" }
# モールスを表示するLED (テンプレート抽選)
display = { pick = "color" }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
cut = "${cut}"

[navigator]
briefing = "1つのランプがモールス信号で単語を繰り返し表示している。手元の${sheet_morse}(モールス対照表)で解読し、その単語(フォネティックコード)を表から探して、同じ行にある色の線を切る。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "1つのランプが**長短の混じった不規則な点滅**をしていることを報告できたか。『長いのと短いのがある』『チカチカが不揃い』など、モールス信号らしい点滅だと分かる報告であればよい"
answer = "表示されている単語は${word}。${sheet_morse}で${word}の行を探すと${cut}色になるため、${cut}色の線を切るのが正解。${word}は1文字ずつ解読しなくても、${sheet_morse}の**フォネティックコード列に${word}がそのまま載っている**ので、読めた文字から単語が分かればその単語ごと表で探せる。**${cut}色という色名はこちらからは言わない**(色を言うと解読の工程が消える)。色名はプレイヤーの報告と照合するために使う。"
procedure = "**モールス信号だと伝えるときは、必ず『1つの単語を表示している』と明言する** — 「モールス信号だ」とだけ言うと、プレイヤーは1文字ごとの符号だと思い込み、単語の区切りが分からないまま読み進めて存在しない語を組み立ててしまう(例: 正しく1文字ずつは読めているのに、区切りを誤って別の語になる)。**「フォネティックコード」(『アルファ』『ブラボー』のような無線で1文字を伝える決まった呼び名)だと合わせて伝える** — 種類が分かれば、${sheet_morse}のフォネティックコード列の一覧から探せばよいと気づける。\n\n『アルファ』等の単語名、1文字ずつのアルファベット、『トンツー/短長』のオノマトペ、いずれの報告も受け付ける。音声認識で漢字等に誤変換（例: 三毛→MIKE、パパ→PAPA、キロ→KILO）されても、該当する正解の語（${word}）として解釈してよい。単語が特定できたら『${sheet_morse}でその単語（${word}）を探して、同じ行にある色を確認してください』と促す。**「頭文字の色」ではなく「その単語そのものを表から探す」と伝える** — ${sheet_morse}はフォネティックコード列に単語がそのまま載っているので、1文字だけ引き直させる必要はない。\n\n**報告された単語が正解の語（${word}）と一致せず、誤変換としても解釈できない場合**(例: 存在しないフォネティックコードを組み立ててしまった)、**「単語が存在しないはずがない」と決めつけて資料の綴りを疑わせない** — ${sheet_morse}には26語すべて載っており、プレイヤーが『無い』と気づいたのはモールスの読み違いを疑う正しい兆候である。**まずモールスの長短(点滅)をもう一度確認するよう促す**。1文字でも読み違えると別の語になり、資料のどこにも無い語ができてしまうことを伝えてよい。プレイヤーの気づき(『無い』『見当たらない』)を否定せず、聞き取り直しに戻す。\n\n**引けたら、そのまま切らせる。** プレイヤーが色を報告してきたら (『この色でいいですか』も含む)、${cut}色と照合し、合っていれば**「その色の線を切れ」と指示して終える**。**「何色でしたか」と聞き返さない** — 既に引けているのに色名を言わせるだけの往復が増える (ADR N-30: 説明で終えず次の行動まで言う)。\n\n色名を言わずに『引けました』とだけ報告された場合だけ、何色か尋ねる。照合できないまま切らせると誤切断で即爆発するため。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つが長短で点滅している』という報告を受けたら、**それがモールス信号で「1つの単語」を繰り返し表示していることと、手元の${sheet_morse}にモールスの対照表があることを続けて伝える**(気づかせるだけで止めない)。**「単語」だと明言する** — 単に「モールス信号だ」とだけ伝えると、1文字ずつの符号なのか単語なのかが伝わらず、区切りを見失って存在しない語を組み立ててしまう。**さらに「フォネティックコード」(『アルファ』『ブラボー』のような、無線で1文字を伝えるための決まった呼び名)だと伝える** — ${sheet_morse}のフォネティックコード列にその一覧が載っていることが分かり、どんな種類の単語を探せばよいかが定まる。**資料番号と中身をひとまとまりで言う** — どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない。**面 (表裏) は言わない**"
hint_l2 = "手元の${sheet_morse}を使って解読するよう促す。**${sheet_morse}にはフォネティックコード列があるので、読めた文字から単語が分かればその単語ごと表で探せる**ことを伝える"
hint_l3 = "「解読した単語を${sheet_morse}で探して、同じ行にある色の線を切る」と手順を教えてよい。**「頭文字の色」ではなく「その単語そのものを表から探す」と言う** — ${sheet_morse}はフォネティックコード列に単語がそのまま載っている。**切る線の色名は最後まで言わない** — 解読はプレイヤーの仕事。読めた文字や単語を報告させ、引いた色が合っているかを照合して認める形にする。**照合できたらそのまま「その色の線を切れ」と指示して終える** — 色名を聞き返して往復を増やさない"
