# 202. 暗号電文 (docs/puzzle_stage_ideas.md §2.2)
# LEDがNATOフォネティックコードの語をモールスでループ表示する。
# 手元の紙資料のモールス対照表 (資料1。各文字に色付きの固定印刷。5色を循環割当) で
# 解読し、頭文字に対応する色の線を切る。
# 資料の呼称は config.toml の [mission_sheet.documents] から引く
# (${sheet_morse})。
#
# 対照表の色割当: A=赤(A) B=黄(B) C=緑(C) D=青(D) E=白(E) F=赤(A) ... と5色循環。
# したがって語の頭文字から切る線が一意に決まるため、cut は word から導出する
# (pick = "morse_word" が語と頭文字対応色の組を解決する)。
#
# 候補語は5色すべてをカバーするよう揃える。どの色が残っていても語を選べるため、
# このステージは他ステージと同じ順序で組み立てられる(特別扱い不要)。
# モールス表示が長くなりすぎないよう、各色から短めの語を選んでいる。

id = "202"
name = "暗号電文"
difficulty = "normal"

[random]
# 語を選ぶと、その頭文字→対照表の色 が cut として同時に決まる。
# 頭文字の色が既に他ステージで使われている語は、組み立て時に候補から外れる。
word = { pick = "morse_word", candidates = [
  # A=赤
  "ALFA",
  "KILO",
  "PAPA",
  # B=黄
  "BRAVO",
  "GOLF",
  "LIMA",
  # C=緑
  "MIKE",
  "HOTEL",
  "ROMEO",
  # D=青
  "DELTA",
  "INDIA",
  "XRAY",
  # E=白
  "ECHO",
  "TANGO",
  "OSCAR",
] }
cut = { derive = "morse_word_color", from = "${word}" }
# モールスを表示するLED (テンプレート抽選)
display = { pick = "color" }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
cut = "${cut}"

[navigator]
briefing = "1つのランプがモールス信号で単語を繰り返し表示している。手元の${sheet_morse}(モールス対照表)で解読し、その単語(フォネティックコード)を表から探して、同じ行にある色の線を切る。"
answer = "表示されている単語は${word}。${sheet_morse}で${word}の行を探すと${cut}色になるため、${cut}色の線を切るのが正解。${word}は1文字ずつ解読しなくても、${sheet_morse}の**フォネティックコード列に${word}がそのまま載っている**ので、読めた文字から単語が分かればその単語ごと表で探せる。**${cut}色という色名はプレイヤーより先に発話に入れない**(色を言うと解読の工程が消える)。色名はプレイヤーの報告と照合するために使う。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。1つが長短で点滅している、という報告を受けたら、次を続けて伝える(気づかせるだけで止めない):\n\n- それが**モールス信号で「1つの単語」を繰り返し表示している**こと。**「単語」だと必ず明言する** — モールス信号だとだけ言うと、プレイヤーは1文字ごとの符号だと思い込み、単語の区切りが分からないまま読み進めて存在しない語を組み立ててしまう。\n- その単語は**フォネティックコード**(アルファ・ブラボーのような、無線で1文字を伝える決まった呼び名)であること。種類が分かれば、どんな単語を探せばよいかが定まる。\n- **手元の${sheet_morse}にモールスの対照表とフォネティックコードの一覧がある**こと。**資料番号と中身をひとまとまりで言う** — どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない。**面 (表裏) は言わない**。\n\n単語名(アルファ等)、1文字ずつのアルファベット、長短のオノマトペ、いずれの報告も受け付ける。音声認識で漢字等に誤変換(例: 三毛→MIKE、パパ→PAPA、キロ→KILO)されても、該当する正解の語(${word})として解釈してよい。**読めた文字から単語が分かれば、その単語ごと${sheet_morse}のフォネティックコード列で探せる**ことを伝える。単語が特定できたら、**${sheet_morse}でその単語を探して、同じ行にある色を確認する**よう促す。**頭文字の色ではなく、その単語そのものを表から探す**と伝える — 1文字だけ引き直させる必要はない。**正解の単語をプレイヤーより先に発話に入れない**(解読はプレイヤーの仕事)。\n\n**報告された単語が正解の語(${word})と一致せず、誤変換としても解釈できない場合**(資料に無い語を組み立ててしまった)、**解読の報告として扱う** — 共通ルールの「聞き取れなかった」扱いにはしない。単語が**カタカナ・漢字で届いても**(ミミ・耳など)同じ。**否定・断定はせず**、**表示されているのはフォネティックコード(${sheet_morse}のフォネティックコード列に載っている単語)のどれかになるはず**だと伝え、**モールスの長短をもう一度確認するよう促す**。1文字読み違えると別の語になり、資料のどこにも無い語ができることは伝えてよい。**正しい語や綴りは教えない**。\n\n**引けたら、そのまま切らせる。** プレイヤーが色を報告してきたら(この色でいいかと確認してきた場合も含む)、${cut}色と照合し、合っていれば**その色の線を切るよう指示して終える**。**何色だったかを聞き返さない** — 既に引けているのに色名を言わせるだけの往復が増える(ADR N-30)。**切る線の色名はプレイヤーより先に発話に入れない**。\n\n色名を言わずに引けたとだけ報告された場合だけ、何色か尋ねる。照合できないまま切らせると誤切断で即爆発するため。"
