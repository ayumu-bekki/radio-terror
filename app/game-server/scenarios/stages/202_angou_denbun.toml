# 202. 暗号電文 (docs/puzzle_stage_ideas.md §2.2)
# LEDが**英字1文字**をモールス信号でループ表示する (決定152)。
# 手元の紙資料のモールス対照表 (資料1。各文字に色付きの固定印刷。5色を循環割当) で
# その1文字を読み、その文字の行に書かれている色の線を切る。
# 資料の呼称は config.toml の [mission_sheet.documents] から引く
# (${sheet_morse})。
#
# 以前はフォネティックコードの単語 (ALFA 等) を表示していたが、ノーマルには
# 難しすぎた (文字の区切りの見落とし・長い光の数え落としが続いた。決定146〜148)。
# 単語を読むのは 302 暗号電文・ジャミング (難しい) に残し、202 は1文字で
# 「モールスを読んで表を引く」を覚える入口にする。
#
# 対照表の色割当: A=赤(A) B=黄(B) C=緑(C) D=青(D) E=白(E) F=赤(A) ... と5色循環。
# cut は文字の行の色から導出する (pick = "morse_word" は1文字の候補でもそのまま使える)。
#
# **E (・) と T (－) は出題しない**。長短が1つだけで、繰り返すとただの点滅に見え、
# モールスだと気づきにくい。残る24文字で5色すべてをまかなえる (各色3〜6文字)。

id = "202"
name = "暗号電文"
difficulty = "normal"

[random]
# 文字を選ぶと、その行の色が cut として同時に決まる。
# 色が既に他ステージで使われている文字は、組み立て時に候補から外れる。
word = { pick = "morse_word", candidates = [
  "A", "F", "K", "P", "U", "Z", # 赤
  "B", "G", "L", "Q", "V",      # 黄
  "C", "H", "M", "R", "W",      # 緑
  "D", "I", "N", "S", "X",      # 青
  "J", "O", "Y",                # 白 (E は長短が1つなので除く)
] }
cut = { derive = "morse_word_color", from = "${word}" }
# モールスを表示するLED (テンプレート抽選)。**切る線と同じ色は避ける** —
# 1文字の出題では5回に1回同じ色になり、「光っている色を切ればいい」近道になる (決定152)
display = { pick = "color", exclude = ["${cut}"] }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
cut = "${cut}"

[navigator]
briefing = "1つのランプがモールス信号で**英字1文字**を繰り返し表示している。手元の${sheet_morse}(モールス対照表)の符号と照らしてその1文字を読み、表のその文字の行に書かれている色の線を切る。"
# **正解の文字はナビから伏せる** (決定142・決定152)。1文字でも、知っていると
# 読み違いを正解へ寄せたり「違う」と言い切ったりする。単独の英字として伏せる
# (stageNavigatorText は1文字の語を前後が英字でないときだけ伏せる)。
secret_word = "${word}"
# 表の作りとゴールは必ず渡す (決定145)。モールスだと未説明なら、先頭にその一文が足される (決定150)
must_say = "**${sheet_morse}の表は1行に「文字・モールス信号・フォネティックコード・色」が並んでいる**こと。ランプは**1つの文字**を繰り返していて、長短を表のモールス信号の列と照らしてその**文字を見つけ、その行に書かれている色の線を切る**こと"
# 資料1の表 (色の列を除く) と読み方をナビに渡す (決定143)
morse_sheet = "${sheet_morse}"
answer = "表示されている文字は${word}(あなたには分からない)。プレイヤーが読んだその文字の行を${sheet_morse}の表で引くと、切る線の色がある。**${cut}色という色名はプレイヤーより先に発話に入れない**(色を言うと解読の工程が消える)。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。1つが長短で点滅している、という報告を受けたら、「この課題で必ず言うこと」を伝える。**「1文字」だと必ず明言する** — 単語だと思い込むと、長い消灯のたびに別の文字だと数えて存在しない綴りを組み立ててしまう。**手元の${sheet_morse}にモールス信号の対照表がある**ことは資料番号と中身をひとまとまりで言う。**面 (表裏) は言わない**。\n\n**モールス信号の読み方が分かるかを尋ねる**(決定149)。表の作りとゴールを伝えた発話の最後に尋ねる。プレイヤーがすでに文字や長短を報告しているなら尋ねない。\n- **分からない**と答えたら、「モールスの読み方」の手順を**最初の1〜2ステップから**、見え方のたとえと数え方の工夫で丁寧に教える(秒数は言わない)\n- **分かる**と答えたら、読めた文字を報告するよう促す\n\n**あなたは正解の文字を知らない。**読むのはプレイヤーで、あなたは読めた文字の行を表で引く手順へ導く。報告は文字 (エー・ビー…)、フォネティックコードの呼び名 (アルファ等。その頭文字の1文字として受け取る)、長短の並び (長・短…) のどれでも受け付ける。報告された文字が合っているかは**判定しない**。\n\n**プレイヤーが手順を分かっていない様子なら**(「〜って何?」「どういうこと?」)、結論だけを言い換えず、**流れを1から順に説明し直す**: (1) ランプの点滅はモールス信号で1文字を繰り返している (2) しばらく消えたあとから、長短を数える (3) ${sheet_morse}の表のモールス信号の列と照らして文字を見つける (4) その文字の行に書かれている色の線を切る。聞かれた言葉が流れのどこに当たるかを示す。\n\n**2文字以上に読めたと報告されたら**、表示は1文字なので、**文字の区切りと取り違えている**可能性が高い。サーバーの照合結果 (どの1文字と同じ長短の並びか) に沿って、つなげると1文字になることを具体的に伝える。\n\n**引けたら、そのまま切らせる。** プレイヤーが表で引いた色を報告してきたら(この色でいいかと確認してきた場合も含む)、**その色の線を切るよう指示して終える**。**何色だったかを聞き返さない**(ADR N-30)。色名を言わずに引けたとだけ報告された場合だけ、何色か尋ねる。"
