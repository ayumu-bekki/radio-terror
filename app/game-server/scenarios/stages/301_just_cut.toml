# 301. ジャストカット (docs/puzzle_stage_ideas.md §2.3)
# 「タイマーの秒の一の位がNのときに○色の線を切る」。
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒。窓を外したら即爆発。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "301"
name = "ジャストカット"
difficulty = "hard"

[random]
cut = { pick = "line" }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { timer_digit = { digit = "ones", value = "${digit}" } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "カウントダウン表示の秒の一の位が指定の数字になった瞬間に線を切る。タイミングを外すと即座に失敗する。"
# 切る線の色は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて L1 から色名が漏れる。
answer = "正解はタイマーの秒の一の位が${digit}のときに、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。判定窓は約2秒。"
procedure = "表示は「123.4」形式なので、「小数点のすぐ左の数字」という言い方で桁を明確にする。無線に数秒のタイムラグがあるため、ナビゲーターから「今だ」とリアルタイムに指示してはいけない。事前に**「小数点の左の数字が${digit}になった瞬間」**という条件を伝え、プレイヤー自身にタイミングを計らせる。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。報告を受けてから、タイマーの数字に注目させ、切るタイミングが決まっていることを伝える。切る線の色名はこちらから言わず、プレイヤーに報告させること"
hint_l2 = "小数点のすぐ左の数字(秒の一の位)が手がかりだと伝える"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると読み落とされる。
hint_l3 = "「小数点の左の数字が${digit}になった瞬間に切る」と手順を教えてよい。切る線の色名は言わないこと。点灯しているランプは1つだけなので、『光っているランプと同じ色の線』と言えば伝わる"
