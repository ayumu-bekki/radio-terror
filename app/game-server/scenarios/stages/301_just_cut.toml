# 301. ジャストカット (docs/puzzle_stage_ideas.md §2.3)
# 「タイマーの秒の一の位がNのときに○色の線を切る」。
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒。窓を外したら即爆発。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "301"
name = "ジャストカット"
difficulty = "hard"

[random]
cut = { pick = "line" }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { timer_digit = { digit = "ones", value = "${digit}" } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "カウントダウン表示の秒の一の位が指定の数字になった瞬間に線を切る。タイミングを外すと即座に失敗する。"
answer = "正解はタイマーの秒の一の位が${digit}のときに${cut}色の線を切ること。判定窓は約2秒。"
procedure = "表示は「123.4」形式なので、「小数点のすぐ左の数字」という言い方で桁を明確にする。無線に数秒のタイムラグがあるため、ナビゲーターから「今だ」とリアルタイムに指示してはいけない。事前に「小数点の左の数字が${digit}になった瞬間に切れ」と伝え、プレイヤー自身にタイミングを計らせる。"
hint_l1 = "タイマーの数字に注目させ、切るタイミングが決まっていることを伝える"
hint_l2 = "小数点のすぐ左の数字(秒の一の位)が手がかりだと伝える"
hint_l3 = "「小数点の左の数字が${digit}になった瞬間に切る」と手順を教えてよい(線の色は言わない)"
