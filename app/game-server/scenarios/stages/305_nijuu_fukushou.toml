# 305. 二重復唱 (docs/puzzle_stage_ideas.md §2.3)
#
# 201 復唱の難しい版。5個のボタン列を**2周**押す(計10回)。
# ナビゲーターは1周目しか読み上げないため、2周目は記憶だけが頼りになる。
#
# 「列を長くする」のではなく「記憶を試す」方向で難度を上げているので、
# 201 と同じセッションに出ても繰り返し感が出にくい。
#
# ミスは列の先頭(1周目の1個目)からやり直し。10回連続で正しく押す必要がある。

id = "305"
name = "二重復唱"
difficulty = "hard"

[random]
cut = { pick = "line" }
p1 = { pick = "color" }
p2 = { pick = "color" }
p3 = { pick = "color" }
p4 = { pick = "color" }
p5 = { pick = "color" }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
# 同じ列を2回繰り返す。push_seq は単一の列として扱うため、
# entries に同じ並びを2周分書けばそのまま「2周押す」になる。
precondition = { push_seq = { entries = [
  { push = "${p1}" },
  { push = "${p2}" },
  { push = "${p3}" },
  { push = "${p4}" },
  { push = "${p5}" },
  { push = "${p1}" },
  { push = "${p2}" },
  { push = "${p3}" },
  { push = "${p4}" },
  { push = "${p5}" },
], on_wrong_press = { action = "retry" } } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "5個のボタン列を2周押す必要がある。1周目は読み上げるが、2周目は自分で思い出して押す。1つでも間違えると最初からやり直し。"
answer = "正解はボタンを${p1}→${p2}→${p3}→${p4}→${p5}の順に押し、**続けてもう一度同じ順**で押してから、${cut}色の線を切ること。"
procedure = "1周目は読み上げて誘導する。5個目まで押せたら『もう一度、同じ順番で』とだけ伝え、**2周目は色を言わない**。詰まって聞かれた場合、ヒントレベルが許す範囲でのみ答える(L3以上なら読み上げてよい)。ミスで先頭に戻ったら1周目から読み上げ直す。"
# **1周目は最初から読み上げる。伏せるのは2周目だけ。**
# 列そのものは装置に現れないため、1周目まで伏せるとプレイヤーは手詰まりになる
# (102 の実プレイで発生)。このステージの謎は「1周目を覚えていられるか」なので、
# 1周目を教えても難度は落ちない。
hint_l1 = "ボタン列はナビゲーターしか知らない。1周目の列(${p1}→${p2}→${p3}→${p4}→${p5})を読み上げ、2周押す必要があること・2周目は自分で思い出すことを伝える"
hint_l2 = "1周目を読み上げ直して覚えるよう促す。2周目に入る前に『覚えましたか』と確認する"
hint_l3 = "2周目に詰まっていれば列を読み上げてよい。押し終わったら切る線も伝えてよい"
