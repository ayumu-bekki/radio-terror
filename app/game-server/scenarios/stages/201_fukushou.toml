# 201. 復唱 (docs/puzzle_stage_ideas.md §2.2)
# 「赤赤黄黄赤の順でボタンを押してから、○色の線を切ってください」
# 無線で1回聞いて覚えられる長さ(5個)にする。ミスは列の先頭からやり直し。
# より難しい版は 305 二重復唱 (同じ列を2周)。

id = "201"
name = "復唱"
difficulty = "normal"

[random]
cut = { pick = "line" }
# **押下色から ${cut} を外す**。列は最初から読み上げる仕様なので、
# 列に正解色が混ざると第一声で正解色を音として出してしまい、
# 押し終わりの「${cut}色の線を切れ」と繋がった瞬間に答えが割れる。
# 300シードで測ると 65% で衝突していた (102/305 も同じ)。
#
# 残り4色から5個引くので同色の重複は増えるが、このステージの難しさは
# **聞いて覚えること**なので、色数が減っても列の記憶負荷は変わらない。
p1 = { pick = "color", exclude = ["${cut}"] }
p2 = { pick = "color", exclude = ["${cut}"] }
p3 = { pick = "color", exclude = ["${cut}"] }
p4 = { pick = "color", exclude = ["${cut}"] }
p5 = { pick = "color", exclude = ["${cut}"] }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { push_seq = { entries = [
  { push = "${p1}" },
  { push = "${p2}" },
  { push = "${p3}" },
  { push = "${p4}" },
  { push = "${p5}" },
], on_wrong_press = { action = "penalty", penalty_ms = 5000 } } }

[navigator]
briefing = "5個のボタン列を順番どおりに押し切る必要がある。1つでも間違えると最初からやり直しになる。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが1つだけ点灯していることを報告できたか。色名まで言えていればなおよい"
# ボタン列は読み上げてよいが、切る線の色は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて色名が漏れる。
answer = "正解はボタンを${p1}→${p2}→${p3}→${p4}→${p5}の順に押してから、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。"
# **ボタン列は装置に現れない。最初から読み上げる。**
# 列を知っているのはナビゲーターだけで、プレイヤーは観察でも推理でも
# たどり着けない。「順番がある」とだけ伝えて色を伏せると手詰まりになる
# (102 の実プレイで発生)。このステージの難しさは**聞いて覚えること**であって、
# 色を教えてもらえないことではない。
#
# ヒント段階で調整するのは「一度に何色まで言うか」であって、言うか言わないかではない。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここで列を読み上げてはいけない** — 質問しておきながら返事を待たずに順番を言い切ると、尋ねた意味がなくなる。**プレイヤーがランプの状態を報告し、それが装置の状態(1つだけ点灯)と一致してから**、『それは順番に押すタイプだ』と種類を伝えて列を読み上げる。**このとき経験談や注意を足さない** — 復唱 + 種類 + 列だけで十分長い。「ミスしたら最初からやり直し」は列を押し始めてから、別の発話で伝える。**報告より先に順番を求められても、まずランプを尋ね返すこと** (『まずランプがどうなっているか教えてくれ』) — 装置を見ないまま列だけ受け取っても操作できない。報告が装置の状態と食い違う場合は、列を渡さずに確認し直させる。列は装置に現れないので教えること自体は必要だが、それは照合のあと。無線で1回聞いて覚えられる長さ(5個)なので、まず通しで読み、そのあと押せたところを確認しながら進める。聞き返されたら何度でも繰り返す(往復自体が時間消費になるが、教えないことによる手詰まりよりはよい)。ミスしたら先頭からやり直しになることを伝える。押し終わったら『光っているランプは何色か』を尋ね、報告を復唱してから**「その色の線」**を切るよう指示する。**切る線の色名だけはプレイヤーに先に言わせること**(ボタンの色名はこちらから言ってよい)。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**この第一声では列を読み上げない**。報告が装置の状態(1つだけ点灯)と一致したら、『それは順番に押すタイプだ』と種類を伝えたうえでボタン列(${p1}→${p2}→${p3}→${p4}→${p5})を読み上げ、押し始めさせる。**報告より先に順番を求められても答えず、まずランプを尋ね返すこと**。列はナビゲーターしか知らないので、照合のあとは必ず教えること"
hint_l2 = "列を2〜3個ずつに区切って読み上げ、押せたところまで確認しながら進める"
# 切る線の色は**言わない**。点灯しているランプは正解色の1つだけなので、
# 「光っているランプと同じ色」で一意に決まり、伏せても手詰まりにならない
# (102 と同じ形)。「切る線も伝えてよい」と書いていたため、L3 で色名を
# 直言していた (シミュレーションで発生)。伏せるのは推理できる情報だけ。
hint_l3 = "列を最初から通しで繰り返し読み上げる。押し終わったら切る線を**「光っているランプと同じ色の線」**という言い方で伝えてよい。切る線の色名はこちらから言わず、プレイヤーに報告させること"
