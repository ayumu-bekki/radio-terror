# 201. 復唱 (docs/puzzle_stage_ideas.md §2.2)
# 「赤赤黄黄赤の順でボタンを押してから、○色の線を切ってください」
# ミスは列の先頭からやり直し。
#
# ## 列の長さは難易度で変わる (ADR S-11)
#
# イージー・ノーマルは5個 (**無線で1回聞いて覚えられる長さ**)、
# **ハードは8個**。長さは難易度テンプレートの `[load] push_seq_len`
# から引く。**ステージ側に直書きしない**。
#
# **ハードは「普通×2」を引く**ため、normal タグのこのステージも
# ハードのセッションに出る。そのときに8個になる。
#
# 8個を超えて伸ばさない — 記憶ではなく「読み上げを何度も聞き直す」
# 時間になり、無線の往復が増えるだけで謎が難しくなるわけではない。

id = "201"
name = "復唱"
difficulty = "normal"

[random]
cut = { pick = "line" }
# **押下色から ${cut} を外す**。列は最初から読み上げる仕様なので、
# 列に正解色が混ざると第一声で正解色を音として出してしまい、
# 押し終わりの「${cut}色の線を切れ」と繋がった瞬間に答えが割れる。
# 300シードで測ると 65% で衝突していた (103 コール&レスポンス も同じ)。
#
# 残り4色から引くので同色の重複は増えるが、このステージの難しさは
# **聞いて覚えること**なので、色数が減っても列の記憶負荷は変わらない。
#
# `color_seq` は**重複を許し、引いた順のまま**返す (`colors` と違い
# 並べ替えない)。「赤赤黄黄赤」の繰り返しはこのステージの持ち味。
# ただし**同じ色の3連続は避ける** — 無線で「赤赤赤」と読み上げると
# 何個言われたか数えられず、記憶ではなく聞き取りの問題になる。
# 最初に点灯させる**報告用の色**。切る線とは別の色にする (ADR C-13)。
# 押し切ると `reveal_cut_on_complete` でこの色が消え、${cut}色が点灯する。
lit = { pick = "color", exclude = ["${cut}"] }

# **押下色から ${lit} も外す** — 報告した色をそのまま押すと
# 対話の一往復が消える (103 コール&レスポンス と同じ)。
seq = { pick = "color_seq", count = "${load_push_seq_len}", exclude = ["${cut}", "${lit}"] }

[core]
# **最初は報告用の色だけを点灯**させる (ADR C-13)。
# 押し切ると `reveal_cut_on_complete` が働き、${cut}色だけが点灯する。
#
# **103 コール&レスポンスとは見え方が違う** — あちらは押下中から
# 「報告用の点灯」と「切る線の点滅」を**両方見せる** (ADR C-13)。
# 201 は押し切るまで正解が見えないので、
# 『押し終わったらランプが変わった』という**変化の報告**が生まれる。
leds = { "${lit}" = "on" }
cut = "${cut}"
# `colors` を渡すと各色が { push = "<色>" } の1エントリへ展開される。
# **entries を直接書かない** — 個数が固定されて難易度で伸ばせない。
precondition = { push_seq = { colors = "${seq}", reveal_cut_on_complete = true, on_wrong_press = { action = "penalty", penalty_ms = 5000 } } }

[navigator]
briefing = "ボタン列を順番どおりに押し切る必要がある。1つでも間違えると最初からやり直しになる。列の長さは難易度によって変わる(5個または8個)。**押し切るとランプの色が変わり、切る線がそこで初めて分かる**。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが1つだけ点灯していることを報告できたか。色名まで言えていればなおよい(**この時点で点いている色は切る線ではない**)"
# ボタン列は読み上げてよいが、切る線の色は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて色名が漏れる。
answer = "正解はボタンを**${seq}**の順に押してから、**そのとき点灯しているランプと同じ色**の線を切ること。\n\n**押す前と後でランプの色が変わる。** 最初に点いているのは${lit}色(報告用)で、これは切る線ではない。押し切ると${lit}色が消えて**${cut}色だけが点灯**する。\n\n点灯しているのは1色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。**${lit}色を切らせない** — 押す前に見た色をそのまま切ろうとしたら、押し終わったあとのランプを見直させる。"
# **ボタン列は装置に現れない。最初から読み上げる。**
# 列を知っているのはナビゲーターだけで、プレイヤーは観察でも推理でも
# たどり着けない。「順番がある」とだけ伝えて色を伏せると手詰まりになる
# (102 の実プレイで発生)。このステージの難しさは**聞いて覚えること**であって、
# 色を教えてもらえないことではない。
#
# ヒント段階で調整するのは「一度に何色まで言うか」であって、言うか言わないかではない。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここで列を読み上げてはいけない** — 質問しておきながら返事を待たずに順番を言い切ると、尋ねた意味がなくなる。**プレイヤーがランプの状態を報告し、それが装置の状態(1つだけ点灯)と一致してから**、『それは順番に押すタイプだ』と種類を伝えて列を読み上げる。**このとき経験談や注意を足さない** — 復唱 + 種類 + 列だけで十分長い。「ミスしたら最初からやり直し」は列を押し始めてから、別の発話で伝える。**報告より先に順番を求められても、まずランプを尋ね返すこと** (『まずランプがどうなっているか教えてくれ』) — 装置を見ないまま列だけ受け取っても操作できない。報告が装置の状態と食い違う場合は、列を渡さずに確認し直させる。列は装置に現れないので教えること自体は必要だが、それは照合のあと。**列が長いときほど区切って読む** — 5個なら通しで読んでよいが、8個なら2〜3個ずつに区切り、押せたところを確認しながら進める。聞き返されたら何度でも繰り返す(往復自体が時間消費になるが、教えないことによる手詰まりよりはよい)。ミスしたら先頭からやり直しになることを伝える。押し終わったら『光っているランプは何色か』を尋ね、報告を復唱してから**「その色の線」**を切るよう指示する。**切る線の色名だけはプレイヤーに先に言わせること**(ボタンの色名はこちらから言ってよい)。\n\n**押し切ったあとが第二の山場。** 押し終わると**ランプの色が変わる**ので、『ランプはどうなった?』ともう一度尋ね、変化を報告させる。そのうえで『今光っている色の線を切れ』と指示する。\n\n**押す前に見た色を切らせない。** プレイヤーが最初の色を挙げてきたら、押し終わったあとのランプを見直させること。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**この第一声では列を読み上げない**。報告が装置の状態(1つだけ点灯)と一致したら、『それは順番に押すタイプだ』と種類を伝えたうえでボタン列(**${seq}**)を読み上げ、押し始めさせる。**列が長い場合は区切って読む**。**報告より先に順番を求められても答えず、まずランプを尋ね返すこと**。列はナビゲーターしか知らないので、照合のあとは必ず教えること"
hint_l2 = "列を2〜3個ずつに区切って読み上げ、押せたところまで確認しながら進める。**列が長いほど区切りを細かくする**。押し切れたら『ランプがどうなったか』を尋ねる(**押し切ると色が変わる**)"
# 切る線の色は**言わない**。点灯しているランプは正解色の1つだけなので、
# 「光っているランプと同じ色」で一意に決まり、伏せても手詰まりにならない
# (102 と同じ形)。「切る線も伝えてよい」と書いていたため、L3 で色名を
# 直言していた (シミュレーションで発生)。伏せるのは推理できる情報だけ。
hint_l3 = "列を最初から通しで繰り返し読み上げる。\n\n**押し終わったらランプが変わる。** 押し切ったら『ランプがどうなったか』を尋ね、**変わったあとの色**を報告させる。そのうえで切る線を**「今光っているランプと同じ色の線」**という言い方で伝えてよい。\n\n切る線の色名はこちらから言わず、プレイヤーに報告させること。**押す前に点いていた色を切らせない** — 最初の色を挙げてきたら、押し終わったあとのランプを見直させる"
