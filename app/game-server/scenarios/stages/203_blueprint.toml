# 203. ブループリント (docs/puzzle_stage_ideas.md §2.2)
# 手元の紙資料にある「整備マニュアル風の回路図」(資料3) を使う。
# 資料の呼称は config.toml の [mission_sheet.documents] から引く
# (${sheet_circuit})。
# ナビゲーターは色を言わず「端子T4の線を切ってください」とだけ指示する。
#
# 端子番号(T1-T5) ⇔ 配線色 の対応はシートに印刷された固定内容のため、
# 端子は**2系統ある** (X1-X5 / Y1-Y5)。プレイヤーは Core 外装のシリアル銘板の
# 下1桁を見て、奇数なら X系統、偶数なら Y系統を使う (ADR D-6)。
# ナビゲーターは**両方の端子番号を並べて**伝え、どちらを使うかはプレイヤーが選ぶ。
# **サーバーは個体のシリアルを知らない** — だからこそ両方を渡す。
#
# サーバー設定 (config.toml の [mission_sheet.terminal_map_x / _y]) を参照して
# cut から両系統の端子番号を導出する。
#
# **全5色を点灯させる**のは、このステージだけの識別用パターン。
# 他のステージは「1色点灯」「2色点滅」「モールス」など部分的な表示しか使わず、
# 全灯はここでしか出ない。プレイヤーが「全部光っています」と報告し、
# ナビゲーターがそれを聞いて「回路図参照の合図だ」と応じることで、
# **報告 → 指示** の往復が成立する。
#
# 全灯は色のヒントを一切含まない (5色すべてが同じ表示) ため、
# 「シートだけが手がかり」という 205 の原則は保たれる。難度は変わらない。

id = "203"
name = "ブループリント"
difficulty = "normal"

[random]
cut = { pick = "line" }
# 切る線の色から、両系統の端子番号を引く。
# **どちらか一方だけを渡さない** — サーバーは個体のシリアルを知らないため、
# 系統の選択はプレイヤーに委ねる (ADR D-6)。
terminal_x = { derive = "terminal_for_color", from = "${cut}", series = "x" }
terminal_y = { derive = "terminal_for_color", from = "${cut}", series = "y" }

[core]
# 全5色を点灯させる = このステージだけの識別用パターン。
# 色のヒントにはならない (どの色も同じ表示) ため、謎の難度は変わらない。
leds = { "A" = "on", "B" = "on", "C" = "on", "D" = "on", "E" = "on" }
cut = "${cut}"

[navigator]
briefing = "5つのランプが全て点灯している状態は、手元の${sheet_circuit}(回路図)を参照せよという合図。${sheet_circuit}には**2系統の端子**(X1〜X5 / Y1〜Y5)と配線色の対応が描かれている。どちらの系統を使うかは**Core外装のシリアル銘板の下1桁**で決まり(奇数=X / 偶数=Y)、ナビゲーターは両系統の端子番号を並べて伝える。色は言わない。"
answer = "正解は${cut}色の線。${sheet_circuit}では**X系統なら${terminal_x}、Y系統なら${terminal_y}**にあたる。資料は端子番号から**点線と太い線の2本**が出ており、両方たどると同じ色に着地する(答え合わせを兼ねた二重表現)。**プレイヤーに伝えてよいのは端子番号(${terminal_x}と${terminal_y})と、この読み方の手順**で、${cut}色という色名は最後まで口に出さない(色を言うと資料を読む工程が消え、このステージが成立しなくなる)。色名は、プレイヤーの報告が合っているかを照合するためだけに使う。**どちらの系統かはこちらで決めない** — サーバーは個体のシリアルを知らないため、必ず両方を並べて伝え、選ぶのはプレイヤーに任せる。ランプは5色すべてが点灯している(色のヒントではなく、回路図参照を示す合図)。"
# まずランプの状態を報告させる。全灯はこのステージにしか出ない表示なので、
# 「全部光っている」という報告を受けてから端子番号を出す流れが成立する。
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。全部光っている、という報告を受けたら、**全灯は回路図を見ろという合図だ**と応じ、**手元の${sheet_circuit}に回路図がある**ことを資料番号と中身を続けて伝える(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**。\n\n続けて、**シリアル銘板の下1桁が奇数なら${terminal_x}、偶数なら${terminal_y}**と、**両系統の端子番号を並べて**伝える。**どちらかに絞って言わない** — 銘板を見て選ぶのはプレイヤーの仕事(サーバーは個体のシリアルを知らない)。\n\n**資料の読み方まで伝える。** 端子番号を言うだけでは、資料のどこをどう見ればよいか分からない。**その端子番号から点線と太い線の2本が出ていること、両方たどると同じ色に着くこと、その色の線を切ること**を一緒に伝える。たどれと言うだけの曖昧な促しで終えない。**系統の選び方や読み方で迷っていたら、具体的に説明し直してよい**。\n\nプレイヤーが色を復唱してきたら、${sheet_circuit}で確認できたかだけを確認する。**切る線の色名は発話に入れない**。\n\n**色を教えてほしいと求められたときの返し方**。こちらは回路図を持っておらず、本当に**分からない**。次の順で1つの発話にまとめる:\n\n1. 何色かは**こちらからは見えない・分からない**と伝える\n2. **${sheet_circuit}の端子からたどれば分かる**と、見る場所を伝える\n3. 端子番号(${terminal_x} / ${terminal_y})をもう一度添える\n\n突き放さず、資料を見てもらう形で頼む。言い方はキャラクターに任せる。"
