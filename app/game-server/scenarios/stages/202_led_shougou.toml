# 202. LED照合 (docs/puzzle_stage_ideas.md §2.2)
# ランプの点灯パターンを紙資料で3段階に読み解き、**ダイヤル位置と切る線の両方**を
# 導く。202 で唯一「表示から2つの答えが出る」ステージ。
#
#   ランプ4つの点灯/消灯 → 変換表でキーワード       (例 INDEX)
#   キーワードの頭文字   → デコード表でダイヤル位置 (I → 1)
#   キーワードの末尾文字 → デコード表で基準色       (X → 緑)
#   基準色 + ランプの状態 → 分岐表で切る線が決まる   (緑・白点灯 → 緑)
#
# **3つの表は同じ資料番号 (資料2) にまとめてある** (ADR D-2)。
# 必ず順にたどるため一部だけ見る場面が無く、番号を分けると
# ナビが段階ごとに番号を言い直すことになる。
#
# **回路図 (資料3) は参照しない** — あれは 205 専用。
# 202 の分岐表を回路図へ載せると、205 のプレイヤーの視界に
# 色の対応が入り、「シートだけが手がかり」という 205 の原則が壊れる。
#
# **赤のランプは常時消灯のダミー**。4bit = 16通りのうち全消灯だけは
# 故障と見分けがつかないため使わず、15通りを対照表に載せてある。
#
# 対照表は `scenario_codebook.go` に1箇所だけ置き、紙資料と突き合わせる
# (docs/printed_materials.md §4)。**cut から表示を逆引きする**ため、
# 他ステージとの色の重複 (ADR S-2) は通常どおり回避される。

id = "202"
name = "LED照合"
difficulty = "normal"

# **切る線の色名は L4 (直言) でも伏せる** (ADR N-38)。
# 色名を言うと資料を3枚たどる工程が丸ごと消え、この課題が成立しなくなる。
keep_cut_secret = true

[random]
cut = { pick = "line" }
# cut になる表示を対照表から1通り選ぶ (返り値は "1011" のような4桁2進表記)。
# **表示を先に抽選しない** — cut が表側で決まると色の重複を避けられない (ADR S-1)。
pattern = { pick = "codebook", cut = "${cut}" }
# 選ばれた表示から各項目を引く。**別々に人手で書かない** (ADR S-1)
lit = { derive = "codebook_field", from = "${pattern}", field = "lit" }
word = { derive = "codebook_field", from = "${pattern}", field = "word" }
rotary = { derive = "codebook_field", from = "${pattern}", field = "rotary" }

[core]
# 点灯するランプだけを指定する。赤(A)は常時消灯のダミーなので現れない。
leds = { "${lit}" = "on" }
cut = "${cut}"
# **ダイヤルを合わせた状態で切る**。位置は資料2 のデコード表で頭文字から引いた値。
precondition = { rotary = "${rotary}" }

[navigator]
briefing = "ランプの点灯パターンを紙資料で読み解く3段階の暗号。${sheet_codebook}には表が3つ並んでいる。まず変換表で点灯/消灯の並びをキーワードにし、次にデコード表でそのキーワードの頭文字と末尾文字を引いてダイヤル位置と基準色を出す。最後に分岐表で切る線が決まる。**すべて${sheet_codebook}の中で完結する**。**ダイヤルを合わせた状態で切る**必要がある。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**どのランプが点いていてどれが消えているか**を報告できたか。色名で並びが言えていれば報告できたとみなす"
# 文面は「照合の材料」として書く (202 旧版・208 と同じ方針)。
# 「正解は${cut}色」と結論を書くと、なぞられて L3 で言い切ってしまう。
# **結論を出すのはプレイヤー**。
answer = "点灯しているランプは${lit}(赤は常時消灯のダミー)。${sheet_codebook}の変換表で引くとキーワードは**${word}**。頭文字からデコード表でダイヤル位置**${rotary}**が出る。末尾文字から基準色が出て、分岐表まで解くと${cut}色になる。**ダイヤルを${rotary}に合わせた状態で切る**。**この読み解きはプレイヤーにさせること** — ${cut}色という色名は報告と照合するために使い、こちらからは言わない。ダイヤル位置${rotary}は伝えてよい(装置にもランプにも現れず、資料を引かないと出ない情報ではあるが、色と違って答えそのものではない)。"
# **どこを見るかは資料番号で一言で指す** (ADR D-2)。初出は中身も添える (ADR D-4)。
# **面 (表裏) は言わない** — 探すのも体験のうちで、刷り直しにも強い。
procedure = "まず『ランプはどうなっている?』と尋ね、**点いているランプと消えているランプを色で報告させる**。赤は常に消えているダミーなので、報告に赤が無くても正しい。\n\n報告を受けたら**「手元の${sheet_codebook}にランプの並びを言葉に変える表がある」**と資料番号と中身を続けて伝え、キーワードを引かせる。**キーワードをこちらから言わない** — 表を引くのはプレイヤーの仕事。読めたキーワードを報告させ、合っているかを照合して認める。\n\n次に**「同じ${sheet_codebook}のもう一つの表で、頭文字と末尾文字を引け」**と指示する。**資料番号を言い直さない** — 同じ紙の中で視線を移すだけなので、番号を繰り返すと別の紙を探しに行く。頭文字からダイヤル位置、末尾文字から基準色が出ることを伝える。**ダイヤル位置は数字で言ってよい**。\n\n最後に**「同じ${sheet_codebook}の分岐表を見ろ」**と指示し、基準色とランプの状態から切る線が決まることを伝える。**ここでも資料番号を言い直さない** — 3つの表はすべて同じ紙にある。**切る線の色名はこちらから言わない**。プレイヤーが色を報告してきたら照合して認める。\n\n**ダイヤルを合わせてから切るよう必ず念を押す**。位置が合っていないと正しい線でも切れない。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、点いているランプと消えているランプを色で報告させる。赤は常時消灯のダミーだと教えてよい。報告を受けたら**「手元の${sheet_codebook}にランプの並びを言葉に変える表がある」**と資料番号と中身を続けて伝える(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**"
hint_l2 = "**「${sheet_codebook}でキーワードを引け」**と指示し、読めたら**「同じ紙のもう一つの表で頭文字と末尾文字を引け」**と続ける(**資料番号を言い直さない** — 同じ紙の中の別の表なので、番号を繰り返すと別の紙を探しに行く)。頭文字がダイヤル位置、末尾文字が基準色になることを伝える。**ダイヤル位置${rotary}は伝えてよい**"
# 分岐の**読み方**は伝えるが、**結論はプレイヤーに出させる**。
# このステージの謎は「資料を3枚たどる」ことなので、
# 「だから緑を切れ」と結論まで言うと最後の一手が消える。
hint_l3 = "分岐表の読み方を具体的に説明してよい(基準色が白か黄なら緑のランプ、それ以外なら白のランプを見る)。ダイヤルを${rotary}に合わせてから切るよう念を押す。**切る線の色名はこちらから言わない** — プレイヤーに判断させ、報告された色を照合して認める"
