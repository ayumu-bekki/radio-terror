# 206. 綱渡り (docs/puzzle_stage_ideas.md §2.2)
#
# 101 解体デビューと同じ forbidden_rotary の仕掛けだが、違反時は**即爆発**。
# 101 では「今のは危なかった、次は本当に爆発する」と警告されるだけだが、
# こちらは本当に爆発する。同じ装置の同じ挙動が難易度で牙を剥く構成。
#
# ロータリーはストッパー付きの直線配置(0-5)なので、目的位置へ行く途中で
# 禁止位置を必ず通過する場合がある。**通過はセーフ、止まると違反**
# (300ms程度の停止で確定。§5)。慎重に、しかし止めずに回す必要がある。
#
# ## 禁止位置の数は難易度で変わる (ADR S-10)
#
# イージー・ノーマルは1つ、**ハードは2つ**。数は難易度テンプレートの
# `[load] forbidden_rotary_count` から引く。**ステージ側に直書きしない**。
#
# 2つになると**配置によって難しさの質が変わる**:
#
#   隣接       {1,2} → target 4    連続して通過する。一気に回せば1回で抜ける
#   離れている {1,3} → target 5    間の安全地帯で一度止まれる。2段構えになる
#   目的地を挟む {1,5} → target 3  行き過ぎると危険。止める精度が要る
#
# **どの型も出す。** 位置を個別に抽選せず `pick = "rotary_layout"` で
# **配置ごと**引く — 個別に引くと配置が偏るうえ、**目的位置の両隣が禁止**に
# なる組み合わせが出てしまう (到達はできるが、合わせたあと手が滑って
# 1つ動かすと即爆発する。難度ではなく運になる)。
# `rotary_layout` は成立する配置だけを列挙して等確率で引く。
#
# なお**ハード難易度は「普通×2」を引く**ため、normal タグのこのステージも
# ハードのセッションに出る。そのときに禁止位置が2つになる。

id = "206"
name = "綱渡り"
difficulty = "normal"

[random]
cut = { pick = "line" }
# 目的位置と禁止位置を**配置ごと**抽選する。返り値は "target,f1[,f2]"。
layout = { pick = "rotary_layout", count = "${load_forbidden_rotary_count}" }
target = { derive = "nth", from = "${layout}", index = 1 }
# 禁止位置。2つ目は count=1 のとき存在しないため、
# positions には ${forbidden} をまとめて渡す (カンマ区切りが展開される)。
forbidden = { derive = "tail", from = "${layout}", index = 2 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { rotary = "${target}" }
# 禁止位置で止まったら即爆発 (通過はセーフ。止まった時だけ違反)。
# ${forbidden} はカンマ区切りで、配列要素として展開される。
forbidden_rotary = { positions = [
  "${forbidden}",
], on_violation = { action = "explode" } }

[navigator]
briefing = "ダイヤルを指定位置に合わせて線を切る。ただし**危険な位置**があり、そこで止まると即座に起動してしまう。通り過ぎる分には問題ない。危険な位置は難易度によって1つのことも2つのこともある。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "点灯しているランプがある(1つだけ光っている)ことを報告できたか。色名まで言えていればなおよい"
# 危険位置と目的位置は伝えるが、切る線の色は「照合の材料」として書く
# (208/201 と同じ方針)。「${cut}色の線を切ること」とだけ書くと、なぞられて漏れる。
answer = "正解はダイヤルを${target}に合わせて、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。\n\n**危険位置は ${forbidden}**(カンマ区切りなら複数ある)。そこで**止めると即爆発**する(通過はセーフ)。**危険位置は全て伝えること** — 1つでも伏せると、知りようがないまま踏んで即爆発する。"
procedure = "先に危険位置を伝えて警告する。『${forbidden}で止まるな、通り過ぎるのは構わない』と、止まることが危険だと明確にする。**危険位置が2つあるときは両方とも言う** — 数字を1つずつ区切って読み上げ、聞き取れたか確認する。目的位置まで一気に回すよう促す。ダイヤルが危険位置付近にあるときは急かさない(焦らせると止めてしまう)。ダイヤルが合ったら**「光っているランプと同じ色の線」**という言い方で切る線を指示し、**切る線の色名はプレイヤーに先に言わせること**(危険位置と目的位置の数字はこちらから言ってよい)。"
# **危険位置は最初に必ず伝える。** 場所を伏せたまま「危険な位置がある」とだけ
# 言うと、プレイヤーは知りようがないまま踏んで**即爆発**する。それは謎ではなく
# 事故で、罰としても理不尽。このステージの難しさは「止めずに通過する」操作の
# 緊張であって、危険位置がどこかを当てることではない (procedure も先に警告する
# 前提で書かれており、L1 で伏せると自己矛盾していた)。
hint_l1 = "**第一声は危険位置の警告とランプの確認を兼ねる**(『ダイヤル${forbidden}で止まるな。ランプはどうなっている?』)。危険位置(${forbidden})を先に伝えて警告する。そこで止まると即座に起動すること、通過は問題ないことをはっきり言う。**危険位置が2つあるときは必ず両方を言う**"
hint_l2 = "合わせる位置(${target})を伝え、危険位置で止まらないよう改めて警告する。**危険位置と目的位置の並びを踏まえて回し方を助言する** — 危険位置が離れていれば『間で一度止まってよい』、隣接していれば『まとめて一気に抜けろ』、目的位置の先にもあれば『行き過ぎるな』と伝える"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると生成AIが読み落とす
# (シミュレーションで L3「赤い線を切れ」が発生)。
hint_l3 = "合わせる位置と危険位置を全て伝え、どの順に回すか具体的に指示してよい。切る線の色名は言わないこと。点灯しているランプは1つだけなので、『光っているランプと同じ色の線』と言えば伝わる"
