# 206. 綱渡り (docs/puzzle_stage_ideas.md §2.2)
#
# 101 解体デビューと同じ forbidden_rotary の仕掛けだが、違反時は**即爆発**。
# 101 では「今のは危なかった、次は本当に爆発する」と警告されるだけだが、
# こちらは本当に爆発する。同じ装置の同じ挙動が難易度で牙を剥く構成。
#
# ロータリーはストッパー付きの直線配置(0-5)なので、目的位置へ行く途中で
# 禁止位置を必ず通過する場合がある。**通過はセーフ、止まると違反**
# (300ms程度の停止で確定。§5)。慎重に、しかし止めずに回す必要がある。
#
# ## 禁止位置の数は難易度で変わる (ADR S-10)
#
# イージー・ノーマルは1つ、**ハードは2つ**。数は難易度テンプレートの
# `[load] forbidden_rotary_count` から引く。**ステージ側に直書きしない**。
#
# 2つになると**配置によって難しさの質が変わる**:
#
#   隣接       {1,2} → target 4    連続して通過する。一気に回せば1回で抜ける
#   離れている {1,3} → target 5    間の安全地帯で一度止まれる。2段構えになる
#   目的地を挟む {1,5} → target 3  行き過ぎると危険。止める精度が要る
#
# **どの型も出す。** 位置を個別に抽選せず `pick = "rotary_layout"` で
# **配置ごと**引く — 個別に引くと配置が偏るうえ、**目的位置の両隣が禁止**に
# なる組み合わせが出てしまう (到達はできるが、合わせたあと手が滑って
# 1つ動かすと即爆発する。難度ではなく運になる)。
# `rotary_layout` は成立する配置だけを列挙して等確率で引く。
#
# なお**ハード難易度は「普通×2」を引く**ため、normal タグのこのステージも
# ハードのセッションに出る。そのときに禁止位置が2つになる。

id = "206"
name = "綱渡り"
difficulty = "normal"

[random]
cut = { pick = "line" }
# 目的位置と禁止位置を**配置ごと**抽選する。返り値は "target,f1[,f2]"。
layout = { pick = "rotary_layout", count = "${load_forbidden_rotary_count}" }
target = { derive = "nth", from = "${layout}", index = 1 }
# 禁止位置。2つ目は count=1 のとき存在しないため、
# positions には ${forbidden} をまとめて渡す (カンマ区切りが展開される)。
forbidden = { derive = "tail", from = "${layout}", index = 2 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { rotary = "${target}" }
# 禁止位置で止まったら即爆発 (通過はセーフ。止まった時だけ違反)。
# ${forbidden} はカンマ区切りで、配列要素として展開される。
forbidden_rotary = { positions = [
  "${forbidden}",
], on_violation = { action = "explode" } }

[navigator]
briefing = "ダイヤルを指定位置に合わせて線を切る。ただし**危険な位置**があり、そこで止まると即座に起動してしまう。通り過ぎる分には問題ない。危険な位置は難易度によって1つのことも2つのこともある。"
# 危険位置と目的位置は伝えるが、切る線の色は「照合の材料」として書く
# (208/201 と同じ方針)。「${cut}色の線を切ること」とだけ書くと、なぞられて漏れる。
answer = "正解はダイヤルを${target}に合わせて、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するためだけに使い、プレイヤーより先に発話に入れない。\n\n**危険位置は ${forbidden}**(カンマ区切りなら複数ある)。そこで**止めると即爆発**する(通過はセーフ)。**危険位置は全て伝えること** — 1つでも伏せると、知りようがないまま踏んで即爆発する。"
procedure = "**まず『ランプはどうなっている?』と尋ね、状態を報告させる**(ADR N-10)。**第一声で危険位置を言わない** — 装置を見る前に数字だけ聞かされても頭に入らない。プレイヤーはまだダイヤルに触っていないので、報告を待つ間に事故は起きない。\n\n報告を受けたら、**ダイヤルを回す指示と危険位置の警告を1つながりで伝える**。**(1) 操作対象の名前「ダイヤル」 (2) 目的位置${target} (3) 一気に回すこと、の3つを必ず入れる**(言い回しはキャラシートの口調で組み立てる。ここに例文は置かない。ADR N-52) — 操作対象の名前が無いと何を操作するのか伝わらず、一気に回すことを省くとゆっくり慎重に回そうとして**危険位置の上で速度を落とし、そのまま止まって即爆発する**(実プレイで発生)。危険位置${forbidden}は、**そこで止まらないことを言い切りで短く添える**。**通過を条件にした回りくどい言い方はしない** — 止まらないことだけで十分伝わる。**危険位置が2つあるときは両方とも言う** — 数字を1つずつ区切って読み上げ、聞き取れたか確認する。**回せと言う前に危険位置だけを告げない** — 何のための数字か分からない。**一気に回すことと、危険位置で止まらないことの両方を必ず一続きの発話に入れる** — 片方だけだと、危険位置で速度を落とす動きを誘発する。**これらは字数を超えても削らない**(ADR N-22)。\n\n**回し方に迷っていたら**、危険位置と目的位置の並びを踏まえて助言する — 危険位置が離れていれば間で一度止まってよいこと、隣接していればまとめて一気に抜けること、目的位置の先にもあれば行き過ぎないこと。ダイヤルが危険位置付近にあるときは急かさない(焦らせると止めてしまう)。\n\n**どうすればいいか・次は、のような聞き返し・再確認でも同じ**。ダイヤルをまだ合わせ終えていない段階なら、**目的位置と危険位置を毎回セットで言う** — 前に言ったからと省略しない。切れとだけ答えて危険位置を伴わない返答は、まだ危険位置を通過していないプレイヤーを即爆発させる事故になる。\n\nダイヤルが合ったら**「光っているランプと同じ色の線」**という言い方で切る線を指示する(点灯しているのは1つだけなので一意に決まる)。**切る線の色名はプレイヤーに先に言わせること**(危険位置と目的位置の数字はこちらから言ってよい)。"
