# 103. ホールド&カット (docs/puzzle_stage_ideas.md §2.1)
# 「ロータリーを3に合わせ、緑のボタンを押しながら○色の線を切る」。
# 片手でボタンを押さえてもう片手で切る、または2人協力になる。

id = "103"
name = "ホールド&カット"
difficulty = "easy"

[random]
cut = { pick = "line" }
# 押さえるボタンは**切る線と別の色にする**。
# 同色になると leds が1エントリに潰れ (点灯が点滅で上書きされる)、
# 「点滅=押すボタン / 点灯=切る線」の対応が画面上に現れなくなる。
# 押さえた指がニッパーの邪魔にもなる (306 三点確保も同じ理由で除外している)。
hold = { pick = "color", exclude = ["${cut}"] }
rotary = { pick = "int", min = 0, max = 5 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 600
cut = "${cut}"
precondition = { rotary = "${rotary}", push = [
  "${hold}",
] }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "ダイヤルを指定位置に合わせ、指定のボタンを押したままの状態で線を切る必要がある。ランプは2つ光っており、点滅しているほうが押すボタン、点灯しているほうが切る線を示す。"
answer = "正解はダイヤルを${rotary}に合わせ、${hold}色のボタンを押しながら${cut}色の線を切ること。点滅しているのが${hold}色(押すボタン)、点灯しているのが${cut}色(切る線)。"
# **最初にランプの状態を報告させる**。このステージは「点滅=押すボタン」という
# 対応に気づけるかが要で、そこを飛ばすとプレイヤーはボタンの存在自体に
# 気づけない (実運用で発生: ダイヤルだけ誘導され、押すボタンが分からないまま
# 時間切れになった)。ダイヤルの指示より先に観察させる。
# **1発話に1つずつ**。対応の説明とダイヤル指示を1度に言うと60文字を超える
# (アオサギで61文字になった)。返答を待ちながら分けて伝える。
procedure = "**1回の発話で伝えるのは1つだけ**にし、返答を待ってから次へ進む。まず『ランプはどうなっている?』と尋ね、状態を報告させる。『2つ光っていて、片方は点滅している』という報告を引き出したら、『点滅しているほうが押すボタン、点きっぱなしのほうが切る線だ』と対応だけを伝える(ここでダイヤルの話まで足さない)。**色名はプレイヤーに先に言わせること**。次にダイヤルを${rotary}に合わせさせ、最後に点滅していた色のボタンを押したまま切るよう指示する。ボタンから指が離れると切れないので、押したまま切る点を強調する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『2つ光っていて片方は点滅』という報告を受けたら、**ダイヤルの位置合わせも要ることをこちらから伝える**。プレイヤーに『ダイヤルは?』と尋ねさせてはいけない"
hint_l2 = "点滅しているランプと同じ色のボタンを押す必要があること、ダイヤルの位置合わせも要ることを伝える。ダイヤルの位置(${rotary})は伝えてよい"
hint_l3 = "点滅している色のボタンを押したまま、点灯している色の線を切ると手順を伝えてよい。手を離すと切れないこと、2人がかりでもよいことも伝える(色名は言わない)"
