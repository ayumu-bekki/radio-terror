# 205. 速さくらべ (docs/puzzle_stage_ideas.md §2.2)
#
# 104 早い者勝ち(2色から速い方)の多色版。
# **1色が点灯しっぱなし・残り4色が違う速さで点滅**する。
# 点灯している色は「基準外」で、残り4色のうち**一番速い色**を切る。
#
# ## 点灯1色を置く理由 (報告を作る)
#
# 全色が点滅していると、プレイヤーが最初に報告できる情報が
# 「全部点滅しています」しかなく、無線の往復が生まれない。
# 1色だけ点灯させると『○色だけ点きっぱなしです』という**一言で済む報告**が
# 発生し、ナビゲーターが「その色は数えるな」と応じる往復が作れる。
#
# ## 「N番目に速い色」を切らせる (ADR N-40)
#
# かつては**正解を最速に固定**していた。中間順位を正解にすると `answer` が
# 「○番目に速い色」となり、**L4 (直言) でナビゲーターが色名を言えず**
# 行き詰まりを救えなかったため。
#
# **ノーマル以上が L4 を出さなくなった (ADR N-39) ので、この制約は消えた。**
# L3 が上限なら、どのみち色名は言わない。「一番速い色を切れ」しか言えない
# 状態は指示が毎回同じで単調だったため、**順位を毎回抽選する**形へ戻す。
#
# 順位は 1〜4 の全てから引く。「一番速い」「一番遅い」の当たり回もあるので、
# 難易度に幅が出る。
#
# ## 速度 — 難易度で変える (ADR S-12)
#
# **固定4段階**を使う。ランダムな速度にすると抽選次第で差が接近し、
# 見分けが運になってしまうため。値は難易度テンプレートの
# `[load] speed_rank_ms` から引く。**ステージ側に直書きしない**。
#
#   ノーマル 150 / 300 / 550 / 1000ms  隣接 1.82〜2.0倍
#   ハード   150 / 210 / 294 / 412ms   隣接 **1.4倍均一**
#
# ハードは全体でも 2.75倍しか開かず、**「一番遅いのが一目瞭然」が消える**
# (ノーマルの最遅 1000ms は 0.5Hz でほぼ点滅と分かるが、
# ハードの最遅 412ms は 1.2Hz でまだ十分速い)。
#
# **ハードは 104 早い者勝ち で決めた下限 (1.5倍) を意図的に下回る。**
# 104 は2択だが 205 は**4色を並べ替える**ため、比較回数が多く
# 同じ隣接比でも難しい。ただし**実機で見え方を確認してから確定させること** —
# 詰めすぎると並べ替えが運になる。
#
# **ハードは「普通×2」を引く**ため、normal タグのこのステージも
# ハードのセッションに出る。そのときに詰まった速度になる。
#
# 点滅は対称(点灯時間=消灯時間)。モールス表示のステージ(202/302/305)と
# 混同されないようにする。

id = "205"
name = "速さくらべ"
difficulty = "normal"

# **`keep_cut_secret` は立てない** (ADR N-50)。
#
# 203 ブループリントなどと違い、205 の正解は**紙資料に無い**。
# 点滅の速さは装置を見て数えるしかないので、色を伏せると
# **誰も正誤を確定できず、誤答のまま切って即爆発する**
# (実測: 伏せた状態で8回中5回、ナビが誤答を「それが4番目です」と通した)。
#
# 色名は **Core向けJSON との一致を機械的に検証する**ために `answer` へ残す
# (ADR S-1。`answerMentionsCut` が組み立て時に弾く)。
# **交信では使わない** — 色名を報告させず、正誤も告げない。

[random]
# **cut を先に引く**。5色すべてを表示に使うため、cut は未使用の線に限られる
# (pick = "line" が使用済みの色を自動で除く)。cut を後から choice で選ぶ形にすると、
# 候補2つが両方とも使用済みだったときに組み立てが失敗する。
cut = { pick = "line" }

# **cut が何番目に速いか**を毎回抽選する (1=最速 〜 4=最遅)。
# ナビゲーターの指示が「N番目に速く点滅している色を切れ」と毎回変わる。
rank = { pick = "int", min = 1, max = 4 }

# 点灯しっぱなしにする基準外の色 (数に入れない)。cut とは別の色にする
# (点灯 = 正解 だとプレイヤーが誤学習し、以降のステージで的外れな報告をする)
steady = { pick = "color", exclude = ["${cut}"] }

# cut 以外の点滅3色。速い順の並びに cut を rank 番目で差し込んで使う。
m1 = { pick = "color", exclude = ["${cut}", "${steady}"] }
m2 = { pick = "color", exclude = ["${cut}", "${steady}", "${m1}"] }
m3 = { pick = "color", exclude = ["${cut}", "${steady}", "${m1}", "${m2}"] }

# 速い順に並べた4色。cut を rank 番目に置き、残りを m1→m2→m3 の順に詰める。
# 速度そのものは難易度テンプレートの [load] speed_rank_ms から引く。
s1 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 1, others = ["${m1}", "${m2}", "${m3}"] }
s2 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 2, others = ["${m1}", "${m2}", "${m3}"] }
s3 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 3, others = ["${m1}", "${m2}", "${m3}"] }
s4 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 4, others = ["${m1}", "${m2}", "${m3}"] }

[core]
# 1色は点灯しっぱなし (基準外)、残り4色が違う速さで点滅する。
# s1 が最速、s4 が最遅。cut は rank 番目のスロットに入る。
# **速度は難易度で変わる** (ADR S-12):
#   ノーマル 150/300/550/1000 (隣接 1.82〜2.0倍)
#   ハード   150/210/294/412  (隣接 1.4倍均一) ← 一番遅いのも十分速い
leds = { "${steady}" = "on", "${s1}" = { pattern = "blink", on_ms = "${load_speed_rank_1}", off_ms = "${load_speed_rank_1}" }, "${s2}" = { pattern = "blink", on_ms = "${load_speed_rank_2}", off_ms = "${load_speed_rank_2}" }, "${s3}" = { pattern = "blink", on_ms = "${load_speed_rank_3}", off_ms = "${load_speed_rank_3}" }, "${s4}" = { pattern = "blink", on_ms = "${load_speed_rank_4}", off_ms = "${load_speed_rank_4}" } }
cut = "${cut}"

[navigator]
briefing = "1つのランプが点灯しっぱなしで、残り4つが違う速さで点滅している。点灯している色は数に入れず、点滅している4色を速い順に並べて、${rank}番目に速い色の線を切る。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**1つが点きっぱなしで、残り4つが点滅している**ことを報告できたか。点灯と点滅の区別がついていれば、色名が無くても報告できたとみなす"
# 点滅の速い順を明記する。**これは Core向けJSON との一致を検証するための記録**で
# (ADR S-1)、交信で使うものではない。速い順は
# `TestSpeedRankingConsistency` が leds の速度と突き合わせている。
#
# **ナビゲーターは順位 (${rank}番目) だけを伝え、どの色かには踏み込まない**
# (ADR N-50)。装置を見ていないので答え合わせができず、
# 照合させると誤答のまま切らせる (実測8回中1〜5回)。
#
# 文面は**ナビゲーターが読み上げると成立する形にしない**。
# 「プレイヤーが${cut}色を報告してきたら」のような書き方だと、
# L1-L2 でなぞられたときに「${cut}色ですか?」とこちらから色名を出しかねない
# (navigator_design.md §5 決定19: 答えを目の前に置くとなぞられる)。
answer = "点灯しっぱなしなのは${steady}色(基準外・数に入れない)。点滅の速い順は ${s1}(最速) → ${s2} → ${s3} → ${s4}(最遅)。切るのは**${rank}番目に速く点滅している**${cut}色の線。\n\n## この記録は照合に使わない\n\n**あなたは装置を見ていないので、答え合わせができません。** 上の速い順は Core向けJSON と突き合わせるための記録で、交信で使うものではありません。\n\n- **色名を報告させない。** 『何色だった?』と尋ねない。\n- **プレイヤーが色を言ってきても、正誤を告げない。** 合っているとも違うとも言わない。\n- **どの色が何番目かを、あなたの口から言わない。**\n\nプレイヤーが色を挙げたら『数え直して自信が持てたら切ってくれ』と返し、**判断を委ねる**。\n\n**「それが${rank}番目だ」と認めて切らせてはいけない。** 間違っていた場合、切った線は戻せず**即爆発**します。あなたには正しいかどうか分かりません。\n\n## あなたの仕事\n\n1. 点灯している色は数に入れないと伝える\n2. **${rank}番目に速い色を切る**と伝える(順位は装置を見ても分からないので必ず伝える)\n3. 数え方を助言する(2色ずつ見比べて速い方を残す)\n\nどの色かを決めるのはプレイヤーです。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つだけ点きっぱなし』という報告を受けたら『その色は基準だ、数に入れるな』と伝える。\n\n**次に切る順位(${rank}番目に速い色)を必ず伝える** — 順位は装置を見ても分からないので、伏せると手詰まりになる。あわせて『数えられたら、その線を切ってくれ』と**切ってよい条件まで一度に伝える**。\n\n**色名を報告させない。** 『何色だった?』と尋ねない。点滅の速さを数えられるのはプレイヤーだけで、**あなたは答え合わせができない**。報告させて『それが${rank}番目だ』と受けると、**間違っていても切らせてしまう** — 切った線は戻せず即爆発する(実測で発生)。\n\nプレイヤーが色を言ってきたら、**正誤に触れずに**『数え直して自信が持てたら切ってくれ』と返し、**判断はプレイヤーに委ねる**。あなたは装置を見ていないので、それが正しいかは分からない。\n\n迷っていれば、2色ずつ見比べて速い方を残していく数え方を助言する。**助言するのは数え方だけ**で、どの色かには踏み込まない。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つだけ点きっぱなしで残りが点滅』という報告を受けたら、**点灯している色は数に入れないことと、切るのは${rank}番目に速い色だという判断基準を続けて伝える**(色名は言わない)。**順位(${rank}番目)は装置を見ても分からないので必ず伝えること**。基準を伏せたまま『よく見て』とだけ返すと、何を探せばよいか分からず手が止まる"
hint_l2 = "点滅している4色を速い順に並べるよう促す。2色ずつ見比べて速い方を残していくと並べやすいと助言する。並べたら${rank}番目を数えさせる"
# **ナビゲーターは照合役をしない** (ADR N-50)。
#
# かつては色名を報告させ、${cut}色と照合して切らせていた。しかし
# **装置を見ていないナビゲーターに答え合わせはできない** — 実測で
# 8回中1〜5回、誤った色の報告に『それが4番目だ、切ってください』と応じた。
# 切った線は戻せず**即爆発**する。
#
# `answer` の書き方を4通り試したがゼロにならなかったため、
# **照合そのものをやめた**。順位と数え方だけを伝え、
# **どの色かはプレイヤーが決める**。
hint_l3 = "${rank}番目に速く点滅している色を切ることを明確に伝え、**数えられたらその線を切ってよい**と伝える。\n\n**色名を報告させない。** 『何色だった?』と尋ねない — あなたは装置を見ていないので、答え合わせができない。\n\nプレイヤーが色を言ってきたら、**合っているとも違うとも言わず**『数え直して自信が持てたら切ってくれ』と返し、判断を委ねる。**『それが${rank}番目だ』と認めて切らせてはいけない** — 間違っていれば即爆発する。\n\n迷っていれば数え方(2色ずつ見比べて速い方を残す)を助言する。**助言するのは数え方だけ**で、どの色かには踏み込まない。"
