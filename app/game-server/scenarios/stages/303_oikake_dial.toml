# 303. 追いかけダイヤル (docs/puzzle_stage_ideas.md §2.3)
# 「残り時間の十の位と同じ位置にロータリーを合わせて○色を切れ」。
# 正解が時間とともに変わり続ける。判定はデバイス内で行う。
#
# ロータリーは0-5しかないため、十の位が6-9の間は合わせられない。
# 十の位が0-5に入る時間帯を待つ必要があり、それ自体が難度になる。

id = "303"
name = "追いかけダイヤル"
difficulty = "hard"

[random]
cut = { pick = "line" }

[core]
leds = { "${cut}" = "blink" }
led_blink_ms = 400
cut = "${cut}"
precondition = { timer_digit = { digit = "tens", match = "rotary" } }

[navigator]
briefing = "残り時間の秒の十の位の数字と、ダイヤルの位置が**一致している状態で**線を切る。十の位は10秒ごとに減って正解の位置も変わるため、**変わるたびにダイヤルを合わせ直して追いかける**。同じ数字でいる時間は10秒あるので、合わせてから落ち着いて切れば間に合う(208・304 のような一瞬を狙う課題ではない)。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
# **落とすと手詰まりになる一言** (ADR N-51)。
# 十の位は10秒ごとに減るため、合わせたきりでは次に切るときにずれている。
# 「合わせて切る」だけ伝えて**合わせ直しを落とすと**、プレイヤーは
# ダイヤルを合わせたまま待ち続ける (実測 15回中4回で欠落)。
# ここが「追いかけダイヤル」という課題の本体なので、単独の要求として置く。
must_say = "**十の位が変わったらダイヤルを合わせ直す**こと(合わせたきりにすると、次に切ろうとしたときにはずれている)。\n\n**この「十の位」は必ず「カウントダウンの秒の十の位」と言う。** 「十の位」とだけ言うと**何の十の位か分からない** — 装置にはダイヤルの数字もあり、資料にも数字が並ぶ。どこを見るのかを毎回言葉にする。\n\n**「10秒ごとに変わる」と説明しない。** カウントダウンの十の位が10秒ごとに変わるのは**誰でも知っている**。説明すると発話が長くなり、くどい。**合わせ直せ、とだけ言う**"
observation = "ランプが1つだけ点滅していることに加え、**その色名まで**報告できたか。**色名が無ければ報告できたとみなさない** — 切る線はその色で決まるため、色が分からないまま手順を渡すと、プレイヤーは何色を切るのか分からないまま操作することになる"
# 文面は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、L1-L2 でなぞられて色名が漏れる。
answer = "正解はタイマーの秒の十の位とダイヤルの位置を一致させて線を切ること。切る線は点滅しているランプと同じ${cut}色だが、点滅しているランプは1つだけなので『点滅している色の線』で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。ダイヤルは0-5しかないため、十の位が6-9の間は切れない。十の位は**10秒間**同じ数字のままなので(さらに変わった直後1秒の猶予がある)、合わせてから切るまでの時間は十分にある — **一瞬を狙う課題ではない**。"
procedure = "**やることは「ダイヤルを十の位と同じ数字に合わせて、線を切る」**。これだけ。\n\n**「瞬間」「一瞬」「タイミングを狙う」とは言わない。** 十の位は**10秒間**同じ数字のままなので、合わせてから切るまでの時間は十分にある。**狙って切るような課題ではない** — 急かすと、落ち着いて切れば済むところを焦らせることになる。\n\n**ただし「10秒ごとに変わる」と口に出して説明もしない。** これは**あなたが状況を理解するための情報**であって、伝える内容ではない。カウントダウンの十の位が10秒ごとに変わるのは**プレイヤーも知っている**。説明するとくどく、発話が伸びる。\n\n伝えることは2つ:\n\n1. **ダイヤルを残り時間の秒の十の位と同じ数字に合わせ、合っている間に線を切る**\n2. **カウントダウンの秒の十の位が変わったら、ダイヤルを回し直して合わせ直す**\n\n**1・2 とも「十の位」は必ず「カウントダウンの秒の十の位」と言い切る。** 2回目以降も省略しない — 「十の位」とだけ言われても**何の十の位か分からない**。装置のダイヤルにも数字があり、プレイヤーはそちらと取り違える。\n\n**2 を落とさないこと。** 落とすとプレイヤーは一度合わせたきりで放置し、次に切ろうとしたときにはずれている。**ここが「追いかけダイヤル」という課題の本体**。\n\n**ただし 1 と 2 は必ず組で言う。** 合わせ直すことだけを伝えて**切る動作を落とさない** — 合わせ続けるだけでは線が切れず、時間が尽きる。\n\n**プレイヤーが『合わせました』と報告してきたら、それは正しい**。認めたうえで「合っているうちに切れ」と続ける。**叱ってはいけない**。\n\n**言い回しはキャラシートの口調に委ねる — ここに例文は置かない**(例文を置くと全キャラがそれを写して口調が消える。決定80)。\n\n十の位が変わるタイミングを読み上げて支援する。ダイヤルが届かない数字の時間帯(十の位が6-9)があることを伝え、待つ判断を促す。\n\n切る線は**必ず『点滅しているランプと同じ色』**と指示する。**「その色」「同じ色」と省略しない** — 何と同じなのかが分からず、プレイヤーは点灯しているランプと取り違える。**色名はプレイヤーに先に言わせること**。報告が${cut}色と一致していれば復唱して認める。"
# 各レベルに「色名を言わない」を書いておく。L1 でプレイヤーが
# 「1つのランプが点滅しています」と報告しただけの場面で、こちらが
# 「光っているのは赤だな」と**補って復唱してしまう**ため
# (シミュレーションで発生)。プレイヤーが言っていない色名は出さない。
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。\n\n**報告の内容で返し方を変える。**\n\n**『1つ点滅している』だけで色名が無ければ、手順をまだ渡さない。** その色を尋ね返す — 切る線はその色で決まるので、色が分からないまま手順を渡すと、プレイヤーは**何色を切るのか分からないまま**ダイヤルを回すことになる。**尋ねるのは色だけ**で、ここで手順の一部を混ぜない。\n\n**色名まで報告されたら、そこで手順を最後まで伝える。** あなたは正解を知っているので、**確認したいことは何も無い**。タイマーの数字もダイヤルの位置も**プレイヤーに尋ねる必要はない**(聞いても答え合わせに使えず、手が止まるだけ)。\n\n次の3つを**ひと続きで**言い切る:\n\n1. **ダイヤルをカウントダウンの秒の十の位と同じ数字に合わせる**\n2. **カウントダウンの秒の十の位が変わったら合わせ直す**(「10秒ごとに変わる」という説明は**付けない**。常識なのでくどくなる)\n3. **合っている間に、点滅しているランプと同じ色の線を切る**\n\n**1・2 は必ず「カウントダウンの秒の十の位」と言う。** 「十の位」とだけ省略しない — **何の十の位か分からない**。ダイヤル自体にも数字が並んでいるので、プレイヤーは取り違える。**2回目に言うときも省略しない**。\n\n**3 は必ず「点滅しているランプと同じ色の線」と言う。** 「その色の線」「同じ色の線」だけで済ませない — **何と同じなのかが分からない**。装置には点灯しているランプも点滅しているランプもあり得るので、**どちらを見るのかを毎回言う**。\n\n**必ず 3 (切る) まで言う。** 「合わせ直せ」で止めると、プレイヤーは合わせ続けるだけで線を切らず、時間切れになる。\n\n**途中で切って次の発話に回さない。** 『十の位とダイヤルに関係がある』『まずダイヤルを合わせろ』で止めると、プレイヤーは合わせたところで手が止まり、何をすればいいか分からなくなる。\n\nプレイヤーが色名を言っていない場合、こちらから色名を補ってはいけない(『点滅しているランプと同じ色』と言う)"
hint_l2 = "**カウントダウンの秒の十の位**に注目させ、**ダイヤルをその数字に合わせて線を切る**よう促す。**「十の位」と省略しない** — 何の十の位か分からず、ダイヤルの数字と取り違える。切る線に触れるときは**必ず『点滅しているランプと同じ色の線』**と言い、「その色」と省略しない。**そのうえで『カウントダウンの秒の十の位が変わったらダイヤルも合わせ直す』と必ず添える** — 合わせたきりにすると、次に切ろうとしたときにはずれている。**「10秒ごとに変わる」という説明は付けない**(常識であり、発話が長くなるだけ)。**「瞬間」「タイミング」とも言わない**(同じ数字でいる時間は10秒あり、狙って切る課題ではない)。切る線の色名はこちらから言わないこと"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると生成AIが読み落とし、
# L3 で「赤色の線を切れ」と直言する (シミュレーションで発生)。
# 切る線は点滅しているランプで一意に決まるので、伏せても手詰まりにはならない。
hint_l3 = "**ダイヤルをカウントダウンの秒の十の位と同じ数字に合わせ、合っている間に線を切る**と手順を教えてよい。あわせて**「その十の位が変わったら合わせ直す」**ことまで言う。**「十の位」だけで済ませない** — 何の十の位か分からず、ダイヤルの数字と取り違える。合わせたきりにさせない。**「10秒ごとに変わる」という説明は付けない**(常識なのでくどい)。\n\n**「瞬間」「一瞬」「タイミングを狙う」とは言わない。** 同じ数字でいる時間は10秒あるので、合わせてから落ち着いて切れば間に合う。急かさない。\n\n**プレイヤーが『合わせました』と報告してきたら、それは正しい**。認めてから「合っているうちに切れ」と続ける。**叱らない**。\n\n合わせられない時間帯(十の位が6-9)は待つよう伝える。切る線の色名は言わないこと。点滅しているランプは1つだけなので、『点滅している色の線』と言えば伝わる"
