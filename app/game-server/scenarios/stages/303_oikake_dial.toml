# 303. 追いかけダイヤル (docs/puzzle_stage_ideas.md §2.3)
# 「残り時間の十の位と同じ位置にロータリーを合わせて○色を切れ」。
# 正解が時間とともに変わり続ける。判定はデバイス内で行う。
#
# ロータリーは0-5しかないため、十の位が6-9の間は合わせられない。
# 十の位が0-5に入る時間帯を待つ必要があり、それ自体が難度になる。

id = "303"
name = "追いかけダイヤル"
difficulty = "hard"

[random]
cut = { pick = "line" }

[core]
leds = { "${cut}" = "blink" }
led_blink_ms = 400
cut = "${cut}"
precondition = { timer_digit = { digit = "tens", match = "rotary" } }

[navigator]
briefing = "残り時間の十の位の数字と、ダイヤルの位置が**一致している状態で**線を切る。時間が進むと十の位が減り、正解の位置も変わり続けるため、**ダイヤルを追いかけて回し直しながら**切る瞬間を狙う。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが1つだけ点滅していることを報告できたか。色名まで言えていればなおよい"
# 文面は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、L1-L2 でなぞられて色名が漏れる。
answer = "正解はタイマーの秒の十の位とダイヤルの位置を一致させて線を切ること。切る線は点滅しているランプと同じ${cut}色だが、点滅しているランプは1つだけなので『点滅している色の線』で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。ダイヤルは0-5しかないため、十の位が6-9の間は切れない。"
procedure = "**「合わせてから切る」ではなく「合っている状態で切る」と伝える。** 十の位は時間とともに減り続けるため、**先にダイヤルを合わせて、それから切る**と言うと、切る頃には十の位が変わっていて失敗する。**ダイヤルと十の位が一致している、その瞬間に切る**という言い方にする(例:「十の位とダイヤルが同じ数字になっとる、その瞬間に切る」)。\n\n**十の位が減ったらダイヤルも追いかけて回し直す**ことを必ず伝える。合わせたきりにさせない — ここが「追いかけダイヤル」という課題の本体。\n\n十の位が変わるタイミングを読み上げて支援する。ダイヤルが届かない数字の時間帯(十の位が6-9)があることを伝え、待つ判断を促す。\n\n切る線は『点滅しているランプと同じ色』と指示し、**色名はプレイヤーに先に言わせること**。報告が${cut}色と一致していれば復唱して認める。"
# 各レベルに「色名を言わない」を書いておく。L1 でプレイヤーが
# 「1つのランプが点滅しています」と報告しただけの場面で、こちらが
# 「光っているのは赤だな」と**補って復唱してしまう**ため
# (シミュレーションで発生)。プレイヤーが言っていない色名は出さない。
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つだけ点滅している』という報告を受けてから、タイマーの数字とダイヤルの位置に関係があることを伝える。プレイヤーが色名を言っていない場合、こちらから色名を補ってはいけない"
hint_l2 = "残り時間の十の位に注目させ、ダイヤルをその数字に合わせるよう促す。**そのうえで『十の位は減っていくから、変わったらダイヤルも回し直す』と必ず添える** — 合わせたきりでは切る頃にずれている。切る線の色名はこちらから言わないこと"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると生成AIが読み落とし、
# L3 で「赤色の線を切れ」と直言する (シミュレーションで発生)。
# 切る線は点滅しているランプで一意に決まるので、伏せても手詰まりにはならない。
hint_l3 = "「十の位とダイヤルが一致している**その状態のまま**切る」と手順を教えてよい。**「合わせてから切れ」とは言わない** — 切る頃には十の位が変わっている。**ずれたら回し直して追いかける**ことまで言う。合わせられない時間帯(十の位が6-9)は待つよう伝える。切る線の色名は言わないこと。点滅しているランプは1つだけなので、『点滅している色の線』と言えば伝わる"
