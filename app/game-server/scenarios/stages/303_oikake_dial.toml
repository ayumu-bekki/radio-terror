# 303. 追いかけダイヤル (docs/puzzle_stage_ideas.md §2.3)
# 「残り時間の十の位と同じ位置にロータリーを合わせて○色を切れ」。
# 正解が時間とともに変わり続ける。判定はデバイス内で行う。
#
# ロータリーは0-5しかないため、十の位が6-9の間は合わせられない。
# 十の位が0-5に入る時間帯を待つ必要があり、それ自体が難度になる。

id = "303"
name = "追いかけダイヤル"
difficulty = "hard"

[random]
cut = { pick = "line" }

[core]
leds = { "${cut}" = "blink" }
led_blink_ms = 400
cut = "${cut}"
precondition = { timer_digit = { digit = "tens", match = "rotary" } }

[navigator]
briefing = "残り時間の秒の十の位の数字と、ダイヤルの位置が**一致している状態で**線を切る。十の位は10秒ごとに減って正解の位置も変わるため、**変わるたびにダイヤルを合わせ直して追いかける**。同じ数字でいる時間は10秒あるので、合わせてから落ち着いて切れば間に合う(208・304 のような一瞬を狙う課題ではない)。"
# **落とすと手詰まりになる一言** (ADR N-51)。
# 十の位は10秒ごとに減るため、合わせたきりでは次に切るときにずれている。
# 「合わせて切る」だけ伝えて**合わせ直しを落とすと**、プレイヤーは
# ダイヤルを合わせたまま待ち続ける (実測 15回中4回で欠落)。
# ここが「追いかけダイヤル」という課題の本体なので、単独の要求として置く。
must_say = "**十の位が変わったらダイヤルを合わせ直す**こと(合わせたきりにすると、次に切ろうとしたときにはずれている)。\n\n**この「十の位」は必ず「カウントダウンの秒の十の位」と言う。** 「十の位」とだけ言うと**何の十の位か分からない** — 装置にはダイヤルの数字もあり、資料にも数字が並ぶ。どこを見るのかを毎回言葉にする。\n\n**「10秒ごとに変わる」と説明しない。** カウントダウンの十の位が10秒ごとに変わるのは**誰でも知っている**。説明すると発話が長くなり、くどい。**合わせ直せ、とだけ言う**"
# 文面は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、L1-L2 でなぞられて色名が漏れる。
answer = "正解はタイマーの秒の十の位とダイヤルの位置を一致させて線を切ること。切る線は点滅しているランプと同じ${cut}色だが、点滅しているランプは1つだけなので『点滅している色の線』で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するためだけに使い、プレイヤーより先に発話に入れない。ダイヤルは0-5しかないため、十の位が6-9の間は切れない。十の位は**10秒間**同じ数字のままなので(さらに変わった直後1秒の猶予がある)、合わせてから切るまでの時間は十分にある — **一瞬を狙う課題ではない**。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**報告の内容で返し方を変える**:\n\n- **1つ点滅している、だけで色名が無ければ、手順をまだ渡さない。** その色を尋ね返す — 切る線はその色で決まるので、色が分からないまま手順を渡すと、プレイヤーは何色を切るのか分からないままダイヤルを回すことになる。**尋ねるのは色だけ**で、ここで手順の一部を混ぜない。\n- **色名まで報告されたら、そこで手順を最後まで伝える。** あなたは正解を知っているので、**確認したいことは何も無い**(ADR N-55)。タイマーの数字もダイヤルの位置も**プレイヤーに尋ねる必要はない**(聞いても答え合わせに使えず、手が止まるだけ)。\n\n**やることは、ダイヤルをカウントダウンの秒の十の位と同じ数字に合わせて、線を切る**。これだけ。次の3つを**ひと続きで**言い切る:\n\n1. **ダイヤルをカウントダウンの秒の十の位と同じ数字に合わせる**\n2. **カウントダウンの秒の十の位が変わったら、ダイヤルを回し直して合わせ直す**\n3. **合っている間に、点滅しているランプと同じ色の線を切る**\n\n**十の位がどの数字か分からないと言われたら**、小数点の2つ左の数字だと場所で補う (表示は123.4の形式。決定155)。\n\n**1・2 とも「十の位」は必ず「カウントダウンの秒の十の位」と言い切る。** 2回目以降も省略しない — 十の位とだけ言われても**何の十の位か分からない**。装置のダイヤルにも数字があり、プレイヤーはそちらと取り違える。\n\n**2 を落とさないこと。** 落とすとプレイヤーは一度合わせたきりで放置し、次に切ろうとしたときにはずれている。**ここが「追いかけダイヤル」という課題の本体**。**ただし 1 と 2 は必ず組で言い、3 (切る) まで言う** — 合わせ直すことだけを伝えて切る動作を落とすと、合わせ続けるだけで線が切れず時間が尽きる。**途中で切って次の発話に回さない** — ダイヤルに関係があるとだけ、合わせろとだけ言って止めると、プレイヤーは合わせたところで手が止まる。\n\n3 は必ず**点滅しているランプと同じ色の線**と言う。**その色・同じ色と省略しない** — 何と同じなのかが分からず、プレイヤーは点灯しているランプと取り違える。\n\n**「瞬間」「一瞬」「タイミングを狙う」とは言わない。** 十の位は**10秒間**同じ数字のままなので、合わせてから切るまでの時間は十分にある。**狙って切るような課題ではない** — 急かすと、落ち着いて切れば済むところを焦らせることになる。**ただし「10秒ごとに変わる」と口に出して説明もしない** — **あなたが状況を理解するための情報**であって、伝える内容ではない。プレイヤーも知っていて、説明するとくどく発話が伸びる。\n\n**プレイヤーが合わせたと報告してきたら、それは正しい**。認めたうえで、合っているうちに切るよう続ける。**叱ってはいけない**。\n\n十の位が変わるタイミングを読み上げて支援する。ダイヤルが届かない数字の時間帯(十の位が6-9)があることを伝え、待つ判断を促す。\n\n**言い回しはキャラシートの口調に委ねる — ここに例文は置かない**(決定80)。**切る線の色名はプレイヤーより先に発話に入れない** — プレイヤーに先に言わせ、報告が${cut}色と一致していれば復唱して認める。プレイヤーが色名を言っていない場合、こちらから色名を補ってはいけない。"
