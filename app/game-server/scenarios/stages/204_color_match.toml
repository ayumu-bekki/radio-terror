# 204. 色合わせ (docs/puzzle_stage_ideas.md §2.2)
# 「光った色のボタンを押していけ。最後に押した色の線を切れ」。
# 最後の1つは cut と同色に固定される (last_matches_cut)。
# プレイヤーには見分けがつかず、サーバーは正解線を既知のまま保てる。
#
# **時間で切り替わらない**。押すまで同じ色が点いたまま待つ。
# 押し切ると**全消灯**するので、手がかりは「最後に押した色」の記憶だけになる。

id = "204"
name = "色合わせ"
difficulty = "normal"

[random]
cut = { pick = "line" }
# **回数は難易度から引く** (docs/scenario_design.md §4.2)。
# ここに数値を直書きすると、イージーでもハードでも同じ回数になる。
count = { pick = "int", min = "${load_color_match_min}", max = "${load_color_match_max}" }

[core]
# 色合わせ中はkLEDが専有され、完了すると**全消灯**する。
# leds は指定しない — 消灯した状態で「最後に押した色」だけを手がかりにするため。
leds = { }
cut = "${cut}"
# ミスは**ブザー + 5秒**で伝える。押し直しになるだけだと、
# 無線越しでは失敗したことに気づけない (§5.1)。
precondition = { color_match = { count = "${count}", last_matches_cut = true, penalty_ms = 5000 } }

[navigator]
briefing = "ランプが1つずつ光るので、光った色と同じボタンを押す。押すと次の色に変わる。急ぐ必要はない。押し終えるとランプが全部消えるので、最後に押した色の線を切る。**何回押すのかは分からない**(ナビゲーターは装置を見ていない)。"
# **落とすと詰む一言**を独立して渡す (ADR N-51)。
# 押し切ると全消灯し装置に手がかりが残らないため、
# 覚えていなければ切る線が分からなくなる。
#
# `hint_l1` にも書いてあるが、指針が長いと**末尾が落ちる**
# (実測8回中2回で欠けた)。散文の但し書きではなく単独の要求として置く。
must_say = "**押しながら、最後に押した色を覚えておく**こと(押し切るとランプが全部消えるので、覚えていないと切る線が分からなくなる)"
# **押す回数を answer に書かない** (ADR N-42)。
#
# 数字をプロンプトへ載せると「言うな」と但し書きを添えても漏れる
# (ADR N-1・N-32: 目の前にある語はなぞられる。「言うな」と引用した文言が
# かえって手本になる)。202・205 の色名を `keep_cut_secret` で
# **機械的に伏せている**のと同じ理由で、ここは**最初から書かない**。
#
# ナビゲーターは回数を知る必要が無い。装置を見ていないので今何回目かを
# 追えず、答えれば必ず嘘になる。知らないほうが正しく振る舞える。
answer = "正解は${cut}色の線。色合わせの最後の1つが必ず${cut}色になるため、「最後に押した色」がそのまま答えになる。\n\n**何回押すのかはあなたも知らない**。装置を見ていないため今何回目かも分からない。『何回押せばいいですか』と聞かれたら『分からない、押していれば終わる』と答える。終わりは回数ではなく**ランプが全部消えること**で伝える。"
# **押している最中は黙る。** ナビゲーターは装置を見ていないので実況できない。
# 急かす必要も無い (時間で切り替わらないので、慌てると押し間違えるだけ)。
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。1色だけ光っていると分かったら、遊び方として**次の2つを1つの発話で必ず両方伝える**:\n\n(1) **光った色のボタンを押していく。ランプが全部消えるまで繰り返す** — 1回の動作として言うと、1つ押して終わりだと受け取られる。**何回か続くこと**と**全消灯で終わること**まで一続きで言う。\n(2) **押しながら、最後に押した色を覚えておく** — 覚えるのは押している**最中**。全部消えてから覚えるようにつなげると手遅れになる。\n\n**字数を超えてもこの2つは削らない**(ADR N-22) — (2) を落とすと、全消灯したあと装置に手がかりが残らず詰む。**プレイヤーが (1) を先に言い当てて確認してきても、肯定するだけで終わらせず (2) を足す**(実測で落ちた)。この2つで既に長いので、急がなくてよいといった配慮は**この発話に足さず**、押し始めたあとの発話に回す(足すと99字まで伸びた)。\n\n**回数は言わない**(ADR N-42) — 何回押すのかは伝えず、**ランプが全部消えたら終わり**という終わり方で伝える。残り回数を聞かれても数を答えない — ナビゲーターは装置を見ておらず今何回目かを追えないため、答えれば嘘になる。分からないこと、押していれば終わることを返す。\n\n伝えたら**押している最中は口を出さない** — 光った色も押せたかも分からない。実況や合いの手を入れてはいけない。**押している最中にプレイヤーから声が届いたら**、最後に押した色を覚えておくことを念押しする(押すことに集中すると抜ける)。\n\n完了を報告されたら、**最後に押した色の線を切る**と伝え、最後に押した色を覚えているかを確認する。**色名は最後まで言わない** — ナビゲーターは押した色も見ていない。忘れた・何色だったかと聞かれても色名を出さず、**知らないものとして**、思い出す助けになること(最後に押したのはどれだったか、押した順を辿ってみる)だけを返す。プレイヤーが色名を挙げてきた場合も、**合っているか間違っているかを判定してはいけない** — 判定できる立場にないうえ、外れていれば誤切断で即失敗する。\n\n**ブザーが鳴った・押し間違えたと言われたら、最初には戻っていない**(決定157。103・201 のボタン列とは違う)。今光っている色は変わらずに待っているので、**その色と同じボタンを押せば続きから進む**と伝える。押した回数を数え直させたり、最初から押し直させたりしない。"
