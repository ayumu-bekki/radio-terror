# 204. 色合わせ (docs/puzzle_stage_ideas.md §2.2)
# 「光った色のボタンを押していけ。最後に押した色の線を切れ」。
# 最後の1つは cut と同色に固定される (last_matches_cut)。
# プレイヤーには見分けがつかず、サーバーは正解線を既知のまま保てる。
#
# **時間で切り替わらない**。押すまで同じ色が点いたまま待つ。
# 押し切ると**全消灯**するので、手がかりは「最後に押した色」の記憶だけになる。

id = "204"
name = "色合わせ"
difficulty = "normal"

[random]
cut = { pick = "line" }
# **回数は難易度から引く** (docs/scenario_design.md §4.2)。
# ここに数値を直書きすると、イージーでもハードでも同じ回数になる。
count = { pick = "int", min = "${load_color_match_min}", max = "${load_color_match_max}" }

[core]
# 色合わせ中はkLEDが専有され、完了すると**全消灯**する。
# leds は指定しない — 消灯した状態で「最後に押した色」だけを手がかりにするため。
leds = { }
cut = "${cut}"
# ミスは**ブザー + 5秒**で伝える。押し直しになるだけだと、
# 無線越しでは失敗したことに気づけない (§5.1)。
precondition = { color_match = { count = "${count}", last_matches_cut = true, penalty_ms = 5000 } }

# **このステージは L4 (正解の直言) を出さない** (ADR N-36)。
#
# 他のステージと違い、**正解はプレイヤーの記憶の中にしかない**。
# 押し切ると全消灯するため装置には何の手がかりも残らず、
# ここで色名を言うのは「推理の近道」ではなく**課題そのものの消滅**になる。
#
# 実運用で事故が起きた (2026-08-23)。「最後に押した色を忘れた」と言われた
# 26秒後に L4 の閾値をまたぎ、ナビゲーターが正解色を直言した。
# しかもプレイヤーは正しい色を記憶していたのに、それを上書きされて
# 誤った線を切り**即爆発**した。
#
# **ノーマルは難易度側でも L4 を切ってある (ADR N-39) が、この指定は残す。**
# 難易度側の方針は運用の都合で変わりうるのに対し、こちらは
# **このステージの構造に由来する制約**で、L4 が復活しても成立しない。
[hints]
l4_pct = 0

[navigator]
briefing = "ランプが1つずつ光るので、光った色と同じボタンを押す。押すと次の色に変わる。急ぐ必要はない。押し終えるとランプが全部消えるので、最後に押した色の線を切る。**何回押すのかは分からない**(ナビゲーターは装置を見ていない)。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが1つだけ光っていることを報告できたか。色名まで言えていればなおよい"
# **落とすと詰む一言**を独立して渡す (ADR N-51)。
# 押し切ると全消灯し装置に手がかりが残らないため、
# 覚えていなければ切る線が分からなくなる。
#
# `hint_l1` にも書いてあるが、指針が長いと**末尾が落ちる**
# (実測8回中2回で欠けた)。散文の但し書きではなく単独の要求として置く。
must_say = "**押しながら、最後に押した色を覚えておく**こと(押し切るとランプが全部消えるので、覚えていないと切る線が分からなくなる)"
# **押す回数を answer に書かない** (ADR N-42)。
#
# 数字をプロンプトへ載せると「言うな」と但し書きを添えても漏れる
# (ADR N-1・N-32: 目の前にある語はなぞられる。「言うな」と引用した文言が
# かえって手本になる)。202・205 の色名を `keep_cut_secret` で
# **機械的に伏せている**のと同じ理由で、ここは**最初から書かない**。
#
# ナビゲーターは回数を知る必要が無い。装置を見ていないので今何回目かを
# 追えず、答えれば必ず嘘になる。知らないほうが正しく振る舞える。
answer = "正解は${cut}色の線。色合わせの最後の1つが必ず${cut}色になるため、「最後に押した色」がそのまま答えになる。\n\n**何回押すのかはあなたも知らない**。装置を見ていないため今何回目かも分からない。『何回押せばいいですか』と聞かれたら『分からない、押していれば終わる』と答える。終わりは回数ではなく**ランプが全部消えること**で伝える。"
# **押している最中は黙る。** ナビゲーターは装置を見ていないので実況できない。
# 急かす必要も無い (時間で切り替わらないので、慌てると押し間違えるだけ)。
procedure = "遊び方を伝えるとき、**(1) 光っている色と同じボタンを押す (2) 最後に押した色を覚えておく** の2つを必ず両方言う。**字数を超えてもこの2つは削らない** — (2) を落とすと押し切ったあと手がかりがゼロになる。**回数は言わない** — 何回押すのかは伝えず、『ランプが全部消えたら終わりだ』と**終わり方**で伝える(ADR N-42)。押し終わるとランプが全部消えるので、覚えていないと手がかりが無くなる。伝えたら**押している最中は口を出さない** — ナビゲーターは装置を見ていないので、光った色も押せたかも分からない。実況や合いの手を入れてはいけない。完了通知が届いてから『最後に押した色を覚えているか』を確認する。**『何回押せばいいですか』と聞かれても数を答えてはいけない** — ナビゲーターは装置を見ておらず今何回目かを追えないため、答えれば嘘になる。『分からない、押していれば終わる』と返す。**『忘れた』『何色だったか』と聞かれても色名を言ってはいけない** — ナビゲーターは装置を見ておらず、押した色も見えていない。**知らないものとして答える**。思い出す助けになること(『最後に押したのはどれだったか』『押した順を辿ってみろ』)だけを返す。プレイヤーが色名を挙げてきた場合も、**合っているか間違っているかを判定してはいけない** — 判定できる立場にないうえ、外れていれば誤切断で即失敗する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。1色だけ光っていると分かったら、**次の2つを必ず両方伝える**:\n\n(1) **光った色のボタンを押していく。ランプが全部消えるまで繰り返す**\n(2) **押しながら、最後に押した色を覚えておく**\n\n---\n\n**(1) は繰り返しとして言う。** 『同じ色のボタンを押してください』と一回の動作で言うと、1つ押して終わりだと受け取られる。**何回か続くこと**と**全消灯で終わること**まで一続きで言う。\n\n**(2) は「押しながら」。** 『全部消えたら覚えて』と繋げると、消えたあとに覚えることになり手遅れ。覚えるのは押している最中。\n\n**(2) を落とさない。** 全消灯すると装置に手がかりが残らないので、思い出せなければ詰む。プレイヤーが先に (1) を言い当てて『同じ色のボタンを押せばいいですか?』と聞いてきても、肯定するだけで終わらせず (2) を足す(実測で落ちた)。\n\n**この2つで既に長い。** 字数を超えてもよいが(ADR N-22)、『急がなくてよい』などの配慮は**この発話に足さない** — 足すと99字まで伸びた。押し始めたあとの発話に回す。\n\n**何回押すのかは言わない**(ADR N-42)。『ランプが全部消えたら終わりだ』と終わり方で伝える"
hint_l2 = "**押している最中に『最後に押した色を覚えておけ』を念押しする**(L1 で伝えていても、押すことに集中すると抜ける)。全消灯すると装置に手がかりが残らないため、思い出せなければ詰む。\n\n**残り回数を聞かれても答えない**(装置を見ていないので分からない)。『ランプが全部消えたら終わりだ』と終わり方で返す"
hint_l3 = "「最後に押した色の線を切る」と手順を教えてよい。**色名は最後まで言わない** — このステージに L4 (直言) は無い。プレイヤーが思い出せない場合も、思い出す助けだけを返して色名は出さないこと"
