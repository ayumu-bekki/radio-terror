# 207. 息が合わない (docs/puzzle_stage_ideas.md §2.2)
#
# 5色すべてが**同じ速さ**で点滅しているが、1色だけタイミング(位相)がずれて
# いる。他の4色が揃って光る中、1つだけ違うタイミングで光る色を切る。
#
# 205 速さくらべは「速さ」を比べるが、こちらは速さが全部同じで
# **タイミングだけ**が違う。速さを比べる目では見つからず、
# 「揃っているかどうか」を見る必要があるので別の観察になる。
#
# 位相のずれは on_ms/off_ms の比率を変えることで作る。周期は同じだが
# 点灯している時間帯がずれるため、他の4色と明滅が同期しない。
#
# 点灯時間は 400ms 対 150ms と大きく差をつけてある。当初は 300ms にしていたが、
# 差が 100ms しかなく無線越しの問答では見つけられないと判断して広げた。
# 差が大きいぶん「1つだけ短く光る色」としても目に付き、周期が同じなので
# 「速さは同じなのに息が合わない」という趣旨は保たれる。

id = "207"
name = "息が合わない"
difficulty = "normal"

[random]
# ずれている色 (正解)
cut = { pick = "line" }
# 残り4色は揃って点滅する
# (${rest} は cut 以外の全色に展開される暗黙変数)

[core]
# 揃っている4色: 400ms点灯 / 400ms消灯 (周期800ms)
# ずれている1色: 同じ周期800msだが、点灯150ms / 消灯650ms で明滅がずれる
leds = { "${rest}" = { pattern = "blink", on_ms = 400, off_ms = 400 }, "${cut}" = { pattern = "blink", on_ms = 150, off_ms = 650 } }
cut = "${cut}"

[navigator]
briefing = "5つのランプが同じ速さで点滅しているが、1色だけ他と息が合っていない。他の4色は揃って明滅するので、そこから外れている色を切る。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**5つとも同じ速さで点滅している**ことを報告できたか。さらに『1つだけ明滅のタイミングがずれている』ことまで言えていれば確実に報告できたとみなす"
answer = "正解は${cut}色の線。他の4色は同じタイミングで明滅するが、${cut}色だけ光っている時間が短く、明滅がずれていく。"
procedure = "『速さを比べるのではなく、揃って光っているかを見る』と観点を明確にする。しばらく眺めていると、ずれている色だけ他と重ならない瞬間が出てくる。全体を一度に見るより、2〜3色ずつ見比べると分かりやすいと助言する。\n\n**プレイヤーが『1色だけ違う』『点滅の仕方が違う』『光る時間が短い』のように、他と違う色を1つ言い当てたら、そこで観点の説明を続けない。** すぐに**「その、他と違う点滅をしているランプと同じ色の線を切ってください」**という一文で切る指示を出す。**遠回しな言い方(『その光る短い部分を切れ』のように装置の一部を指すような表現)はしない** — 切るのは線であって、ランプの光り方そのものではない。「同じ色の線」まで一息で言い切ること。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**報告の内容で返し方を変える** — 『5つとも同じ速さで点滅している』までなら、速さではなく**揃って明滅しているか**を見るよう観点を示す(ここが分かれ目なので曖昧にしない)。**1つだけタイミングがずれている、点滅の仕方が違う、光る時間が短いなど、他と違う色を1つ言い当てられていれば、そこで止めずに「その、他と違う点滅をしているランプと同じ色の線を切ってください」と言い切る**(色名は言わない)。**観点の説明を繰り返さない** — 既に見つけている観察を何度も言い換えさせない。"
hint_l2 = "速さではなく「揃って光っているか」を見るよう観点を示す。1色だけ息が合っていないと伝える。**その色を言い当てられたら「その、他と違う点滅をしているランプと同じ色の線を切ってください」と言い切って終える**"
hint_l3 = "**「他と違う点滅をしているランプと同じ色の線を切ってください」**と、切る指示までひと続きで言う(色名は言わない)。**「その光る短い部分」のような装置の一部を指す遠回しな言い方はしない** — 切るのは線であることを明確にする"
