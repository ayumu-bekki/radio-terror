# 209. 綱渡り (docs/puzzle_stage_ideas.md §2.2)
#
# 101 解体デビューと同じ forbidden_rotary の仕掛けだが、違反時は**即爆発**。
# 101 では「今のは危なかった、次は本当に爆発する」と警告されるだけだが、
# こちらは本当に爆発する。同じ装置の同じ挙動が難易度で牙を剥く構成。
#
# ロータリーはストッパー付きの直線配置(0-5)なので、目的位置へ行く途中で
# 禁止位置を必ず通過する場合がある。**通過はセーフ、止まると違反**
# (300ms程度の停止で確定。§5)。慎重に、しかし止めずに回す必要がある。

id = "209"
name = "綱渡り"
difficulty = "normal"

[random]
cut = { pick = "line" }
# 合わせる位置と禁止位置。両端に寄せて「通過せざるを得ない」配置にする
target = { pick = "int", min = 3, max = 5 }
forbidden = { pick = "int", min = 1, max = 2 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { rotary = "${target}" }
# 禁止位置で止まったら即爆発 (101 は penalty。ここが難易度差)
forbidden_rotary = { positions = [
  "${forbidden}",
], on_violation = { action = "explode" } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "ダイヤルを指定位置に合わせて線を切る。ただし途中に危険な位置があり、そこで止まると即座に起動してしまう。通り過ぎる分には問題ない。"
# 危険位置と目的位置は伝えるが、切る線の色は「照合の材料」として書く
# (208/201 と同じ方針)。「${cut}色の線を切ること」とだけ書くと、なぞられて漏れる。
answer = "正解はダイヤルを${target}に合わせて、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。ダイヤル${forbidden}は危険位置で、そこで止めると即爆発する(通過はセーフ)。"
procedure = "先に危険位置を伝えて警告する。『${forbidden}で止まるな、通り過ぎるのは構わない』と、止まることが危険だと明確にする。目的位置まで一気に回すよう促す。ダイヤルが危険位置付近にあるときは急かさない(焦らせると止めてしまう)。ダイヤルが合ったら**「光っているランプと同じ色の線」**という言い方で切る線を指示し、**切る線の色名はプレイヤーに先に言わせること**(危険位置と目的位置の数字はこちらから言ってよい)。"
# **危険位置は最初に必ず伝える。** 場所を伏せたまま「危険な位置がある」とだけ
# 言うと、プレイヤーは知りようがないまま踏んで**即爆発**する。それは謎ではなく
# 事故で、罰としても理不尽。このステージの難しさは「止めずに通過する」操作の
# 緊張であって、危険位置がどこかを当てることではない (procedure も先に警告する
# 前提で書かれており、L1 で伏せると自己矛盾していた)。
hint_l1 = "**第一声は危険位置の警告とランプの確認を兼ねる**(『ダイヤル${forbidden}で止まるな。ランプはどうなっている?』)。危険位置(${forbidden})を先に伝えて警告する。そこで止まると即座に起動すること、通過は問題ないことをはっきり言う"
hint_l2 = "合わせる位置(${target})を伝え、危険位置で止まらないよう改めて警告する。一気に回すよう促す"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると生成AIが読み落とす
# (シミュレーションで L3「赤い線を切れ」が発生)。
hint_l3 = "合わせる位置と危険位置の両方を伝え、一気に回すよう具体的に指示してよい。切る線の色名は言わないこと。点灯しているランプは1つだけなので、『光っているランプと同じ色の線』と言えば伝わる"
