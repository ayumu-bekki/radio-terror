# 103. コール&レスポンス (docs/puzzle_stage_ideas.md §2.1)
#
# **報告した色は答えではない**のが、このステージだけが教えること。
# 点灯しているランプは「報告させるため」にあり、切る線は**点滅している別の色**。
# 203 ブループリント の「全灯は合図」、205 速さくらべ の「点灯は基準外」へ
# 繋がる素地になる (ADR N-10 まず報告させる)。
#
# ## 押し切ったら切る線だけが残る (ADR C-13)
#
# 押下中は「報告用の点灯」と「切る線の点滅」が**両方見えている**。
# 押し終わると `reveal_cut_on_complete` が働き、**切る線の色だけが点灯**して
# 他は消える。押下フェーズの終わりが装置から一目で分かり、
# 次に何をするかが視覚的に伝わる。
#
# **最初から両方見せるのが要点。** 押し終わってから初めて cut が光る形だと、
# 「報告した色と切る色が違う」という気づきが発生せず、
# ただの「押し終わったら光った色を切る」になってしまう。
#
# ## push_progress では発話しない (ADR N-26)
#
# 正しい押下のたびに `push_progress` がサーバーへ届くが、**発話はしない**。
# ナビゲーターは装置を見ていないので「今ので合ってる」と反応するのは
# 手元が見えていることになり、無線で状況を伝え合う前提が崩れる。
# 反応するのはプレイヤーが**報告してきたとき**だけ。

id = "103"
name = "コール&レスポンス"
difficulty = "easy"

[random]
cut = { pick = "line" }
# 最初に報告させる点灯色は**切る線と別の色にする**。
# 同色だと leds が1エントリに潰れ (点灯が点滅で上書きされる)、
# 「点灯している色を報告 → 最後に点滅している色を切る」という
# このステージの対話が成立しなくなる。
lit = { pick = "color", exclude = ["${cut}"] }
# **押下色からも ${cut} を外す**。ボタンの色名はこちらから指示する仕様なので、
# 押下色に正解色が混ざると「次は赤色のボタンを押せ」で正解色を音として出し、
# 最後の「点滅している色の線を切れ」と繋がった瞬間に答えが割れる
# (シミュレーションで発生。201 復唱 と同じ構造)。
#
# **報告させる点灯色も外す** — 押す色と報告色が同じだと
# 「報告した色を押す」だけになり、対話の一往復が消える。
seq = { pick = "color_seq", count = 3, exclude = ["${cut}", "${lit}"] }

[core]
# 最初に点灯しているLED (報告用) と、最後に切る線のLED (点滅) を光らせる。
# **両方見えていることが要点** — 報告した色と切る色が違うと分かる。
leds = { "${lit}" = "on", "${cut}" = "blink" }
led_blink_ms = 700
cut = "${cut}"
# 押し切ったら**切る線の色だけを点灯**させ、他は消灯する (ADR C-13)。
# `colors` は各色が { push = "<色>" } の1エントリへ展開される。
precondition = { push_seq = { colors = "${seq}", reveal_cut_on_complete = true, on_wrong_press = { action = "penalty", penalty_ms = 3000 } } }

[navigator]
briefing = "点灯しているランプの色を報告させ、それに応じてボタンを順番に押させる対話形式。**報告した色は答えではない** — 切る線は点滅しているランプと同じ色。押し終わるとランプの表示が変わり、切る線の色だけが点灯する。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**点灯しているランプと点滅しているランプが両方ある**ことを報告できたか。どちらか一方の色だけでも報告できていればよい"
# ボタン列は読み上げてよいが、切る線の色は「照合の材料」として書く (102/201 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて色名が漏れる。
answer = "点灯しているのは${lit}色(**報告させるためのもので、答えではない**)。ボタンを**${seq}**の順に押してから、点滅している${cut}色の線を切るのが正解。押し切ると表示が変わり、${cut}色だけが点灯して他は消える。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。"
# **ボタンの並びは装置に一切現れない。最初から読み上げる。**
# 押す順番はナビゲーターだけが知っており、プレイヤーは観察でも推理でも
# たどり着けない。「決まった順番がある」とだけ伝えて色を伏せると、
# プレイヤーは手詰まりになり、無線が「順番を教えて」の往復で浪費される
# (実プレイで発生)。**伏せるべきなのは推理できる情報だけ**。
#
# 一方 **切る線はプレイヤーに報告させる**。点滅しているのは正解の色だけなので、
# 「点滅しているランプは何色か」を尋ねれば報告 → 指示 の往復になる。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここでボタンの指示をしてはいけない** — 尋ねておきながら返事を待たずに指示すると、尋ねた意味がなくなる。\n\n報告を受けたら、**次の発話で**列の1色目を色名で伝える(「まず○○のボタン」と色名を出す)。押せたら次の色、と1色ずつ進める。聞き返されたら何度でも繰り返す。**押している最中に「今ので合ってる」と実況しない** — ナビゲーターは装置を見ていない(ADR N-26)。反応するのはプレイヤーが報告してきたときだけ。\n\n押し終わると**表示が変わって1色だけ点灯する**。『ランプはどうなった?』と改めて尋ね、報告を受けてから**「その色の線を切れ」**と指示する。**切る線の色名だけはプレイヤーに先に言わせること**(ボタンの色名はこちらから言ってよい)。\n\n**点灯していた色と切る色は別**であることを、プレイヤーが混同していたら整理してやる(「最初に光っていたのは報告用だ」)。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**この第一声ではボタンの指示をしない**。報告を受けたら、『それは順番に押すタイプだ』と種類を伝えたうえでボタン列(**${seq}**)を読み上げ、押し始めさせる。**報告より先に順番を求められても答えず、まずランプを尋ね返すこと**。押す順番はナビゲーターしか知らないので、照合のあとは必ず教えること"
hint_l2 = "残りの色を1色ずつ伝えて進める。押せたところまでを都度確認する。**押している最中に実況しない**(装置は見えていない)"
# 切る線の色は**言わない**。押し切ると点灯するのは正解色の1つだけなので、
# 「光っているランプと同じ色」で一意に決まり、伏せても手詰まりにならない。
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると読み落とされる。
hint_l3 = "ボタン列をまとめて伝えてよい。押し終わったら**「表示が変わったはずだ、ランプはどうなった?」**と尋ね、報告された色の線を切らせる。切る線の色名はこちらから言わないこと。押し切ると点灯するランプは1つだけなので、『光っているランプと同じ色の線』と言えば伝わる"
