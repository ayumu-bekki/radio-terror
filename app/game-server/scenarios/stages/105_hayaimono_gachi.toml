# 105. 早い者勝ち (docs/puzzle_stage_ideas.md §2.1)
# 2つのLEDのうち「速く点滅している色」の線を切る。

id = "105"
name = "早い者勝ち"
difficulty = "easy"

[random]
cut = { pick = "line" }             # 速く点滅する側 = 正解
slow = { pick = "color", exclude = ["${cut}"] } # 比較用のもう1本

[core]
leds = { "${cut}" = { pattern = "blink", on_ms = 150, off_ms = 150 }, "${slow}" = { pattern = "blink", on_ms = 700, off_ms = 700 } }
cut = "${cut}"

[navigator]
briefing = "2つのランプが点滅している。速く点滅している色の線を切れば解除できる。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "2つのランプが点滅しており、**片方が速く・もう片方が遅い**ことを報告できたか。『速い/遅い』『早い/ゆっくり』など言い回しは問わず、速さの差を区別できていれば報告できたとみなす。色名まで添えられていればなおよい"
answer = "正解は${cut}色の線(${slow}色より速く点滅している方)。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**報告の内容で返し方を変える** — 『2つ点滅している』までなら、点滅の**速さに違いがないか**を見るよう観点を示す。**速い/遅いの差まで報告できていれば、そこで止めずに『速い方が正解だ』と判断基準を伝える**(色名は言わない)。報告済みの相手に『見比べてください』と返してはいけない"
hint_l2 = "点滅の速さに違いがあることに気づかせる"
hint_l3 = "「速く点滅している方の色の線を切る」と手順を教えてよい(色名は言わない)"
