# 105. 早い者勝ち (docs/puzzle_stage_ideas.md §2.1)
# 2つのLEDのうち「速く点滅している色」の線を切る。

id = "105"
name = "早い者勝ち"
difficulty = "easy"

[random]
cut = { pick = "line" }             # 速く点滅する側 = 正解
slow = { pick = "color", exclude = ["${cut}"] } # 比較用のもう1本

[core]
leds = { "${cut}" = { pattern = "blink", on_ms = 150, off_ms = 150 }, "${slow}" = { pattern = "blink", on_ms = 700, off_ms = 700 } }
cut = "${cut}"

[navigator]
briefing = "2つのランプが点滅している。速く点滅している色の線を切れば解除できる。"
answer = "正解は${cut}色の線(${slow}色より速く点滅している方)。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『2つ点滅している』という報告を受けてから、その2つを見比べるよう促す"
hint_l2 = "点滅の速さに違いがあることに気づかせる"
hint_l3 = "「速く点滅している方の色の線を切る」と手順を教えてよい(色名は言わない)"
