# 212. 息が合わない (docs/puzzle_stage_ideas.md §2.2)
#
# 5色すべてが**同じ速さ**で点滅しているが、1色だけタイミング(位相)がずれて
# いる。他の4色が揃って光る中、1つだけ違うタイミングで光る色を切る。
#
# 207 仲間はずれは「速さが違う1色」を探すが、こちらは速さが全部同じで
# **タイミングだけ**が違う。速さを比べる目では見つからず、
# 「揃っているかどうか」を見る必要があるので別の観察になる。
#
# 位相のずれは on_ms/off_ms の比率を変えることで作る。周期は同じだが
# 点灯している時間帯がずれるため、他の4色と明滅が同期しない。
#
# 点灯時間は 400ms 対 150ms と大きく差をつけてある。当初は 300ms にしていたが、
# 差が 100ms しかなく無線越しの問答では見つけられないと判断して広げた。
# 差が大きいぶん「1つだけ短く光る色」としても目に付き、周期が同じなので
# 「速さは同じなのに息が合わない」という趣旨は保たれる。

id = "212"
name = "息が合わない"
difficulty = "normal"

[random]
# ずれている色 (正解)
cut = { pick = "line" }
# 残り4色は揃って点滅する
# (${rest} は cut 以外の全色に展開される暗黙変数)

[core]
# 揃っている4色: 400ms点灯 / 400ms消灯 (周期800ms)
# ずれている1色: 同じ周期800msだが、点灯150ms / 消灯650ms で明滅がずれる
leds = { "${rest}" = { pattern = "blink", on_ms = 400, off_ms = 400 }, "${cut}" = { pattern = "blink", on_ms = 150, off_ms = 650 } }
cut = "${cut}"
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "5つのランプが同じ速さで点滅しているが、1色だけ他と息が合っていない。他の4色は揃って明滅するので、そこから外れている色を切る。"
answer = "正解は${cut}色の線。他の4色は同じタイミングで明滅するが、${cut}色だけ光っている時間が短く、明滅がずれていく。"
procedure = "『速さを比べるのではなく、揃って光っているかを見る』と観点を明確にする。しばらく眺めていると、ずれている色だけ他と重ならない瞬間が出てくる。全体を一度に見るより、2〜3色ずつ見比べると分かりやすいと助言する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『5つとも同じ速さで点滅している』という報告を受けてから、よく観察するよう促す"
hint_l2 = "速さではなく「揃って光っているか」を見るよう観点を示す。1色だけ息が合っていないと伝える"
hint_l3 = "「他の4色と明滅がずれている色の線を切る」と手順を教えてよい(色名は言わない)"
