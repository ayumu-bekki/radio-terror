# 102. ホールド&カット (docs/puzzle_stage_ideas.md §2.1)
# 「ロータリーを3に合わせ、緑のボタンを押しながら○色の線を切る」。
# 片手でボタンを押さえてもう片手で切る、または2人協力になる。

id = "102"
name = "ホールド&カット"
difficulty = "easy"

[random]
cut = { pick = "line" }
# 押さえるボタンは**切る線と別の色にする**。
# 同色になると leds が1エントリに潰れ (点灯が点滅で上書きされる)、
# 「点滅=押すボタン / 点灯=切る線」の対応が画面上に現れなくなる。
# 押さえた指がニッパーの邪魔にもなる。
hold = { pick = "color", exclude = ["${cut}"] }
rotary = { pick = "int", min = 0, max = 5 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 600
cut = "${cut}"
precondition = { rotary = "${rotary}", push = [
  "${hold}",
] }

[navigator]
briefing = "**ダイヤルを指定位置に合わせてから、指定のボタンを押しながら線を切る**。ボタンから指が離れていると切れない。ランプは2つ光っており、点滅しているほうが押すボタン、点灯しているほうが切る線を示す。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが2つ光っており、片方が点滅・もう片方が点灯していることを報告できたか。点滅と点灯の区別がついていれば、色名が無くても報告できたとみなす"
answer = "正解は**ダイヤルを${rotary}に合わせ、${hold}色のボタンを押しながら${cut}色の線を切る**こと。点滅しているのが${hold}色(押すボタン)、点灯しているのが${cut}色(切る線)。\n\n**指示は必ず「ダイヤルを合わせ、ボタンを押しながら線を切る」の3つを1つながりで言う。** どれか1つを落とした指示は成立しない — ダイヤルが合っていなければ切れず、押していなければ切れない。"
# **最初にランプの状態を報告させる**。このステージは「点滅=押すボタン」という
# 対応に気づけるかが要で、そこを飛ばすとプレイヤーはボタンの存在自体に
# 気づけない (実運用で発生: ダイヤルだけ誘導され、押すボタンが分からないまま
# 時間切れになった)。ダイヤルの指示より先に観察させる。
# **1発話に1つずつ**。対応の説明とダイヤル指示を1度に言うと60文字を超える
# (アオサギで61文字になった)。返答を待ちながら分けて伝える。
procedure = "**1回の発話で伝えるのは1つだけ**にし、返答を待ってから次へ進む。ただし**毎回『次にやること』で終える** — 対応関係の説明だけで発話を終えると、プレイヤーは何をすればいいか分からず止まる(実運用で発生: 『点滅が押すボタンだ』とだけ言われ『1回押せばいいんですか?』と聞き返された)。\n\n手順は3段階。(1) まず『ランプはどうなっている?』と尋ね、状態を報告させる。**色名はプレイヤーに先に言わせること**。(2) 報告を引き出したら、**次の3つを1発話でまとめて伝える**:\n\n- 点滅しているほうの**ボタンを押したまま**、点きっぱなしのほうの**線を切る**こと(**必ず「押しながら切る」と動作でつなげて言う**)\n- 先に**ダイヤルを${rotary}に合わせる**こと\n\n(3) ダイヤルが合ったら『そのボタンを押したまま切れ、離すなよ』と念を押す。\n\n**『押すボタン』『切る線』と名詞で並べて終わらない。** 対応関係だけ言ってダイヤル指示へ移ると、プレイヤーは**1回押して離す**ものだと解釈して聞き返す(実測5回中5回で発生: 『えっ? 1回押せばいいんですか?』)。**「押しながら切る」は手順(3)へ後回しにしない** — 聞き返しは(2)の直後に起きる。\n\n字数を超えてもこの3つは削らない(ADR N-22)。ボタンから指が離れると切れないこと、2人がかりでもよいことは余裕があれば添える。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『2つ光っていて片方は点滅』という報告を受けたら、次を**必ず両方**伝える:\n\n(1) 点滅しているほうの**ボタンを押しながら**、点きっぱなしのほうの**線を切る**こと\n(2) その前に**ダイヤルを合わせる**必要があること(位置 ${rotary} は伝えてよい)\n\n**(1) は「押しながら切る」と動作でつなげて言う。** 『点滅が押すボタン、点灯が切る線』と名詞で並べただけでは、**1回押して離す**ものだと解釈されて聞き返される(実測5回中5回)。\n\n**(1) と (2) はどちらも落とさない。字数を超えてもよい**(ADR N-22)。(1) だけだとダイヤルが合っておらず切れない。(2) だけだと何をすればいいか分からない。**片方に寄せた発話が実測5回中2回**出た。\n\nプレイヤーに『ダイヤルは?』と尋ねさせてはいけない。**この課題は「ダイヤル → ボタンを押したまま切る」の2段構えだと最初に分かるようにする**"
hint_l2 = "**点滅しているランプと同じ色のボタンを押しながら線を切る**ことと、その前にダイヤルの位置合わせが要ることを伝える。ダイヤルの位置(${rotary})は伝えてよい。**「押しながら切る」と動作でつなげて言う** — 『押す必要がある』と切る話を分けると、1回押して離すものだと解釈される(ADR N-48)"
hint_l3 = "ダイヤルを合わせたうえで、点滅している色のボタンを**押したまま**、点灯している色の線を切ると手順を伝えてよい。**『押しながら』は動作として言う** — 『押すボタン』では1回押して離すと解釈される。手を離すと切れないこと、2人がかりでもよいことも伝える(色名は言わない)"
