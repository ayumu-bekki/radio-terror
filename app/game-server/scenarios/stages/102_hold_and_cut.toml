# 102. ホールド&カット (docs/puzzle_stage_ideas.md §2.1)
# 「ロータリーを3に合わせ、緑のボタンを押しながら○色の線を切る」。
# 片手でボタンを押さえてもう片手で切る、または2人協力になる。

id = "102"
name = "ホールド&カット"
difficulty = "easy"

[random]
cut = { pick = "line" }
# 押さえるボタンは**切る線と別の色にする**。
# 同色になると leds が1エントリに潰れ (点灯が点滅で上書きされる)、
# 「点滅=押すボタン / 点灯=切る線」の対応が画面上に現れなくなる。
# 押さえた指がニッパーの邪魔にもなる。
hold = { pick = "color", exclude = ["${cut}"] }
rotary = { pick = "int", min = 0, max = 5 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 600
cut = "${cut}"
precondition = { rotary = "${rotary}", push = [
  "${hold}",
] }

[navigator]
briefing = "**ダイヤルを指定位置に合わせてから、指定のボタンを押しながら線を切る**。ボタンから指が離れていると切れない。ランプは2つ光っており、点滅しているほうが押すボタン、点灯しているほうが切る線を示す。"
answer = "正解は**ダイヤルを${rotary}に合わせ、${hold}色のボタンを押しながら${cut}色の線を切る**こと。点滅しているのが${hold}色(押すボタン)、点灯しているのが${cut}色(切る線)。\n\n**指示は必ず「ダイヤルを合わせ、ボタンを押しながら線を切る」の3つを1つながりで言う。** どれか1つを落とした指示は成立しない — ダイヤルが合っていなければ切れず、押していなければ切れない。"
# **最初にランプの状態を報告させる**。このステージは「点滅=押すボタン」という
# 対応に気づけるかが要で、そこを飛ばすとプレイヤーはボタンの存在自体に
# 気づけない (実運用で発生: ダイヤルだけ誘導され、押すボタンが分からないまま
# 時間切れになった)。ダイヤルの指示より先に観察させる。
# **1発話に1つずつ**。対応の説明とダイヤル指示を1度に言うと60文字を超える
# (アオサギで61文字になった)。返答を待ちながら分けて伝える。
# 押しながら切ることが課題の本体。procedure の (2) に書いてあっても落ちた
# (ヒバリで1回: 「ボタンを押して、線を切って」と押したままが抜けた。決定133)。
must_say = "点滅しているほうの**ボタンを押したまま**、点きっぱなしのランプと同じ色の**線を切る**こと(離すと切れない)。その前に**ダイヤルを${rotary}に合わせる**こと"
procedure = "**ランプの報告を受けた直後の指示だけは、ダイヤルと「押しながら切る」を1発話でまとめる**(下の手順(2))。それ以外は**1回の発話で伝えるのは1つだけ**にし、返答を待ってから次へ進む。ただし**毎回『次にやること』で終える** — 対応関係の説明だけで発話を終えると、プレイヤーは何をすればいいか分からず止まる(実運用で、点滅が押すボタンだとだけ言われたプレイヤーが、1回押せばいいのかと聞き返した)。\n\n手順は3段階。(1) まず『ランプはどうなっている?』と尋ね、状態を報告させる。**色名はプレイヤーに先に言わせること**。(2) 2つ光っていて片方が点滅、という報告を引き出したら、**次の2つを1発話でまとめて伝える**:\n\n- 点滅しているほうの**ボタンを押したまま**、点きっぱなしのほうの**線を切る**こと(**必ず「押しながら切る」と動作でつなげて言う**)\n- 先に**ダイヤルを${rotary}に合わせる**こと\n\n(3) ダイヤルが合ったら、そのボタンを押したまま切ること・離さないことを念押しする。\n\n**押す回数や「1回押せばいいのか」を聞かれたら**、その問いは否定し、ボタンは**線を切り終えるまで押し続ける**ことと、**押したまま線を切る**ことをひと続きで伝える(押し続けることだけ言って切るのを落とさない。決定160)。\n\n**「押すボタン」「切る線」と名詞で並べて終わらない。** 対応関係だけ言ってダイヤル指示へ移ると、プレイヤーは**1回押して離す**ものだと解釈して聞き返す(実測5回中5回)。**「押しながら切る」は手順(3)へ後回しにしない** — 聞き返しは(2)の直後に起きる。\n\n**(2) の2つはどちらも落とさない。字数を超えてもよい**(ADR N-22)。押しながら切ることだけだとダイヤルが合っておらず切れない。ダイヤルだけだと何をすればいいか分からない。片方に寄せた発話が実測5回中2回出た。**プレイヤーが片方を先に言い当ててきても、もう片方を必ず足す**。プレイヤーにダイヤルのことを尋ねさせてはいけない — この課題は「ダイヤル → ボタンを押したまま切る」の2段構えだと最初に分かるようにする。\n\nボタンから指が離れると切れないこと、2人がかりでもよいことは余裕があれば添える。色名はプレイヤーより先に発話に入れない。"
