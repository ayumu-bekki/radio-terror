# 302. 文字の一致 (docs/puzzle_stage_ideas.md §2.2)
#
# 5つのランプがそれぞれ**モールスで1文字**を表示し続ける。
# ナビゲーターが指定した文字を出している色の線を切る。
#
# 203/304 の暗号電文は「対照表で語を色へ変換する」謎だが、こちらは
# **1文字を読むだけ**で変換がない。代わりに5色を見比べて対象を絞り込む
# 作業が謎になる。
#
# **表示は1文字**。かつては数字1桁だったが、モールスの数字は**全て5要素**で
# (1 = ".----" / 2 = "..---")、長短を数え違えると隣の数字になる。
# 英字は**符号の長さそのものが違う**ため、数え上げずに形で見分けられる。
# 候補は**要素数がばらける**よう選んである (1〜4要素)。
#   E=. (1) / T=- (1) / M=-- (2) / I=.. (2)
#   O=--- (3) / S=... (3) / G=--. (3) / X=-..- (4) / Z=--.. (4) / H=.... (4)
#
# **ナビゲーターは「ジー、ゴルフ」と文字名とフォネティックの両方を言う**。
# 探すものを**指定する**側なので曖昧さを残せない。フォネティックだけだと
# プレイヤーは資料1のフォネティック列を引いてから文字に辿り着く必要があり、
# 文字名だけだと無線で聞き取りにくい (ADR N-41)。
# 203 は逆向き (プレイヤーが解読して報告する) なので語だけで足りる。

id = "302"
name = "文字の一致"
# **ハード** (2026-08-24 に normal から変更)。
# **5色が同時にモールスを表示し続ける**のはこのステージだけで、
# 5本を並行して読み、指定文字と照合する必要がある。
# 202 暗号電文 (1色を読む) より明確に重く、305 ローマ字電文 (変換不要) より難しい。
difficulty = "hard"

[random]
# 5色へ配る**互いに異なる1文字**をまとめて選ぶ。
# 符号の要素数がばらけるよう選ばれる (morse_letters が保証する)。
letters = { pick = "morse_letters", count = 5 }

# 正解の色と、そこに表示する文字 (先頭を正解にする)
cut = { pick = "line" }
target_letter = { derive = "nth", from = "${letters}", index = 1 }
# 無線で読み上げる形 (「ジー、ゴルフ」)。文字名とフォネティックを機械的に並べる。
# **散文で「両方言え」と書くだけでは守られない**ため値として渡す (ADR N-41)。
spoken = { derive = "spoken_letter", from = "${target_letter}" }

# 他の4色。文字は letters の2番目以降を順に配る (重複しない)
o1 = { pick = "color", exclude = ["${cut}"] }
o2 = { pick = "color", exclude = ["${cut}", "${o1}"] }
o3 = { pick = "color", exclude = ["${cut}", "${o1}", "${o2}"] }
o4 = { pick = "color", exclude = ["${cut}", "${o1}", "${o2}", "${o3}"] }
d1 = { derive = "nth", from = "${letters}", index = 2 }
d2 = { derive = "nth", from = "${letters}", index = 3 }
d3 = { derive = "nth", from = "${letters}", index = 4 }
d4 = { derive = "nth", from = "${letters}", index = 5 }

[core]
# 各色がモールスで1文字を繰り返し表示する
leds = { "${cut}" = { pattern = "morse", word = "${target_letter}", unit_ms = 250 }, "${o1}" = { pattern = "morse", word = "${d1}", unit_ms = 250 }, "${o2}" = { pattern = "morse", word = "${d2}", unit_ms = 250 }, "${o3}" = { pattern = "morse", word = "${d3}", unit_ms = 250 }, "${o4}" = { pattern = "morse", word = "${d4}", unit_ms = 250 } }
cut = "${cut}"

[navigator]
briefing = "5つのランプがそれぞれモールス信号で1文字を表示している。指定した文字を出している色の線を切る。手元の${sheet_morse}(モールス対照表)で読む。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**5つのランプすべてが長短の混じった点滅**をしていることを報告できたか。『全部チカチカしている』『どれも不規則に光る』など、複数がモールスらしい点滅だと分かる報告であればよい"
answer = "切るのは${target_letter}を表示している${cut}色の線。他の色は ${d1} / ${d2} / ${d3} / ${d4} を表示している。"
# **文字名とフォネティックを必ず並べて言う** (ADR N-41)。
# 探すものを指定する側なので、片方だけだと伝わらない。
procedure = "先に**『${spoken}を出している色を探せ』**と探す文字を伝える。**この読み方をそのまま使う** — 文字名とフォネティックを並べてあり、片方だけに縮めない(フォネティックだけだと対照表を引き直す手間が増え、文字名だけだと無線で聞き取りにくい)。5色すべてを読む必要はなく、目的の文字が見つかった時点で切ってよいと助言する。手元の${sheet_morse}で符号を確認するよう促す。長点(長い光)と短点(短い光)の**数と並び**で読み分けると伝える。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。5つすべてがモールスを出していることを確認したら、**探す文字を『${spoken}』と伝える**(この読み方をそのまま使う)。手元の${sheet_morse}に対照表があることも続けて添える(資料の中身は装置を見ても分からない情報なので出し惜しみしない)"
hint_l2 = "手元の${sheet_morse}で目的の文字の符号を引くよう促す。符号の**長さ**が色ごとに違うので、まず長短の数で候補を絞れると伝える"
hint_l3 = "目的の文字のモールス符号(長短の並び)を口頭で伝えてよい(例:「ツーツートン」)。**切る線の色名は言わない** — 探すのはプレイヤーの仕事"
