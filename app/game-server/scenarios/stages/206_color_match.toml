# 206. 色合わせ (docs/puzzle_stage_ideas.md §2.2)
# 「光った色のボタンを押していけ。最後に押した色の線を切れ」。
# 最後の1つは cut と同色に固定される (last_matches_cut)。
# プレイヤーには見分けがつかず、サーバーは正解線を既知のまま保てる。
#
# **時間で切り替わらない**。押すまで同じ色が点いたまま待つ。
# 押し切ると**全消灯**するので、手がかりは「最後に押した色」の記憶だけになる。

id = "206"
name = "色合わせ"
difficulty = "normal"

[random]
cut = { pick = "line" }
count = { pick = "int", min = 6, max = 9 }

[core]
# 色合わせ中はkLEDが専有され、完了すると**全消灯**する。
# leds は指定しない — 消灯した状態で「最後に押した色」だけを手がかりにするため。
leds = { }
cut = "${cut}"
# ミスは**ブザー + 5秒**で伝える。押し直しになるだけだと、
# 無線越しでは失敗したことに気づけない (§5.1)。
precondition = { color_match = { count = "${count}", last_matches_cut = true, penalty_ms = 5000 } }

# **このステージは L4 (正解の直言) を出さない** (ADR N-36)。
#
# 他のステージと違い、**正解はプレイヤーの記憶の中にしかない**。
# 押し切ると全消灯するため装置には何の手がかりも残らず、
# ここで色名を言うのは「推理の近道」ではなく**課題そのものの消滅**になる。
#
# 実運用で事故が起きた (2026-08-23)。「最後に押した色を忘れた」と言われた
# 26秒後に L4 の閾値をまたぎ、ナビゲーターが正解色を直言した。
# しかもプレイヤーは正しい色を記憶していたのに、それを上書きされて
# 誤った線を切り**即爆発**した。
[hints]
l4_pct = 0

[navigator]
briefing = "ランプが1つずつ光るので、光った色と同じボタンを押す。押すと次の色に変わる。急ぐ必要はない。規定の数を押し終えるとランプが全部消えるので、最後に押した色の線を切る。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが1つだけ光っていることを報告できたか。色名まで言えていればなおよい"
answer = "正解は${cut}色の線。色合わせの最後の1つが必ず${cut}色になるため、「最後に押した色」がそのまま答えになる。押す数は${count}回。"
# **押している最中は黙る。** ナビゲーターは装置を見ていないので実況できない。
# 急かす必要も無い (時間で切り替わらないので、慌てると押し間違えるだけ)。
procedure = "遊び方を伝えるとき、**最後に押した色を覚えておくよう必ず先に言う**。押し終わるとランプが全部消えるので、覚えていないと手がかりが無くなる。伝えたら**押している最中は口を出さない** — ナビゲーターは装置を見ていないので、光った色も押せたかも分からない。実況や合いの手を入れてはいけない。完了通知が届いてから『最後に押した色を覚えているか』を確認する。**『忘れた』『何色だったか』と聞かれても色名を言ってはいけない** — ナビゲーターは装置を見ておらず、押した色も見えていない。**知らないものとして答える**。思い出す助けになること(『最後に押したのはどれだったか』『押した順を辿ってみろ』)だけを返す。プレイヤーが色名を挙げてきた場合も、**合っているか間違っているかを判定してはいけない** — 判定できる立場にないうえ、外れていれば誤切断で即失敗する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。1色だけ光っていると分かったら、光った色と同じボタンを押すゲームだと伝える。押すと次の色に変わること、急がなくてよいこと、そして**最後に押した色を必ず覚えておく**ことを伝える"
hint_l2 = "押し終わってランプが全部消えたら、最後に押した色が次の手がかりになることを伝える"
hint_l3 = "「最後に押した色の線を切る」と手順を教えてよい。**色名は最後まで言わない** — このステージに L4 (直言) は無い。プレイヤーが思い出せない場合も、思い出す助けだけを返して色名は出さないこと"
