# 209. 配電盤照合 (docs/puzzle_stage_ideas.md §2.2)
#
# **ロータリーを回すたびにLEDの光り方が変わる**。プレイヤーは今の見え方を
# 報告し、ナビゲーターが「ロータリーが何番にありませんか」と当てる。
# 位置が分かったら手元の資料4で**危険位置**と**解除位置**を引き、
# 解除位置へ回してそこで点滅している線を切る。
#
# ## 位置ごとの見え方 (ADR C-14)
#
#   現在位置 … 対照表どおり (点灯色 + 点滅色)。**ここから表を引く**
#   解除位置 … **cut だけが点滅**。他はランダムに点灯/消灯
#   危険位置 … **赤だけ点灯**。止まると即爆発の合図
#   その他   … ランダム (ダミー。手がかりにならない)
#
# **解除位置の表示は対照表に載せない。** 載せると「解除位置は3 → その行の
# 点滅色が答え」と回す前に分かってしまい、回す工程が消える。
#
# **赤だけ点灯は危険位置に予約**。対照表の行はすべて点灯+点滅の2色なので、
# 1色だけの表示は必ず「危険位置に止まっている」を意味する。
# ダミーも2〜3色点灯にして、この合図と紛れないようにしている。
#
# ## 会話の形
#
#   プレイヤー 「赤が点いて青が点滅しています」
#   ナビ       「ロータリーが0番にありませんか」
#   プレイヤー 「はい、そうです」
#   ナビ       「では手元の資料4を見てくれ。解除方法が書いてある」
#
# ## ナビゲーターは危険位置を知らない立場を取る (ADR N-44)
#
# **表を読むのはプレイヤーの仕事**で、それがこのステージの謎そのもの。
# ナビが危険位置・解除位置を言えてしまうと**謎が丸ごと消える**。
#
# 206 綱渡り は逆で、危険位置を**ナビが伝える**(回す指示と一緒に。ADR N-49)。
# あちらは「止めずに通り抜ける」操作が謎で、危険位置がどこかを当てさせる遊びではない。
# **同じ forbidden_rotary でもステージによって扱いが逆になる。**
#
# 踏めば即爆発するが、それは**資料を読まずにロータリーを触った**結果であって、
# 伏せたことによる理不尽ではない (資料に書いてある)。
#
# そのため `answer` に**危険位置・解除位置の数値を載せない**。
# 「書いてあるが言うな」は守られない (ADR N-1) ので、最初から渡さない。

id = "209"
name = "配電盤照合"
difficulty = "normal"

[random]
cut = { pick = "line" }
# 現在位置を抽選する。返り値は "位置,危険位置,解除位置"
# **cut と重なる行は避ける** — 現在位置の表示で cut が点滅すると、
# 解除位置へ回す前に答えが見えてしまう
panel = { pick = "panel", cut = "${cut}" }
position = { derive = "panel_field", from = "${panel}", field = "position" }
forbidden = { derive = "panel_field", from = "${panel}", field = "forbidden" }
release = { derive = "panel_field", from = "${panel}", field = "release" }
# 今の見え方 (ナビゲーターが現在位置を当てる材料)
appearance = { derive = "panel_field", from = "${panel}", field = "appearance" }
# ロータリー位置ごとのLED表示 (JSONへ畳んで [core] へ渡す)
panel_leds = { pick = "rotary_leds", cut = "${cut}", panel = "${panel}", blink_ms = 500 }

[core]
cut = "${cut}"
# ロータリー位置ごとのLED表示。回すたびに差し替わる。
# **ステージ共通の leds は使わない** (rotary_leds が優先される)
rotary_leds = "${panel_leds}"
# 解除位置に合わせた状態でしか切れない
precondition = { rotary = "${release}" }
# 危険位置で止まったら即爆発 (通過はセーフ。止まった時だけ違反)
forbidden_rotary = { positions = [
  "${forbidden}",
], on_violation = { action = "explode" } }

[navigator]
briefing = "ロータリーを回すたびにランプの光り方が変わる。今の見え方から現在位置が分かるので、手元の${sheet_panel}で**危険位置**と**解除位置**を引く。解除位置へ回すと切るべき線が点滅する。危険位置で止まると即座に起動する(通過はセーフ)。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**今どう光っているか**を色で報告できたか。「点いている色」と「点滅している色」が両方言えていれば確実に報告できたとみなす"
# **ナビゲーターは対照表の中身を持たない**。渡すのは抽選された1行の情報だけで、
# 表を読むのはプレイヤーの仕事 (ADR N-3 と同じ方針)。
answer = "現在のロータリー位置は**${position}**で、そのとき${appearance}する。プレイヤーが${sheet_panel}を引けば、そこから**危険位置と解除位置**が読み取れる。\n\n**あなたは資料を持っていない。** 危険位置も解除位置も**知らない立場**で応じる — 表を読むのはプレイヤーの仕事で、ここを肩代わりすると**このステージの謎が丸ごと消える**。「どこが危険ですか」と聞かれても『資料に書いてある、そこを読め』と返す。\n\n正解は解除位置へ回して${cut}色の線を切ること。**${cut}色という色名もこちらから言わない** — 解除位置へ回せば装置に現れる。プレイヤーの報告と照合するために使う。"
# **まず報告させる** (ADR N-10)。見え方を聞かないと現在位置を当てられない。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここで解き方を説明しない**。\n\n報告を受けたら**現在位置を当てて確認する**(『ロータリーが${position}番にありませんか』)。プレイヤーが認めたら**「手元の${sheet_panel}を見ろ、解除方法が書いてある」**と資料番号と中身を続けて伝える。\n\n**ここから先はプレイヤーが表を読む。** 危険位置も解除位置も**あなたは知らない** — 「どこが危険ですか」「何番に回せばいいですか」と聞かれても数字を答えず、『資料に書いてある』『その行を読め』と促す。**肩代わりするとこのステージの謎が消える**。\n\n読み取れたら**復唱させて確認する**(『危険位置は何番だと書いてある?』)。**プレイヤーが言った数字を照合して認める**形にする — こちらから先に言わない。\n\n回し終えたら『ランプはどうなった?』と改めて尋ね、**点滅している色を報告させてから**その線を切らせる。\n\n**赤だけが点いている**という報告が来たら、それは**危険位置に止まっている**合図。資料にそう書いてあるはずなので、確認させてすぐ動かすよう指示する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**この第一声で解き方を説明しない**。報告を受けたら『ロータリーが${position}番にありませんか』と現在位置を当て、認められたら**「手元の${sheet_panel}に解除方法が書いてある」**と資料番号と中身を続けて伝える(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**危険位置と解除位置の数字は言わない** — 資料を読むのはプレイヤーの仕事。**面 (表裏) は言わない**"
hint_l2 = "${sheet_panel}の**読み方**を促す — 今の見え方の行に危険位置と解除位置が並んでいる。**数字はこちらから言わない**。読み取れたか復唱させて確認し、報告された数字を照合して認める。危険位置で止まると即座に起動すること、通過は問題ないことは伝えてよい(**どこが危険かは言わない**)"
# 切る線の色は**言わない**。解除位置へ回せば装置に現れるので、
# 伏せても手詰まりにならない。
hint_l3 = "資料の**どの行を見るか**を具体的に伝えてよい(『今の見え方の行を横に読め』)。回し終えたら**「点滅しているランプと同じ色の線」**という言い方で切る線を伝える。**危険位置・解除位置の数字も、切る線の色名も、こちらからは言わない** — プレイヤーに読ませて報告させ、照合して認める。**このステージは資料を読むこと自体が謎**なので、代わりに読んでしまうと何も残らない"
