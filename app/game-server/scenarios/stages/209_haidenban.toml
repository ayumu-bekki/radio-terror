# 209. 配電盤照合 (docs/puzzle_stage_ideas.md §2.2)
#
# **ロータリーを回すたびにLEDの光り方が変わる**。プレイヤーは今の見え方を
# 報告し、ナビゲーターが「ロータリーが何番にありませんか」と当てる。
# 位置が分かったら手元の資料4で**危険位置**と**解除位置**を引き、
# 解除位置へ回してそこで点滅している線を切る。
#
# ## 位置ごとの見え方 (ADR C-14)
#
#   現在位置 … 対照表どおり (点灯色 + 点滅色)。**ここから表を引く**
#   解除位置 … **cut だけが点滅**。他はランダムに点灯/消灯
#   危険位置 … **赤だけ点灯**。止まると即爆発の合図
#   その他   … ランダム (ダミー。手がかりにならない)
#
# **解除位置の表示は対照表に載せない。** 載せると「解除位置は3 → その行の
# 点滅色が答え」と回す前に分かってしまい、回す工程が消える。
#
# **赤だけ点灯は危険位置に予約**。対照表の行はすべて点灯+点滅の2色なので、
# 1色だけの表示は必ず「危険位置に止まっている」を意味する。
# ダミーも2〜3色点灯にして、この合図と紛れないようにしている。
#
# ## 会話の形
#
#   プレイヤー 「赤が点いて青が点滅しています」
#   ナビ       「ロータリーが0番にありませんか」
#   プレイヤー 「はい、そうです」
#   ナビ       「では手元の資料4を見てくれ。解除方法が書いてある」
#
# ## ナビゲーターは危険位置を知らない立場を取る (ADR N-44)
#
# **表を読むのはプレイヤーの仕事**で、それがこのステージの謎そのもの。
# ナビが危険位置・解除位置を言えてしまうと**謎が丸ごと消える**。
#
# 206 綱渡り は逆で、危険位置を**ナビが伝える**(回す指示と一緒に。ADR N-49)。
# あちらは「止めずに通り抜ける」操作が謎で、危険位置がどこかを当てさせる遊びではない。
# **同じ forbidden_rotary でもステージによって扱いが逆になる。**
#
# 踏めば即爆発するが、それは**資料を読まずにロータリーを触った**結果であって、
# 伏せたことによる理不尽ではない (資料に書いてある)。
#
# そのため `answer` に**危険位置・解除位置の数値を載せない**。
# 「書いてあるが言うな」は守られない (ADR N-1) ので、最初から渡さない。

id = "209"
name = "配電盤照合"
difficulty = "normal"

[random]
# **cut は5色すべてから抽選できる** (決定91)。対照表の見え方は**点灯のみ**で、
# 点滅は解除位置でだけ出る「切る線」の合図に予約してある。
# だから cut がどの色でも現在位置の表示と衝突しない。
cut = { pick = "line" }
# **現在位置は抽選しない** (決定91)。ロータリーは前のプレイから物理的に
# 位置が残っており、サーバーがそこへ動かす手段が無い。抽選するとツマミの
# 実位置とずれ、プレイヤーが正しく資料を読んでも別の行を引くことになる
# (実運用で爆発した)。
#
# 代わりに**6行すべて**を Core へ渡し、**Core がステージ開始時点の実位置で
# 行を確定する**。返り値は "位置:危険:解除" を6つ並べたもの。
panel_rows = { pick = "panel", cut = "${cut}" }
# ロータリー位置ごとのLED表示 (対照表そのもの。JSONへ畳んで [core] へ渡す)
panel_leds = { pick = "rotary_leds", cut = "${cut}" }

[core]
cut = "${cut}"
# ロータリー位置ごとのLED表示。回すたびに差し替わる。
# **ステージ共通の leds は使わない** (rotary_leds が優先される)
rotary_leds = "${panel_leds}"
# **6行ぶんの対照表**。Core が開始時点の実位置で行を確定し、
# 解除位置 (precondition.rotary) と危険位置 (forbidden_rotary) を
# 自分で設定する。解除位置では cut だけを点滅させる。
#
# **precondition.rotary / forbidden_rotary はここに書かない** —
# 開始位置が分からないと決まらないため、Core が実行時に設定する。
panel_rows = { rows = "${panel_rows}", blink_ms = 500 }

[navigator]
briefing = "ロータリーの位置ごとにランプの光り方が違う。今光っている色から現在位置が分かるので、手元の${sheet_panel}で**危険位置**と**解除位置**を引く。解除位置へ回すと切るべき線が点滅する。危険位置で止まると即座に起動する(通過はセーフ)。"
# **ナビゲーターは対照表も現在位置も知らない** (決定91)。
# ロータリーは前のプレイから物理的に位置が残っており、サーバーは実位置を
# 知らない。知っているふりをすると、ずれたときに正しい報告を否定してしまう
# (実運用で「4番やない」と断定し、プレイヤーが誤った行を引いて爆発した)。
answer = "正解は${sheet_panel}で現在位置の行を引き、**解除位置**へ回して${cut}色の線を切ること。\n\n**あなたは今のロータリー位置を知らない。** ${sheet_panel}も持っていない。現在位置・危険位置・解除位置は**すべてプレイヤーが資料から読む** — ここを肩代わりすると**このステージの謎が丸ごと消える**。\n\n**位置を当てようとしない。** 位置の数字をこちらから言い当てにいってはいけない。**プレイヤーに読ませて報告させる**。\n\n**${cut}色という色名もプレイヤーより先に発話に入れない** — 解除位置へ回せば装置に現れる。プレイヤーの報告と照合するために使う。"
# **まず報告させる** (ADR N-10)。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここで解き方を説明しない**。\n\n**このステージで起こりうる見え方**(共通ルールの「説明にない光り方」の判断に使う): (a) 2〜3色が同時に点灯している / (b) 赤だけが点灯している(危険位置に止まっている合図) / (c) 1色だけが点滅し、他の色は点灯または消灯している(解除位置)。**これ以外(色が交互に入れ替わる・順番に光るなど)は起こりえない見え方**なので、共通ルールに従って復唱し確かめてもらう。\n\n起こりうる見え方の報告を受けたら、**手元の${sheet_panel}に解除方法が書いてあること、今光っている色の行を見ること**を、資料番号と中身を続けて伝える(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**。\n\n**ここから先はプレイヤーが表を読む。** 現在位置も危険位置も解除位置も**あなたは知らない** — 何番か・どこが危険かと聞かれても数字を答えず、資料に書いてある、その行を読め、と促す。**肩代わりするとこのステージの謎が消える**。**読み方に迷っていたら**、今光っている色の組と同じ組み合わせの行を探し、そこに現在位置・危険位置・解除位置が並んでいることを伝えてよい。危険位置で止まると即座に起動すること、通過は問題ないことも伝えてよい(**どこが危険かは言わない**)。\n\n**プレイヤーの報告を否定しない** (ADR N-50)。あなたは装置を見ていないので、報告された位置や数字が正しいか**判定できる立場にない**。報告された位置や数字を否定・断定してはいけない。食い違いを感じたら**もう一度資料と装置を照らし合わせるよう促す**だけにする。\n\n読み取れたら**危険位置と解除位置を復唱させて確認する**。**プレイヤーが言った数字をそのまま受けて**進める。**受けたら、その数字にダイヤルを合わせるよう、必ず「ダイヤル」という言葉を使って操作を指示する** — 数字を復唱するだけで終えると、その数字を**何に**反映すればよいか伝わらず、プレイヤーが操作せずに止まってしまう。**もう一度確かめさせる場面でも、確認が済んだらダイヤルを合わせる指示に必ずつなげる**。\n\n回し終えたら、ランプがどうなったかを改めて尋ね、**点滅している色を報告させてから**、**点滅しているランプと同じ色の線**を切らせる。**切る線の色名はプレイヤーより先に発話に入れない**。\n\n**点灯と点滅を取り違えないこと。** この2つは意味が正反対:\n\n- **点滅している色 = 切る線**。点滅していると報告されたら**その線を切らせる**\n- **赤だけが点灯している (点滅ではない) = 危険位置に止まっている**合図。すぐ別の位置へ動かすよう指示する\n\n**点滅と報告されたものを危険位置と誤認してはいけない**。切る線の色がたまたま赤でも、**点滅していれば切ってよい**。危険位置の合図は**点灯**であって点滅ではない。"
