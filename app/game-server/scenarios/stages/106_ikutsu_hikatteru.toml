# 106. いくつ光ってる? (docs/puzzle_stage_ideas.md §2.1)
# 「光っているランプの数と同じ位置にロータリーを合わせて○色を切れ」。
# 点灯数がそのままロータリー位置になるため、count は 0-5 の範囲に収める。

id = "106"
name = "いくつ光ってる?"
difficulty = "easy"

[random]
cut = { pick = "line" }
# 点灯させるLEDの数 (= 合わせるロータリー位置)。1-5から抽選する
lit_count = { pick = "int", min = 1, max = 5 }
# 点灯させるLEDを lit_count 個選ぶ
lit = { pick = "colors", count = "${lit_count}" }

[core]
# lit で選ばれた色を全て点灯させる
leds = { "${lit}" = "on" }
cut = "${cut}"
precondition = { rotary = "${lit_count}" }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "点灯しているランプの数を数え、その数と同じ位置にダイヤルを合わせてから指定の線を切る。"
answer = "点灯しているランプは${lit_count}個。ダイヤルを${lit_count}に合わせて${cut}色の線を切るのが正解。"
hint_l1 = "点灯しているランプがいくつあるか数えさせる"
hint_l2 = "数えた数とダイヤルの数字に関係があることに気づかせる"
hint_l3 = "「点灯している数と同じ位置にダイヤルを合わせる」と手順を教えてよい"
