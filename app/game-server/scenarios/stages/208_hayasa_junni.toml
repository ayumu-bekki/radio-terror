# 208. 速さくらべ (docs/puzzle_stage_ideas.md §2.2)
#
# 105 早い者勝ち(2色から速い方)の多色版。
# **1色が点灯しっぱなし・残り4色が違う速さで点滅**する。
# 点灯している色は「基準外」で、残り4色のうち**一番速い色**を切る。
#
# ## 点灯1色を置く理由 (報告を作る)
#
# 全色が点滅していると、プレイヤーが最初に報告できる情報が
# 「全部点滅しています」しかなく、無線の往復が生まれない。
# 1色だけ点灯させると『○色だけ点きっぱなしです』という**一言で済む報告**が
# 発生し、ナビゲーターが「その色は数えるな」と応じる往復が作れる。
#
# ## 正解を最速に固定した理由
#
# かつては5色を速い順に並べて「X番目」を切らせていたが、中間順位(2〜4番目)を
# 引くと `answer` が「○番目に速い色」となり**ナビゲーターが色名を言えない**。
# 行き詰まったプレイヤーを無線の問答で救えないため、213 光の長さを無効化したのと
# 同じ問題を抱えていた (§5)。
#
# 正解を最速に固定すると、報告が『一番速いのは△色です』で済み、
# ナビゲーターは色名で確認できる。救済経路が残る。
# 毎回変わるのは「どの色が最速か」なので、単調にはならない。
#
# ## 速度
#
# 隣接比が 1.4〜2 倍になる固定4段階を使う。ランダムな速度にすると抽選次第で
# 差が接近し、見分けが運になってしまうため。
#   150ms (= cut) / 300ms / 550ms / 1000ms
#
# 点滅は対称(点灯時間=消灯時間)。モールス表示のステージ(203/308)と
# 混同されないようにする。

id = "208"
name = "速さくらべ"
difficulty = "normal"

[random]
# **cut を先に引く**。5色すべてを表示に使うため、cut は未使用の線に限られる
# (pick = "line" が使用済みの色を自動で除く)。cut を後から choice で選ぶ形にすると、
# 候補2つが両方とも使用済みだったときに組み立てが失敗する。
cut = { pick = "line" }

# **cut は必ず最速 (150ms) にする**。中間の速さを正解にすると answer が
# 「2番目に速い色」となり、ナビゲーターが色名を言えなくなるため
# (§5 の 213 光の長さを無効化したのと同じ問題)。
#
# 最遅側と交互にしたいところだが、TOML に条件分岐は書けないため
# **最速に固定**する。プレイヤーから見て変わるのは「どの色が最速か」で、
# 毎回抽選されるため単調にはならない。
# (ナビゲーターの指示は常に「一番速く点滅している色を切れ」になる)

# 点灯しっぱなしにする基準外の色 (数に入れない)。cut とは別の色にする
# (点灯 = 正解 だとプレイヤーが誤学習し、以降のステージで的外れな報告をする)
steady = { pick = "color", exclude = ["${cut}"] }

# 点滅する残り3色。cut より遅い中間〜最遅を埋める枠で、正解にはならない。
m1 = { pick = "color", exclude = ["${cut}", "${steady}"] }
m2 = { pick = "color", exclude = ["${cut}", "${steady}", "${m1}"] }
m3 = { pick = "color", exclude = ["${cut}", "${steady}", "${m1}", "${m2}"] }

[core]
# 1色は点灯しっぱなし (基準外)、残り4色が違う速さで点滅する。
# cut が最速 (150ms) で、m1 → m2 → m3 の順に遅くなる。
leds = { "${steady}" = "on", "${cut}" = { pattern = "blink", on_ms = 150, off_ms = 150 }, "${m1}" = { pattern = "blink", on_ms = 300, off_ms = 300 }, "${m2}" = { pattern = "blink", on_ms = 550, off_ms = 550 }, "${m3}" = { pattern = "blink", on_ms = 1000, off_ms = 1000 } }
cut = "${cut}"
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "1つのランプが点灯しっぱなしで、残り4つが違う速さで点滅している。点灯している色は数に入れず、点滅している4色の中で一番速く点滅している色の線を切る。"
# 点滅の速い順を明記する。切る色は必ず最速なので、ナビゲーターは
# 「一番速く点滅している色」と言えば足り、プレイヤーの報告が正しいかを
# **色名で照合できる**。中間順位を指す言い方は発生しない。
#
# 文面は「照合の材料」として書き、**ナビゲーターが読み上げると成立する形に
# しない**。「プレイヤーが${cut}色を報告してきたら」のような書き方だと、
# L1-L2 でなぞられたときに「${cut}色ですか?」とこちらから色名を出しかねない
# (navigator_design.md §5 決定19: 答えを目の前に置くとなぞられる)。
answer = "点灯しっぱなしなのは${steady}色(基準外・数に入れない)。点滅の速い順は ${cut}(最速) → ${m1} → ${m2} → ${m3}(最遅)。切るのは一番速く点滅している${cut}色の線。プレイヤーの報告が${cut}色と一致するかを照合に使うこと。一致しない報告には色名を出さず、見比べ直させる。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つだけ点きっぱなし』という報告を受けたら『その色は基準だ、数に入れるな』と伝える。次に『残りの中で一番速く点滅している色はどれか』と尋ね、色を報告させる。**色名は必ずプレイヤーに先に言わせること**。報告を受けてから${cut}色と照合し、一致していればその色を復唱して『それを切れ』と指示する。一致しなければ色名を出さずに『もう一度見比べてみろ』と促し、探し直させる。迷っていれば、報告された色と他の色を1つずつ見比べるよう助言する。"
hint_l1 = "1つだけ点灯しっぱなしのランプがあることに気づかせ、それは数に入れないと伝える"
hint_l2 = "点滅している4色を見比べ、一番速いものを探すよう促す。2色ずつ見比べて速い方を残していくと絞りやすいと助言する"
hint_l3 = "一番速く点滅している色を切ることを明確に伝え、見つけた色を報告させる。報告が正しければ確認して切らせてよい"
