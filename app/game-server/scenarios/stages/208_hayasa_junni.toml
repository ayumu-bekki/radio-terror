# 208. 速さくらべ (docs/puzzle_stage_ideas.md §2.2)
#
# 105 早い者勝ち(2色から速い方)の5色版。
# 5色すべてが異なる速さで点滅し、「X番目に速い色」の線を切る。
# 2択の見比べから、5色を速い順に並べる作業へ難度が上がる。
#
# 速度は隣接比が 1.4〜2 倍になる固定5段階を使う。ランダムな速度にすると
# 抽選次第で差が接近し、順位付けが運になってしまうため。
#   150ms / 300ms / 500ms / 750ms / 1050ms
#
# 点滅は対称(点灯時間=消灯時間)。モールス表示のステージ(203/304)と
# 混同されないようにする。

id = "208"
name = "速さくらべ"
difficulty = "normal"

[random]
# 5色を速い順に排他抽選する (c1 が最速、c5 が最遅)
c1 = { pick = "color" }
c2 = { pick = "color", exclude = ["${c1}"] }
c3 = { pick = "color", exclude = ["${c1}", "${c2}"] }
c4 = { pick = "color", exclude = ["${c1}", "${c2}", "${c3}"] }
c5 = { pick = "color", exclude = ["${c1}", "${c2}", "${c3}", "${c4}"] }

# 何番目に速い色を切らせるかを抽選する。
# 候補を速い順に並べているため、選ばれた色の順位が確定する。
#
# as_line = true: 5色すべてを表示に使うため、cut は「他ステージで未使用の色」
# に限る必要がある (指定しないと切断線がステージ間で重複する)。
cut = { pick = "choice", as_line = true, candidates = [
  "${c1}",
  "${c2}",
  "${c3}",
  "${c4}",
  "${c5}",
] }

[core]
leds = { "${c1}" = { pattern = "blink", on_ms = 150, off_ms = 150 }, "${c2}" = { pattern = "blink", on_ms = 300, off_ms = 300 }, "${c3}" = { pattern = "blink", on_ms = 500, off_ms = 500 }, "${c4}" = { pattern = "blink", on_ms = 750, off_ms = 750 }, "${c5}" = { pattern = "blink", on_ms = 1050, off_ms = 1050 } }
cut = "${cut}"
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "5つのランプがすべて違う速さで点滅している。速い順に並べて、指定された順番の色の線を切る。"
# 速い順の並びを明記する。ナビゲーターはこの並びから「切る色が何番目か」を
# 自分で数えて伝える (順位を別変数にすると色との整合が崩れるため、
# 並び全体を渡して判断させる)。
answer = "点滅の速い順に ${c1}(最速) → ${c2} → ${c3} → ${c4} → ${c5}(最遅)。切るのは${cut}色の線。この並びの中で${cut}が何番目かを数えて『○番目に速い色を切れ』と伝えること。"
procedure = "まず5つのランプすべてが点滅していること、速さが全部違うことを確認させる。次に『一番速いのはどれか』『一番遅いのはどれか』と両端から絞らせると並べやすい。並べられたら『○番目に速い色の線を切って』と指示する。"
hint_l1 = "5つのランプすべてが点滅していること、速さがそれぞれ違うことに気づかせる"
hint_l2 = "速い順に並べる作業を促す。一番速いもの・一番遅いものから決めると並べやすいと助言する"
hint_l3 = "切るのが何番目に速い色かを伝えてよい(色名は言わない)。並べ方に迷っていれば順番の確認を手伝う"
