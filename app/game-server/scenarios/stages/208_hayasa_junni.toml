# 208. 速さくらべ (docs/puzzle_stage_ideas.md §2.2)
#
# 105 早い者勝ち(2色から速い方)の多色版。
# **1色が点灯しっぱなし・残り4色が違う速さで点滅**する。
# 点灯している色は「基準外」で、残り4色のうち**一番速い色**を切る。
#
# ## 点灯1色を置く理由 (報告を作る)
#
# 全色が点滅していると、プレイヤーが最初に報告できる情報が
# 「全部点滅しています」しかなく、無線の往復が生まれない。
# 1色だけ点灯させると『○色だけ点きっぱなしです』という**一言で済む報告**が
# 発生し、ナビゲーターが「その色は数えるな」と応じる往復が作れる。
#
# ## 「N番目に速い色」を切らせる (ADR N-40)
#
# かつては**正解を最速に固定**していた。中間順位を正解にすると `answer` が
# 「○番目に速い色」となり、**L4 (直言) でナビゲーターが色名を言えず**
# 行き詰まりを救えなかったため (213 光の長さを無効化したのと同じ問題)。
#
# **ノーマル以上が L4 を出さなくなった (ADR N-39) ので、この制約は消えた。**
# L3 が上限なら、どのみち色名は言わない。「一番速い色を切れ」しか言えない
# 状態は指示が毎回同じで単調だったため、**順位を毎回抽選する**形へ戻す。
#
# 順位は 1〜4 の全てから引く。「一番速い」「一番遅い」の当たり回もあるので、
# 難易度に幅が出る。
#
# ## 速度
#
# 隣接比が 1.4〜2 倍になる固定4段階を使う。ランダムな速度にすると抽選次第で
# 差が接近し、見分けが運になってしまうため。
#   150ms (= cut) / 300ms / 550ms / 1000ms
#
# 点滅は対称(点灯時間=消灯時間)。モールス表示のステージ(203/308)と
# 混同されないようにする。

id = "208"
name = "速さくらべ"
difficulty = "normal"

[random]
# **cut を先に引く**。5色すべてを表示に使うため、cut は未使用の線に限られる
# (pick = "line" が使用済みの色を自動で除く)。cut を後から choice で選ぶ形にすると、
# 候補2つが両方とも使用済みだったときに組み立てが失敗する。
cut = { pick = "line" }

# **cut が何番目に速いか**を毎回抽選する (1=最速 〜 4=最遅)。
# ナビゲーターの指示が「N番目に速く点滅している色を切れ」と毎回変わる。
rank = { pick = "int", min = 1, max = 4 }

# 点灯しっぱなしにする基準外の色 (数に入れない)。cut とは別の色にする
# (点灯 = 正解 だとプレイヤーが誤学習し、以降のステージで的外れな報告をする)
steady = { pick = "color", exclude = ["${cut}"] }

# cut 以外の点滅3色。速い順の並びに cut を rank 番目で差し込んで使う。
m1 = { pick = "color", exclude = ["${cut}", "${steady}"] }
m2 = { pick = "color", exclude = ["${cut}", "${steady}", "${m1}"] }
m3 = { pick = "color", exclude = ["${cut}", "${steady}", "${m1}", "${m2}"] }

# 速い順に並べた4色。cut を rank 番目に置き、残りを m1→m2→m3 の順に詰める。
# 速度そのものは [core] 側で s1〜s4 に固定値を割り当てる。
s1 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 1, others = ["${m1}", "${m2}", "${m3}"] }
s2 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 2, others = ["${m1}", "${m2}", "${m3}"] }
s3 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 3, others = ["${m1}", "${m2}", "${m3}"] }
s4 = { derive = "rank_slot", cut = "${cut}", rank = "${rank}", slot = 4, others = ["${m1}", "${m2}", "${m3}"] }

[core]
# 1色は点灯しっぱなし (基準外)、残り4色が違う速さで点滅する。
# s1 が最速 (150ms) で、s4 が最遅 (1000ms)。cut は rank 番目のスロットに入る。
leds = { "${steady}" = "on", "${s1}" = { pattern = "blink", on_ms = 150, off_ms = 150 }, "${s2}" = { pattern = "blink", on_ms = 300, off_ms = 300 }, "${s3}" = { pattern = "blink", on_ms = 550, off_ms = 550 }, "${s4}" = { pattern = "blink", on_ms = 1000, off_ms = 1000 } }
cut = "${cut}"

[navigator]
briefing = "1つのランプが点灯しっぱなしで、残り4つが違う速さで点滅している。点灯している色は数に入れず、点滅している4色を速い順に並べて、${rank}番目に速い色の線を切る。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**1つが点きっぱなしで、残り4つが点滅している**ことを報告できたか。点灯と点滅の区別がついていれば、色名が無くても報告できたとみなす"
# 点滅の速い順を明記する。**順位は毎回変わる**ため、ナビゲーターは
# 「${rank}番目に速く点滅している色」と order を伝え、プレイヤーの報告が
# 正しいかを**色名で照合する**。
#
# 文面は「照合の材料」として書き、**ナビゲーターが読み上げると成立する形に
# しない**。「プレイヤーが${cut}色を報告してきたら」のような書き方だと、
# L1-L2 でなぞられたときに「${cut}色ですか?」とこちらから色名を出しかねない
# (navigator_design.md §5 決定19: 答えを目の前に置くとなぞられる)。
answer = "点灯しっぱなしなのは${steady}色(基準外・数に入れない)。点滅の速い順は ${s1}(最速) → ${s2} → ${s3} → ${s4}(最遅)。切るのは**${rank}番目に速く点滅している**${cut}色の線。プレイヤーの報告が${cut}色と一致するかを照合に使うこと。一致しない報告には色名を出さず、数え直させる。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つだけ点きっぱなし』という報告を受けたら『その色は基準だ、数に入れるな』と伝える。**次に切る順位(${rank}番目に速い色)を必ず伝える** — 順位は装置を見ても分からないので、伏せると手詰まりになる。そのうえで『速い順に並べて${rank}番目はどれか』と尋ね、色を報告させる。**色名は必ずプレイヤーに先に言わせること**。報告を受けてから${cut}色と照合し、一致していれば**『それが${rank}番目だ、その色の線を切れ』のように理由を添えて**切るよう指示する。色名を復唱するだけで『その色を切れ』と言うと、**なぜその色なのかが伝わらず唐突に聞こえる**(実運用で発生: 速さの話をした直後に色名だけ言われ、プレイヤーが根拠を見失った)。一致しなければ色名を出さずに『違う、もう一度速い順に並べてみろ』と促し、数え直させる。迷っていれば、2色ずつ見比べて速い方を残していく数え方を助言する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『1つだけ点きっぱなしで残りが点滅』という報告を受けたら、**点灯している色は数に入れないことと、切るのは${rank}番目に速い色だという判断基準を続けて伝える**(色名は言わない)。**順位(${rank}番目)は装置を見ても分からないので必ず伝えること**。基準を伏せたまま『よく見て』とだけ返すと、何を探せばよいか分からず手が止まる"
hint_l2 = "点滅している4色を速い順に並べるよう促す。2色ずつ見比べて速い方を残していくと並べやすいと助言する。並べたら${rank}番目を数えさせる"
# 誤報告への返し方まで書く。「報告が正しければ〜」だけだと、
# **間違っていた場合の言い方が指定されず**、生成AIが
# 「黄色だな、了解。赤と見比べろ」のように正解色を出して比較させてしまう
# (シミュレーションで発生)。差し戻しは色名を使わずに書かせる。
hint_l3 = "${rank}番目に速く点滅している色を切ることを明確に伝え、見つけた色を報告させる。報告が正しければ**『それが${rank}番目だ』と根拠を添えて**確認し、切らせてよい。報告が間違っていた場合は『違う、もう一度速い順に数え直せ』とだけ返し、**正解の色名や『○色と見比べろ』という形で正解色を出してはいけない**"
