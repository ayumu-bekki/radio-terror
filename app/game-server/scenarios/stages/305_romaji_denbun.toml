# 305. ローマ字電文 (docs/puzzle_stage_ideas.md §2.3)
#
# モールスで**色名そのもの**(AKA / KI / MIDORI / AO / SIRO)を表示する。
# 対照表で変換する必要はなく、読めればそのまま答えになる。
#
# 202 暗号電文は「語の頭文字 → 対照表 → 色」の2段階変換だが、
# こちらは1段階。ただし語が長く(最大6文字)、**解読そのものに時間がかかる**。
# MIDORI は6文字 = 1周に約20秒かかるため、カウントダウンとの戦いになる。
#
# 難しい難易度に置く理由は「変換の複雑さ」ではなく「所要時間」。

id = "305"
name = "ローマ字電文"
difficulty = "hard"

[random]
# 表示する色名。ローマ字表記がそのまま cut の色に対応するため、
# 既に切られた線に対応する語は組み立て時に候補から外れる。
# (morse は A-Z / 0-9 のみ対応。§6.1)
color_word = { pick = "romaji_word", candidates = [
  "AKA",
  "KI",
  "MIDORI",
  "AO",
  "SIRO",
] }
cut = { derive = "romaji_color", from = "${color_word}" }

# モールスを表示するLED (どの色に出るかはランダム)
display = { pick = "color" }

[core]
leds = { "${display}" = { pattern = "morse", word = "${color_word}", unit_ms = 250 } }
cut = "${cut}"

[navigator]
briefing = "1つのランプがモールス信号でローマ字を繰り返し表示している。読み解くと色名になっており、その色の線を切る。${sheet_morse}での色変換は不要で、読めればそのまま答えになる。"
answer = "表示されているのは「${color_word}」= ${cut}色。${cut}色の線を切るのが正解。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。1つが長短で点滅している、という報告を受けてから、**それがモールス信号であること**と、**手元の${sheet_morse}で1文字ずつ読む**ことを促す(資料番号と中身をひとまとまりで言う。**面 (表裏) は言わない**)。**読み解くと色の名前になっている**ことは伝えてよい。\n\n読めた文字を**1文字ずつ順に報告する**よう伝える。途中まで読めた時点で、ナビゲーター側で${color_word}と推測し、最後まで読むよう励まして導く。**途中まで読めていれば、その読みで合っているかを確認する形で後押ししてよい**。音声認識の誤変換(例: AK A→AKA、SI RO→SIRO)は柔軟に補正する。途中で止まりそうなら、次の符号が長点か短点かを尋ねて助け舟を出し、解読を急がせる。\n\n**色名そのもの(切る線の色)はプレイヤーより先に発話に入れない** — 読めた綴りを確認する形にとどめ、色名はプレイヤーに言わせる。"
