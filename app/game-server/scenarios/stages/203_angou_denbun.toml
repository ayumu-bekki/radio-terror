# 203. 暗号電文 (docs/puzzle_stage_ideas.md §2.2)
# LEDがNATOフォネティックコードの語をモールスでループ表示する。
# ミッションシートのモールス対照表 (各文字に色付きの固定印刷。5色を循環割当) で
# 解読し、頭文字に対応する色の線を切る。
#
# 対照表の色割当: A=赤(A) B=黄(B) C=緑(C) D=青(D) E=白(E) F=赤(A) ... と5色循環。
# したがって語の頭文字から切る線が一意に決まるため、cut は word から導出する
# (pick = "morse_word" が語と頭文字対応色の組を解決する)。
#
# 候補語は5色すべてをカバーするよう揃える。どの色が残っていても語を選べるため、
# このステージは他ステージと同じ順序で組み立てられる(特別扱い不要)。
# モールス表示が長くなりすぎないよう、各色から短めの語を選んでいる。

id = "203"
name = "暗号電文"
difficulty = "normal"

[random]
# 語を選ぶと、その頭文字→対照表の色 が cut として同時に決まる。
# 頭文字の色が既に他ステージで使われている語は、組み立て時に候補から外れる。
word = { pick = "morse_word", candidates = [
  # A=赤
  "ALFA",
  "KILO",
  "PAPA",
  # B=黄
  "BRAVO",
  "GOLF",
  "LIMA",
  # C=緑
  "MIKE",
  "HOTEL",
  "ROMEO",
  # D=青
  "DELTA",
  "INDIA",
  "XRAY",
  # E=白
  "ECHO",
  "TANGO",
  "OSCAR",
] }
cut = { derive = "morse_word_color", from = "${word}" }
# モールスを表示するLED (テンプレート抽選)
display = { pick = "color" }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
cut = "${cut}"
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "1つのランプがモールス信号で単語を繰り返し表示している。ミッションシートのモールス対照表で解読し、その単語の頭文字の色と同じ色の線を切る。"
answer = "表示されている単語は${word}。対照表で頭文字を引くと${cut}色になるため、${cut}色の線を切るのが正解。"
procedure = "『アルファ』等の単語名、1文字ずつのアルファベット、『トンツー/短長』のオノマトペ、いずれの報告も受け付ける。音声認識で漢字等に誤変換（例: 三毛→MIKE、パパ→PAPA、キロ→KILO）されても、該当する正解の語（${word}）として解釈してよい。単語が特定できたら『対照表でその頭文字（${word}の最初の文字）の色を確認してください』と促す。"
hint_l1 = "点滅の長短にパターンがあること、モールス信号であることに気づかせる"
hint_l2 = "ミッションシートのモールス対照表を使って1文字ずつ解読するよう促す"
hint_l3 = "「解読した単語の頭文字を対照表で引き、その色の線を切る」と手順を教えてよい"
