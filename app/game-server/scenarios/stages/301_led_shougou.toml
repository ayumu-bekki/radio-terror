# 301. LED照合 (docs/puzzle_stage_ideas.md §2.3)
# ランプの点灯パターンを紙資料で3段階に読み解き、**ダイヤル位置と切る線の両方**を
# 導く。202 で唯一「表示から2つの答えが出る」ステージ。
#
#   ランプ4つの点灯/消灯 → 変換表でキーワード       (例 INDEX)
#   キーワードの頭文字   → デコード表でダイヤル位置 (I → 1)
#   キーワードの末尾文字 → デコード表で基準色       (X → 緑)
#   基準色 + ランプの状態 → 分岐表で切る線が決まる   (緑・白点灯 → 緑)
#
# **3つの表は同じ資料番号 (資料2) にまとめてある** (ADR D-2)。
# 必ず順にたどるため一部だけ見る場面が無く、番号を分けると
# ナビが段階ごとに番号を言い直すことになる。
#
# **回路図 (資料3) は参照しない** — あれは 205 専用。
# 202 の分岐表を回路図へ載せると、205 のプレイヤーの視界に
# 色の対応が入り、「シートだけが手がかり」という 205 の原則が壊れる。
#
# **赤のランプは常時消灯のダミー**。4bit = 16通りのうち全消灯だけは
# 故障と見分けがつかないため使わず、15通りを対照表に載せてある。
#
# 対照表は `scenario_codebook.go` に1箇所だけ置き、紙資料と突き合わせる
# (docs/printed_materials.md §4)。**cut から表示を逆引きする**ため、
# 他ステージとの色の重複 (ADR S-2) は通常どおり回避される。

id = "301"
name = "LED照合"
# **ハード** (2026-08-24 に normal から変更)。
# 資料2の**3つの表を順にたどり** (変換 → デコード → 分岐)、
# さらに**ダイヤルを合わせて切る**。工程が4段で全ステージ中いちばん長い。
# ノーマルは1セッション3ステージのため、時間配分が厳しくなっていた。
difficulty = "hard"

[random]
cut = { pick = "line" }
# cut になる表示を対照表から1通り選ぶ (返り値は "1011" のような4桁2進表記)。
# **表示を先に抽選しない** — cut が表側で決まると色の重複を避けられない (ADR S-1)。
pattern = { pick = "codebook", cut = "${cut}" }
# 選ばれた表示から各項目を引く。**別々に人手で書かない** (ADR S-1)
lit = { derive = "codebook_field", from = "${pattern}", field = "lit" }
word = { derive = "codebook_field", from = "${pattern}", field = "word" }
rotary = { derive = "codebook_field", from = "${pattern}", field = "rotary" }

[core]
# 点灯するランプだけを指定する。赤(A)は常時消灯のダミーなので現れない。
leds = { "${lit}" = "on" }
cut = "${cut}"
# **ダイヤルを合わせた状態で切る**。位置は資料2 のデコード表で頭文字から引いた値。
precondition = { rotary = "${rotary}" }

[navigator]
briefing = "ランプの点灯パターンを紙資料で読み解く3段階の暗号。${sheet_codebook}には表が3つ並んでいる。まず変換表で点灯/消灯の並びをキーワードにし、次にデコード表でそのキーワードの頭文字と末尾文字を引いてダイヤル位置と基準色を出す。最後に分岐表で切る線が決まる。**すべて${sheet_codebook}の中で完結する**。**ダイヤルを合わせた状態で切る**必要がある。"
# 文面は「照合の材料」として書く (202 旧版・208 と同じ方針)。
# 「正解は${cut}色」と結論を書くと、なぞられて L3 で言い切ってしまう。
# **結論を出すのはプレイヤー**。
answer = "点灯しているランプは${lit}(赤は常時消灯のダミー)。${sheet_codebook}の変換表で引くとキーワードは**${word}**。頭文字からデコード表でダイヤル位置**${rotary}**が出る。末尾文字から基準色が出て、分岐表まで解くと${cut}色になる。**ダイヤルを${rotary}に合わせた状態で切る**。**この読み解きはプレイヤーにさせること** — ${cut}色という色名は報告と照合するためだけに使い、プレイヤーより先に発話に入れない。ダイヤル位置${rotary}は伝えてよい(装置にもランプにも現れず、資料を引かないと出ない情報ではあるが、色と違って答えそのものではない)。"
# **どこを見るかは資料番号で一言で指す** (ADR D-2)。初出は中身も添える (ADR D-4)。
# **面 (表裏) は言わない** — 探すのも体験のうちで、刷り直しにも強い。
procedure = "まず『ランプはどうなっている?』と尋ね、**点いているランプと消えているランプを色で報告させる**。赤は常に消えているダミーなので、報告に赤が無くても正しい(赤はダミーだと教えてよい)。\n\n報告を受けたら、**手元の${sheet_codebook}の一番上の表 (変換表) の見方まで**伝えて、キーワードを引かせる(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**。「変換表でランプの並びをキーワードに変換して」のような**抽象的な言い方だけで済ませない** — 何を見てどこを読むのかが伝わらない (決定154)。次の順で1つの発話にまとめる:\n\n1. 報告されたランプの色を復唱する\n2. ${sheet_codebook}の**一番上の表**は、見出しが**ランプの色 (黄・緑・青・白)** で、**●が点いている・○が消えている**\n3. **今の点き方と同じ●○の並びの行**を探し、**その行の右端に書いてある英単語**を読んで教えてほしいと頼む (それがキーワード)\n\n報告に出てこなかった色は消えているものとして扱ってよい (必要なら、ほかのランプは消えているかを確かめる)。**キーワードをプレイヤーより先に発話に入れない** — 表を引くのはプレイヤーの仕事。読めたキーワードを報告させ、合っているかを照合して認める。\n\n**キーワードが報告されたら、2つ目の表 (デコード表) の見方まで伝える**。「頭文字と末尾文字を引いて」のような言い方だけで済ませない (決定154)。**資料番号は言い直さない** — 同じ紙の中で視線を移すだけなので、番号を繰り返すと別の紙を探しに行く。次の順で1つの発話にまとめる:\n\n1. キーワードを復唱して受ける\n2. **先に目的を言う**: キーワードの**最初の文字はダイヤルの位置**を、**最後の文字は切る線の色**を表している (表の引き方より先に。何のために引くのかが分からないと、引き方を聞いても手が動かない。決定154)\n3. **最初の文字**を2つ目の表の**上の段 (文字の範囲と数字が並んでいる)** で探すと、ダイヤルを合わせる数字が出る\n4. **最後の文字**を**下の段 (文字と色が並んでいる)** で探すと、切る線の色の元になる色 (基準色) が出る\n5. 数字と色の2つを教えてほしいと頼む\n\n**プレイヤーが引いたダイヤル位置は数字で復唱してよい。引けずに詰まっていたら、ダイヤル位置${rotary}を伝えてよい**。\n\n**数字と基準色が報告されたら、3つ目の表 (分岐表) の見方まで伝える**。ここでも資料番号は言い直さない。次の順で1つの発話にまとめる:\n\n1. ダイヤルの数字と基準色を復唱して受ける\n2. **基準色は、ランプの状態で最後に変わることがある**。3つ目の表で**基準色の行**を見ると、**確かめるランプ (緑か白)** が書いてある (基準色が白か黄なら緑のランプ、それ以外なら白のランプ)\n3. **そのランプが点いていれば基準色のまま、消えていればその行に書いてある色**が、切る線の色になる\n4. その色の線を、**ダイヤルを${rotary}に合わせた状態で**切る\n\n**ダイヤルを${rotary}に合わせてから切るよう必ず念を押す**。位置が合っていないと正しい線でも切れない。\n\n**切る線の色名はプレイヤーより先に発話に入れない**。プレイヤーに判断させ、報告された色を照合して認める。"
