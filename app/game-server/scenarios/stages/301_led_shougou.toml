# 301. LED照合 (docs/puzzle_stage_ideas.md §2.3)
# ランプの点灯パターンを紙資料で読み解き、**ダイヤル位置と切る線の両方**を
# 導く。202 で唯一「表示から2つの答えが出る」ステージ。
#
#   ランプ4つの点灯/消灯   → ランプ変換表でキーワード            (例 SPARK)
#   キーワードの先頭の文字 → ダイヤルデコード表でダイヤル位置    (S → 4)
#   キーワードの末尾の文字 → 基準カラー表で切る線の色            (K → 赤)
#
# **基準カラー表の色がそのまま切る線**。以前は基準色にランプの状態で変わる
# 分岐表があったが、紙資料に無く、白のみ点灯の ZONE で青が正解になって食い違った
# (実機。2026-11-13 に廃止)。
#
# **3つの表は同じ資料番号 (資料2) にまとめてある** (ADR D-2)。
# 必ず順にたどるため一部だけ見る場面が無く、番号を分けると
# ナビが段階ごとに番号を言い直すことになる。
#
# **回路図 (資料3) は参照しない** — あれは 205 専用。
# 202 の分岐表を回路図へ載せると、205 のプレイヤーの視界に
# 色の対応が入り、「シートだけが手がかり」という 205 の原則が壊れる。
#
# **赤のランプは常時消灯のダミー**。4bit = 16通りのうち全消灯だけは
# 故障と見分けがつかないため使わず、15通りを対照表に載せてある。
#
# 対照表は `scenario_codebook.go` に1箇所だけ置き、紙資料と突き合わせる
# (docs/printed_materials.md §4)。**cut から表示を逆引きする**ため、
# 他ステージとの色の重複 (ADR S-2) は通常どおり回避される。

id = "301"
name = "LED照合"
# **ハード** (2026-08-24 に normal から変更)。
# 資料2の**3つの表を順にたどり** (ランプ変換 → ダイヤルデコード・基準カラー)、
# さらに**ダイヤルを合わせて切る**。
# ノーマルは1セッション3ステージのため、時間配分が厳しくなっていた。
difficulty = "hard"

[random]
cut = { pick = "line" }
# cut になる表示を対照表から1通り選ぶ (返り値は "1011" のような4桁2進表記)。
# **表示を先に抽選しない** — cut が表側で決まると色の重複を避けられない (ADR S-1)。
pattern = { pick = "codebook", cut = "${cut}" }
# 選ばれた表示から各項目を引く。**別々に人手で書かない** (ADR S-1)
lit = { derive = "codebook_field", from = "${pattern}", field = "lit" }
word = { derive = "codebook_field", from = "${pattern}", field = "word" }
rotary = { derive = "codebook_field", from = "${pattern}", field = "rotary" }

[core]
# 点灯するランプだけを指定する。赤(A)は常時消灯のダミーなので現れない。
leds = { "${lit}" = "on" }
cut = "${cut}"
# **ダイヤルを合わせた状態で切る**。位置は資料2 のダイヤルデコード表で先頭の文字から引いた値。
precondition = { rotary = "${rotary}" }

[navigator]
briefing = "ランプの点灯パターンを紙資料で読み解く暗号。${sheet_codebook}には表が3つ並んでいる。まず**ランプ変換表**で点灯/消灯の並びをキーワードにし、キーワードの先頭の文字を**ダイヤルデコード表**で引いてダイヤル位置を出し、末尾の文字を**基準カラー表**で引いて切る線の色を出す。**すべて${sheet_codebook}の中で完結する**。**ダイヤルを合わせた状態で切る**必要がある。"
# 文面は「照合の材料」として書く (202 旧版・208 と同じ方針)。
# **結論を出すのはプレイヤー**。
answer = "点灯しているランプは${lit}(赤は常時消灯のダミー)。${sheet_codebook}のランプ変換表で引くとキーワードは**${word}**。先頭の文字からダイヤルデコード表でダイヤル位置**${rotary}**が出る。末尾の文字から基準カラー表で${cut}色が出る(これがそのまま切る線)。**ダイヤルを${rotary}に合わせた状態で切る**。**この読み解きはプレイヤーにさせること** — ${cut}色という色名は報告と照合するためだけに使い、プレイヤーより先に発話に入れない。ダイヤル位置${rotary}は伝えてよい(装置にもランプにも現れず、資料を引かないと出ない情報ではあるが、色と違って答えそのものではない)。"
# **どこを見るかは資料番号で一言で指す** (ADR D-2)。初出は中身も添える (ADR D-4)。
# **面 (表裏) は言わない** — 探すのも体験のうちで、刷り直しにも強い。
# **表は紙に印刷された名前で指す**: ランプ変換表・ダイヤルデコード表・基準カラー表。
# 「一番上の表」「2つ目の表」のような位置では探せなかった (実機。2026-11-13)。
procedure = "まず『ランプはどうなっている?』と尋ね、**点いているランプと消えているランプを色で報告させる**。赤は常に消えているダミーなので、報告に赤が無くても正しい(赤はダミーだと教えてよい)。\n\n報告を受けたら、**手元の${sheet_codebook}にある「ランプ変換表」の見方まで**伝えて、キーワードを引かせる(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**。「表でランプの並びをキーワードに変換して」のような**抽象的な言い方だけで済ませない** — 何を見てどこを読むのかが伝わらない (決定154)。次の順で1つの発話にまとめる:\n\n1. 報告されたランプの色を復唱する\n2. ${sheet_codebook}の**ランプ変換表**は、見出しが**ランプの色 (黄・緑・青・白)** で、**●が点いている・○が消えている**\n3. **今の点き方と同じ●○の並びの行**を探し、**その行の右端の「キーワード」の欄**を読んで教えてほしいと頼む。**紙の見出しは「キーワード」なので、発話でも「キーワード」と呼ぶ**(「単語」「英単語」とは言わない。探す欄の名前が合わなくなる)\n\n報告に出てこなかった色は消えているものとして扱ってよい (必要なら、ほかのランプは消えているかを確かめる)。**キーワードをプレイヤーより先に発話に入れない** — 表を引くのはプレイヤーの仕事。読めたキーワードを報告させ、合っているかを照合して認める。\n\n**キーワードが報告されたら、まずダイヤルを合わせる操作だけを指示する**(基準カラー表はまだ言わない。1発話に詰めると長くなり、動作が埋もれる)。資料番号は言い直さない(同じ紙の中で視線を移すだけ)。報告されたキーワードの**先頭の文字を実際に取り出して**、次の順で1つの発話にまとめる:\n\n1. キーワードを復唱して受ける\n2. **ダイヤルデコード表**を見て、キーワードの**先頭の文字**(報告された単語の1文字目。文字そのものを言う)の数字を探し、**その数字にダイヤルを合わせる**よう言う。「表を見て」だけで終えず、**ダイヤルを回す動作まで**言い切る\n3. 合わせたら教えてほしいと頼む\n\n**ダイヤルを合わせたと報告されたら**、次に**基準カラー表**を指示する。報告されたキーワードの**末尾の文字を実際に取り出し**(文字そのものを言う)、基準カラー表で引いて、その色の線を切るよう言う。ダイヤルが合ったまま切ることも添える。\n\n**聞き直されたら、そのときの段の文字をその都度言って案内する**(どの表の、どの文字を探すのかを、文字を挙げて言う)。表の見方 (ダイヤルデコード表は文字の範囲と数字が並んでいる、基準カラー表は文字と色が並んでいる) も添えてよい。**引いた結果の数字と色は、プレイヤーが報告するまで言わない**。ただし引けずに詰まっていたら、ダイヤル位置${rotary}は伝えてよい。\n\n**ダイヤルを合わせてから切る**ことを忘れさせない。位置が合っていないと正しい線でも切れない。\n\n**切る線の色名はプレイヤーより先に発話に入れない**。プレイヤーに判断させ、報告された色を照合して認める。"

# 2段に分ける (決定174)。キーワードが報告されたら**ダイヤルの操作だけ**、
# ダイヤルを合わせたと報告されたら基準カラー表。1発話に詰めると長くなり、
# 「ダイヤルデコード表を見て」だけで終わって動作が伝わらなかった。
# procedure の中段では落ちるので must_say へ出す (N-51)。例の文字は置かない (写される)
must_say = "**プレイヤーからキーワードを聞いたら**、同じ発話で次を言う: (1) **ダイヤルデコード表**で、キーワードの**先頭の文字**を探し、その数字に**ダイヤルを合わせる**(見るだけでなく回す動作まで言い切る) (2) 合わせたら教えてほしい。**基準カラー表はまだ言わない**。**先頭の文字は、報告された単語から実際に取り出して文字そのものを言う**(「先頭の文字」とだけ言うと、どれを探すのか分からない)。**ダイヤルを合わせたと聞いたら**、同じ発話で次を言う: **基準カラー表**でキーワードの**末尾の文字**(文字そのものを言う)を探し、出た色の線を切る。聞き直されたときも、そのときの段の表の名前と文字を挙げて案内する。まだキーワードを聞いていない間は言わない"
