# 202. 運命の二択 (docs/puzzle_stage_ideas.md §2.2)
# 「どの色が点滅している?」で分岐する紙資料ステージ。
#
# 記号の数・数字の合計は紙資料の印刷内容で固定のため、サーバー設定
# (config.toml の [mission_sheet]) に登録した値をテンプレートが参照し、閾値と
# 比較方向を調整して正解を cut に一致させる (docs/puzzle_stage_ideas.md §7)。
# 例: 記号28個のシートに「30以上なら青、未満なら白」→ 正解は白。

id = "202"
name = "運命の二択"
difficulty = "normal"

# **切る線の色名は L4 (直言) でも伏せる** (ADR N-38)。
# 色名を言うとシートを集計して判断する工程が消え、この課題が成立しなくなる。
keep_cut_secret = true

[random]
cut = { pick = "line" }
other = { pick = "color", exclude = ["${cut}"] }
# 分岐の種類: symbol(記号を数える) / number(数字を合計する) / fate(運命の赤い糸)
branch = { pick = "choice", candidates = ["symbol", "number"] }
# 閾値はシート実測値から自動で決める (正解が ${cut} 側に来るよう解決される)
threshold = { derive = "sheet_threshold", branch = "${branch}" }
# 閾値との比較方向 ("ge" = 以上なら ${cut}、"lt" = 未満なら ${cut})
direction = { derive = "sheet_direction", branch = "${branch}" }
# 分岐に対応する資料の呼称 (記号 = 資料2 / 数字 = 資料3)。
# 「手元の資料2を見ろ」と一言で指示できるようにするため
# (docs/printed_materials.md §1.3)。呼称は config.toml の
# [mission_sheet.documents] から引く。
section = { derive = "sheet_section", branch = "${branch}" }
# 分岐の入口になる点滅色
signal = { pick = "color" }

[core]
leds = { "${signal}" = "blink" }
led_blink_ms = 500
cut = "${cut}"

[navigator]
briefing = "手元の紙資料を使った二択。点滅している色によって数える対象が変わり、その集計結果を閾値と比べて切る線を決める。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "点滅しているランプの色を報告できたか"
# 文面は「照合の材料」として書く (208 と同じ方針)。「正解は${cut}色の線」と
# 結論を書くと、なぞられて L3 で「未満だから緑を切れ」と言い切ってしまう
# (シミュレーションで発生)。**結論を出すのはプレイヤー**。
answer = "点滅しているのは${signal}色。手元の**${section}**(${branch})を集計し、閾値${threshold}と比較する。閾値を下回れば${cut}色、上回れば${other}色という対応で、今回は下回るため${cut}色が正解。**この判断はプレイヤーにさせること** — ${cut}色という色名は報告と照合するために使い、こちらからは言わない。"
# **どこを見るかは資料番号で一言で指す**。紙資料は独立した資料ごとに
# 番号が振ってあり (記号 = 資料2 / 数字 = 資料3。docs/printed_materials.md §1.3)、
# 「手元の資料2を見ろ」で足りる。「記号のほうを数えてください」と
# 説明的に言うと発話が伸び、無線越しではどこを見るのかも伝わりにくい。
# **面 (表裏) は言わない** — 探すのも体験のうちで、刷り直しにも強い。
procedure = "まず『ランプはどうなっている?』と尋ね、点滅している色を報告させる。報告を受けたら**「手元の${section}を見ろ」**と資料番号で指示し、そこを集計させる。結果を報告させ、閾値との比較の**しかた**を伝えて**どちらの色になるかはプレイヤーに判断させる**(「28個だな。閾値は49だ、下回っているならどっちの色だ?」)。**こちらから色名を言わない** — 報告された色を照合して認める。数えるのに時間がかかるため、途中経過を聞いて励ます。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、点滅している色を報告させる。報告を受けたら**「手元の${section}」**と資料番号を伝え、そこに何が並んでいるか(記号か数字か)も続けて添える(資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**"
hint_l2 = "**「手元の${section}を見ろ」**と資料番号で指示し、そこを集計させる"
# 比較の**方法**は伝えるが、**結論はプレイヤーに出させる**。
# このステージの謎は「集計して閾値と比べる」ことなので、
# 「未満だから緑を切れ」と結論まで言うと最後の一手が消える
# (シミュレーションで発生)。
hint_l3 = "集計結果と閾値の比較方法を伝え、どちらの色になるかを**プレイヤーに判断させる**。切る線の色名はこちらから言わないこと。報告された色が正しいかを照合して認める形にする"
