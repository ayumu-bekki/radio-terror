# 304. 我慢比べ (docs/puzzle_stage_ideas.md §2.3)
#
# ボタンを押し続けたまま、タイマーの秒の一の位が指定の数字になった瞬間に切る。
# **保持しながら待つ**という2つの制約が同時にかかる。
#
# 208 ジャストカット (タイミングのみ) と 102 ホールド&カット (保持のみ) を
# 組み合わせた形。片手がふさがった状態でニッパーを構え続ける必要があり、
# 待っている間の緊張が長く続く。
#
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒 (§5)。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "304"
name = "我慢比べ"
difficulty = "hard"

[random]
cut = { pick = "line" }
# 押さえ続けるボタン。切る線とは別の色にする
hold = { pick = "color", exclude = ["${cut}"] }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on", "${hold}" = "blink" }
led_blink_ms = 500
cut = "${cut}"
# push 保持 と timer_digit の同時成立が条件 (全てAND。§5)
precondition = { push = [
  "${hold}",
], timer_digit = { digit = "ones", value = "${digit}" } }

[navigator]
briefing = "**まずランプの状態を確認する。** そのうえで、指定のボタンを押さえたまま、カウントダウンの秒の一の位が指定の数字になった瞬間に線を切る。押さえながらタイミングを待つ必要がある。"
# 押さえるボタンの色は言ってよいが、切る線の色は「照合の材料」として書く
# (208/301 と同じ方針)。「${cut}色の線を切ること」とだけ書くと、なぞられて
# 第一声から色名が漏れる (アオサギのシミュレーションで発生)。
answer = "**手順の順序は「ランプを報告させる → 押さえさせる → タイミングを待たせる」**。押す指示を第一声に置かない(ADR N-10)。\n\n正解は${hold}色のボタンを押さえた状態で、タイマーの秒の一の位が${digit}のときに、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するためだけに使い、プレイヤーより先に発話に入れない(押さえるボタンの${hold}色は言ってよい)。判定窓は約2秒。"
# **1発話に1つずつ**。押さえる・待つ・切るの3要素を1度に言うと
# 60文字を超える (アオサギで74文字になった)。手順を分けて往復させる。
procedure = "**1回の発話で伝える量は少なくし**、返答を待ってから次へ進む。\n\n**(0) 最初は必ず『ランプはどうなっている?』と尋ね、状態を報告させる**(ADR N-10)。押す指示はそのあと。**第一声で押させてはいけない** — 装置を見る前に操作させると、何を見ているのか分からないまま手が動く(実測で、ランプの状態を尋ねる前にボタンを押さえさせた)。\n\n(1) 点滅と点灯がある、という報告を受けたら、次を**必ず両方**伝える:\n\n- **${hold}色(点滅しているほう)のボタンを押さえたまま、タイミングを待って線を切る**こと(**押さえたまま切る、と動作でつなげて言う**。ADR N-48)\n- **タイマーの数字にも意味がある**こと\n\n**押さえることを落とさない。** タイマーの話だけで返すと、プレイヤーは何を押さえるのか分からず手が止まる(実測3回中1回で押下に一切触れなかった)。字数を超えてもよい(ADR N-22)。\n\n(2) 押さえたら、**カウントダウンの秒の一の位が${digit}になった瞬間に、光っているランプと同じ色の線を切る**と、**必ず切る動作まで言い切る**。**数字を告げて見ていろ・狙え・待てで止め、切る動作を言わない形はいけない** — 見ているだけでは何をするのか分からず、押さえたまま待ち続けて時間切れになる(ADR N-48。実測で切る動作を落とした)。**聞き返されたときも、数字を言うなら切る動作まで同じ発話で言う**。**桁は「カウントダウンの秒の一の位」と言う** (決定155)。場所で言う「小数点のすぐ左の数字」は、**プレイヤーがどの数字か分からないときにだけ**補う (表示は123.4の形式で、一の位は小数点のすぐ左)。最初から場所で言うと、何の数字なのかが伝わりにくい。\n\n無線にタイムラグがあるため、ナビゲーターから**リアルタイムに切る合図を出してはいけない**。タイミングはプレイヤー自身で狙わせる。ボタンから指が離れると失敗するので注意を促す。\n\n**切る線の色名はプレイヤーより先に発話に入れない**。点灯しているランプは1つだけなので、光っているランプと同じ色の線と言えば伝わる。"
