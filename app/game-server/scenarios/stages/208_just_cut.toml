# 208. ジャストカット (docs/puzzle_stage_ideas.md §2.2)
# 「タイマーの秒の一の位がNのときに○色の線を切る」。
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒。窓を外したら即爆発。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "208"
name = "ジャストカット"
# **ノーマル** (2026-08-24 に hard から変更)。
# 「一の位が指定の数字になった瞬間に切る」だけで、**観察も推理も無い**。
# 点灯は1色。303 追いかけダイヤル (ダイヤル追従) や 304 我慢比べ (押しながら)
# と違い条件が単発で、ハードで最も軽かった。
difficulty = "normal"

[random]
cut = { pick = "line" }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { timer_digit = { digit = "ones", value = "${digit}" } }

[navigator]
briefing = "カウントダウン表示の秒の一の位が指定の数字になった瞬間に線を切る。タイミングを外すと即座に失敗する。"
# 切る線の色は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて L1 から色名が漏れる。
answer = "正解はタイマーの秒の一の位が${digit}のときに、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するためだけに使い、プレイヤーより先に発話に入れない。判定窓は約2秒。"
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**第一声はここまで** — タイマーの話は入れない(名乗り + 安心の一言 + 質問で既に長い)。\n\n報告を受けたら、**次の発話で (1) カウントダウンの秒の一の位が${digit}になった瞬間 (2) 光っているランプと同じ色の線 (3) 切る、の3つを1つの文でひと続きに伝える**(言い回しはキャラシートの口調で組み立てる。ここに例文は置かない。ADR N-52)。**桁は「カウントダウンの秒の一の位」と言う** (決定155)。場所で言う「小数点のすぐ左の数字」は、**プレイヤーがどの数字か分からないときにだけ**補う (表示は123.4の形式で、一の位は小数点のすぐ左)。最初から場所で言うと、何の数字なのかが伝わりにくい。\n\n**タイミングだけを伝えて終えない。** タイミングだけでは**何をすればいいのかが伝わらない**(何を待つのか、切るのかどうか、どの線かが分からない)。**聞き返されたとき・桁を聞かれたときも、切る動作まで含めて言い直す**。\n\n無線に数秒のタイムラグがあるため、ナビゲーターから**リアルタイムに切る合図を出してはいけない**。条件を事前に伝え、プレイヤー自身にタイミングを計らせる。合図を求められたら、出せないので自分のタイミングで切るよう伝える。\n\n**切る線の色名はプレイヤーより先に発話に入れない**。点灯しているランプは1つだけなので、光っているランプと同じ色の線と言えば伝わる。"
