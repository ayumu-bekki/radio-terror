# 208. ジャストカット (docs/puzzle_stage_ideas.md §2.2)
# 「タイマーの秒の一の位がNのときに○色の線を切る」。
# 判定窓は「一の位がNの1秒間 + 直後1秒の猶予」の計約2秒。窓を外したら即爆発。
# Nは1〜9から抽選する (0は残り時間僅少と紛らわしいため除外)。

id = "208"
name = "ジャストカット"
# **ノーマル** (2026-08-24 に hard から変更)。
# 「一の位が指定の数字になった瞬間に切る」だけで、**観察も推理も無い**。
# 点灯は1色。303 追いかけダイヤル (ダイヤル追従) や 304 我慢比べ (押しながら)
# と違い条件が単発で、ハードで最も軽かった。
difficulty = "normal"

[random]
cut = { pick = "line" }
digit = { pick = "int", min = 1, max = 9 }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { timer_digit = { digit = "ones", value = "${digit}" } }

[navigator]
briefing = "カウントダウン表示の秒の一の位が指定の数字になった瞬間に線を切る。タイミングを外すと即座に失敗する。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "ランプが1つだけ点灯していることを報告できたか。色名まで言えていればなおよい"
# 切る線の色は「照合の材料」として書く (208 と同じ方針)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて L1 から色名が漏れる。
answer = "正解はタイマーの秒の一の位が${digit}のときに、点灯しているランプと同じ色の線を切ること。点灯しているのは${cut}色だけなので「光っているランプと同じ色」で一意に決まる。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。判定窓は約2秒。"
procedure = "表示は「123.4」形式なので、「小数点のすぐ左の数字」という言い方で桁を明確にする。無線に数秒のタイムラグがあるため、ナビゲーターから「今だ」とリアルタイムに指示してはいけない。事前に**「小数点の左の数字が${digit}になった瞬間」**という条件を伝え、プレイヤー自身にタイミングを計らせる。\n\n**タイミングだけを伝えて終えない。** 「◯になった瞬間を狙え」とだけ言うと、**何をすればいいのかが伝わらない**(狙って何をするのか、切るのかどうか、どの線かが分からない)。**必ず1つの発話で「タイミング」+「対象」+「切る」までひと続きに言い切る**: 『小数点の左の数字が${digit}になった瞬間、光っているランプと同じ色の線を切ってください』のように。**「狙う」だけで止めない** — 狙った先に何をするかまで言わないと、プレイヤーは何を待てばいいのか分からず聞き返す。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**第一声はここまで** — タイマーの話は入れない(名乗り + 安心の一言 + 質問で既に長い)。\n\n報告を受けたら、**次の発話で「タイミング」+「対象」+「切る」を1つの文でひと続きに伝える**: 『小数点の左の数字が${digit}になった瞬間、光っているランプと同じ色の線を切ってください』。**「◯になった瞬間を狙え」とだけ言って切る指示を省略しない** — タイミングだけでは何をすればいいか伝わらず、聞き返しが発生する。切る線の色名はこちらから言わず、プレイヤーに報告させること"
hint_l2 = "小数点のすぐ左の数字(秒の一の位)が手がかりだと伝える。**ここでも「その数字になった瞬間に、光っているランプと同じ色の線を切る」と、切る動作まで含めて言う** — タイミングの説明だけで終えない"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると読み落とされる。
hint_l3 = "「小数点の左の数字が${digit}になった瞬間に、光っているランプと同じ色の線を切る」と、タイミングと動作をひと続きで手順を教えてよい。切る線の色名は言わないこと。点灯しているランプは1つだけなので、『光っているランプと同じ色の線』と言えば伝わる"
