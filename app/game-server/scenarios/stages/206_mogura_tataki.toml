# 206. モグラ叩き (docs/puzzle_stage_ideas.md §2.2)
# 「モグラを8匹叩け。最後に押した色の線を切れ」。
# 最後の1匹は cut と同色に固定される (last_mole_matches_cut)。
# プレイヤーには見分けがつかず、サーバーは正解線を既知のまま保てる。

id = "206"
name = "モグラ叩き"
difficulty = "normal"

[random]
cut = { pick = "line" }
count = { pick = "int", min = 6, max = 9 }

[core]
# whack完了までkLEDはモグラ表示に専有され、完了後にこのヒント表示へ切り替わる
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { whack = { count = "${count}", mole_on_ms = 1500, gap_ms = 400, last_mole_matches_cut = true } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "ランプが1つずつ光るので、光った色と同じボタンを素早く押す。規定の数を叩き終えたら、最後に押した色の線を切る。"
answer = "正解は${cut}色の線。モグラ叩きの最後の1匹が必ず${cut}色になるため、「最後に押した色」がそのまま答えになる。叩く数は${count}匹。"
procedure = "叩いている最中は実況で盛り上げる。完了通知が届いたら「最後に押した色を覚えているか」を確認する。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。ランプが次々光ると分かったら、光った色と同じボタンを押すゲームだと伝え、最後に押した色を覚えておくよう促す"
hint_l2 = "叩き終わったら、最後に押した色が次の手がかりになることを伝える"
hint_l3 = "「最後に押した色の線を切る」と手順を教えてよい(色名は言わない)"
