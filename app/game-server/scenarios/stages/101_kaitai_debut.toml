# 101. 解体デビュー (docs/puzzle_stage_ideas.md §2.1)
# ナビゲーターが会話でロータリーを誘導するチュートリアル。
# イージー専用・先頭固定。
#
# **禁止位置は置かない**。このステージの目的は「無線で報告し、指示を受けて
# 操作する」交信の型を覚えることで、罠を仕込むと最初の一手で失敗して
# 萎縮させる。禁止位置の緊張感は 209 綱渡り (即爆発) が担う。

id = "101"
name = "解体デビュー"
difficulty = "easy"
easy_only = true # ノーマル・ハードでは選出しない

[random]
cut = { pick = "line" }
# 誘導する手順の最終位置。
# **0 は除く** — 手順が「0に戻す → 経由 → 0」となり、出発点へ戻るだけの
# 往復になってしまう (抽選の15%で発生していた)。
final_rotary = { pick = "int", min = 1, max = 5 }
# 途中経路は**1つだけ**。固定値だと毎回同じ手順になり繰り返しで単調になるため
# 抽選するが、経由を増やしてもチュートリアルとしての学びは変わらず、
# 無線の往復が伸びるだけだった (実プレイで 0→3→5→2 の4手順に約3分かかった)。
# 「0に戻す → 経由 → 最終位置」の3手順で交信の型は十分伝わる。
via1 = { pick = "int", min = 1, max = 5, exclude = ["${final_rotary}"] }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { rotary = "${final_rotary}" }

[navigator]
briefing = "解体の基本手順を確認する。ダイヤル(ロータリースイッチ)を指示どおりに合わせてから、光っているランプと同じ色の線を切る。点灯しているランプは1つだけなので、色名を言わなくても『光っているランプと同じ色』で一意に決まる。"
answer = "正解はダイヤルを${final_rotary}に合わせた状態で${cut}色の線を切ること。${cut}色のランプだけが点灯している。"
# 会話でロータリーを誘導する。初期位置が不定でも「まず0に戻す」で解決する。
#
# **やることは最初にまとめて伝える** —「ダイヤルを合わせてから、光っている
# ランプと同じ色の線を切る」。ゴールを先に示しておけば、プレイヤーは
# ダイヤル操作中に自分でランプを見て準備でき、最後の1往復が要らなくなる。
#
# 切る線は**色名を言わずに「光っているランプと同じ色」**と指示する。
# 点灯しているのは正解の色だけなので、この言い方で一意に決まる。
# ナビゲーターが色名を言うとプレイヤーは装置を見ずに従うだけになり、
# 交信の練習にならない (このステージは「装置を見て操作する」型を覚えるため)。
# 逆に、わざわざ色を報告させてから復唱して指示し直すのは**冗長**だった
# (実プレイで確認)。プレイヤーが自分から色を報告してきたら復唱して認める。
procedure = "ダイヤルは **0 → ${via1} → ${final_rotary}** の順に合わせさせる。**毎回どこへ合わせるかを数字で言うこと**(「まずダイヤルを0に」「次は${via1}」「最後に${final_rotary}」のように毎回数字を言う)。各手順はプレイヤーの返答を待ってから次へ進む。最後に切る線の話をするので、ゴール(『合わせ終わったら光っているランプと同じ色の線を切る』)は最初に一言添えておくとよいが、**数字の指示より優先してはいけない**。発話は短いので、ゴールの説明で数字が押し出されるくらいなら数字だけ言う。ダイヤルが合ったら切る線を**「光っているランプと同じ色の線」**という言い方で指示する。**色名はこちらから言わない**(プレイヤーが色を報告してきたら復唱して認めてよい)。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**この第一声ではダイヤルの指示をしない**。報告を受けたら、次の発話からダイヤルの誘導に入る。**そのときは必ず具体的な数字で指示する**(「まずダイヤルを0に」)。合わせる位置は毎回数字で言うこと。ゴール(光っているランプと同じ色の線を切る)は一言添える程度でよく、数字の指示を省いてはいけない"
hint_l2 = "手順を1つずつ区切って伝え、そのつど返答を待つ。ダイヤルはどこで止めても危険はないので、安心して操作してよいと伝える"
hint_l3 = "最終的にダイヤルを合わせる位置(${final_rotary})を伝えてよい。切る線は『光っているランプと同じ色の線』と伝える。色名を自分から言ってはいけない"
