# 101. 解体デビュー (docs/puzzle_stage_ideas.md §2.1)
# ナビゲーターが会話でロータリーを誘導するチュートリアル。
# イージー専用・先頭固定。
#
# **禁止位置は置かない**。このステージの目的は「無線で報告し、指示を受けて
# 操作する」交信の型を覚えることで、罠を仕込むと最初の一手で失敗して
# 萎縮させる。禁止位置の緊張感は 209 綱渡り (即爆発) が担う。

id = "101"
name = "解体デビュー"
difficulty = "easy"
easy_only = true # ノーマル・ハードでは選出しない

[random]
cut = { pick = "line" }
# 誘導する手順の最終位置
final_rotary = { pick = "int", min = 0, max = 5 }
# 途中経路。固定値だと毎回同じ手順になり、繰り返し遊ぶと単調になる。
# 最終位置と重ならないよう外し、via1 と via2 も別の位置にする。
via1 = { pick = "int", min = 1, max = 5, exclude = ["${final_rotary}"] }
via2 = { pick = "int", min = 1, max = 5, exclude = [
  "${final_rotary}",
  "${via1}",
] }

[core]
leds = { "${cut}" = "on" }
cut = "${cut}"
precondition = { rotary = "${final_rotary}" }
# チュートリアルなので誤切断も即失敗にはしない
on_wrong_cut = { action = "penalty", penalty_ms = 30000 }

[navigator]
briefing = "解体の基本手順を確認する。ダイヤル(ロータリースイッチ)を指示どおりに合わせてから、光っているランプと同じ色の線を切る。"
answer = "正解はダイヤルを${final_rotary}に合わせた状態で${cut}色の線を切ること。${cut}色のランプだけが点灯している。"
# 会話でロータリーを誘導する。初期位置が不定でも「まず0に戻す」で解決する。
#
# 切る線は**プレイヤーに色を報告させてから**指示する。ナビゲーターが先に
# 色名を言うと、プレイヤーは装置を見ずに従うだけになり、交信の練習にならない
# (このステージは「報告 → 指示」の型を体に入れるためのチュートリアル)。
procedure = "まず0に戻させ、次に${via1}まで回させ、${via2}に合わせさせ、最後に${final_rotary}に合わせさせる。中間手順の確認はプレイヤーの返答で行う。最終位置が0の場合は途中で戻ってくる形になるので、そのまま最後まで誘導してよい。ダイヤルが合ったら『光っているランプは何色か』を尋ね、プレイヤーが色を答えたら復唱し、『その色の線を切れ』と指示する。**色名はプレイヤーに先に言わせること**。"
hint_l1 = "装置の正面にあるダイヤルに注目させ、まず0に戻すよう指示する"
hint_l2 = "手順を1つずつ区切って伝え、そのつど返答を待つ。ダイヤルはどこで止めても危険はないので、安心して操作してよいと伝える"
hint_l3 = "最終的にダイヤルを合わせる位置を伝えてよい。切る線は『光っているランプと同じ色の線』と伝える。プレイヤーがまだ色を報告していなければ、まず何色が光っているかを尋ねる。色名を自分から言ってはいけない"
