# 205. ブループリント (docs/puzzle_stage_ideas.md §2.2)
# Coreの隣に置いた「整備マニュアル風の回路図シート」を使う。
# ナビゲーターは色を言わず「端子T4の線を切ってください」とだけ指示する。
#
# 端子番号(T1-T5) ⇔ 配線色 の対応はシートに印刷された固定内容のため、
# サーバー設定 (config.toml の [mission_sheet].terminal_map) を参照して
# cut から端子番号を導出する。
#
# **全5色を点灯させる**のは、このステージだけの識別用パターン。
# 他のステージは「1色点灯」「2色点滅」「モールス」など部分的な表示しか使わず、
# 全灯はここでしか出ない。プレイヤーが「全部光っています」と報告し、
# ナビゲーターがそれを聞いて「回路図参照の合図だ」と応じることで、
# **報告 → 指示** の往復が成立する。
#
# 全灯は色のヒントを一切含まない (5色すべてが同じ表示) ため、
# 「シートだけが手がかり」という 205 の原則は保たれる。難度は変わらない。

id = "205"
name = "ブループリント"
difficulty = "normal"

[random]
cut = { pick = "line" }
# 切る線の色から、シート上の端子番号を引く
terminal = { derive = "terminal_for_color", from = "${cut}" }

[core]
# 全5色を点灯させる = このステージだけの識別用パターン。
# 色のヒントにはならない (どの色も同じ表示) ため、謎の難度は変わらない。
leds = { "A" = "on", "B" = "on", "C" = "on", "D" = "on", "E" = "on" }
cut = "${cut}"
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "5つのランプが全て点灯している状態は、回路図シートを参照せよという合図。Coreの隣にある回路図シートに端子番号(T1〜T5)と配線色の対応が描かれており、ナビゲーターは端子番号だけを指示し、色は言わない。"
answer = "正解は端子${terminal}の線 = ${cut}色。ただしプレイヤーには端子番号だけを伝え、色は最後まで言わない。ランプは5色すべてが点灯している(色のヒントではなく、回路図参照を示す合図)。"
# まずランプの状態を報告させる。全灯はこのステージにしか出ない表示なので、
# 「全部光っている」という報告を受けてから端子番号を出す流れが成立する。
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『全部光っている』という報告を受けたら『全灯確認。それは回路図参照の合図だ』と応じ、手元の回路図シートを見るよう促す。そのうえで「端子${terminal}の線を切ってください」と端子番号で指示する。プレイヤーが色を復唱してきたら、シートで確認できたかだけを確認し、色名はこちらから言わない。"
hint_l1 = "ランプの状態を報告させ、全灯が回路図参照の合図であることを伝える。手元の回路図シートを見るよう促す"
hint_l2 = "端子番号${terminal}を伝え、シート上で端子番号と配線色の対応表を探すよう促す"
hint_l3 = "対応表の読み方を具体的に説明してよい(ただし色名は最後まで言わない)"
