# 205. ブループリント (docs/puzzle_stage_ideas.md §2.2)
# 手元の紙資料にある「整備マニュアル風の回路図」(資料4) を使う。
# 資料の呼称は config.toml の [mission_sheet.documents] から引く
# (${sheet_circuit})。
# ナビゲーターは色を言わず「端子T4の線を切ってください」とだけ指示する。
#
# 端子番号(T1-T5) ⇔ 配線色 の対応はシートに印刷された固定内容のため、
# 端子は**2系統ある** (X1-X5 / Y1-Y5)。プレイヤーは Core 外装のシリアル銘板の
# 下1桁を見て、奇数なら X系統、偶数なら Y系統を使う (ADR D-6)。
# ナビゲーターは**両方の端子番号を並べて**伝え、どちらを使うかはプレイヤーが選ぶ。
# **サーバーは個体のシリアルを知らない** — だからこそ両方を渡す。
#
# サーバー設定 (config.toml の [mission_sheet.terminal_map_x / _y]) を参照して
# cut から両系統の端子番号を導出する。
#
# **全5色を点灯させる**のは、このステージだけの識別用パターン。
# 他のステージは「1色点灯」「2色点滅」「モールス」など部分的な表示しか使わず、
# 全灯はここでしか出ない。プレイヤーが「全部光っています」と報告し、
# ナビゲーターがそれを聞いて「回路図参照の合図だ」と応じることで、
# **報告 → 指示** の往復が成立する。
#
# 全灯は色のヒントを一切含まない (5色すべてが同じ表示) ため、
# 「シートだけが手がかり」という 205 の原則は保たれる。難度は変わらない。

id = "205"
name = "ブループリント"
difficulty = "normal"

# **切る線の色名は L4 (直言) でも伏せる** (ADR N-38)。
# 色名を言うと回路図を読む工程が消え、この課題が成立しなくなる。
keep_cut_secret = true

[random]
cut = { pick = "line" }
# 切る線の色から、両系統の端子番号を引く。
# **どちらか一方だけを渡さない** — サーバーは個体のシリアルを知らないため、
# 系統の選択はプレイヤーに委ねる (ADR D-6)。
terminal_x = { derive = "terminal_for_color", from = "${cut}", series = "x" }
terminal_y = { derive = "terminal_for_color", from = "${cut}", series = "y" }

[core]
# 全5色を点灯させる = このステージだけの識別用パターン。
# 色のヒントにはならない (どの色も同じ表示) ため、謎の難度は変わらない。
leds = { "A" = "on", "B" = "on", "C" = "on", "D" = "on", "E" = "on" }
cut = "${cut}"

[navigator]
briefing = "5つのランプが全て点灯している状態は、手元の${sheet_circuit}(回路図)を参照せよという合図。${sheet_circuit}には**2系統の端子**(X1〜X5 / Y1〜Y5)と配線色の対応が描かれている。どちらの系統を使うかは**Core外装のシリアル銘板の下1桁**で決まり(奇数=X / 偶数=Y)、ナビゲーターは両系統の端子番号を並べて伝える。色は言わない。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**5つのランプが全て点灯している**ことを報告できたか。『全部光っている』『全灯』など言い回しは問わない"
answer = "正解は${cut}色の線。${sheet_circuit}では**X系統なら${terminal_x}、Y系統なら${terminal_y}**にあたる。**プレイヤーに伝えてよいのは端子番号(${terminal_x}と${terminal_y})だけ**で、${cut}色という色名は L4 であっても最後まで口に出さない(色を言うと資料を読む工程が消え、このステージが成立しなくなる)。色名は、プレイヤーの報告が合っているかを照合するためだけに使う。**どちらの系統かはこちらで決めない** — サーバーは個体のシリアルを知らないため、必ず両方を並べて伝え、選ぶのはプレイヤーに任せる。ランプは5色すべてが点灯している(色のヒントではなく、回路図参照を示す合図)。"
# まずランプの状態を報告させる。全灯はこのステージにしか出ない表示なので、
# 「全部光っている」という報告を受けてから端子番号を出す流れが成立する。
procedure = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。『全部光っている』という報告を受けたら『全灯確認。それは回路図を見ろという合図だ』と応じ、**「手元の${sheet_circuit}に回路図がある」**と資料番号と中身を続けて伝える(どの資料に何が載っているかは装置を見ても分からない情報なので出し惜しみしない)。**面 (表裏) は言わない**。そのうえで**「シリアル銘板の下1桁が奇数なら${terminal_x}、偶数なら${terminal_y}の線を切れ」**と**両系統を並べて**指示する。**どちらかに絞って言わない** — 銘板を見て選ぶのはプレイヤーの仕事。プレイヤーが色を復唱してきたら、${sheet_circuit}で確認できたかだけを確認し、色名はこちらから言わない。"
hint_l1 = "ランプの状態を報告させ、全灯が回路図を見ろという合図であることを伝える。**「手元の${sheet_circuit}に回路図がある」**と資料番号と中身を続けて伝える"
hint_l2 = "**「奇数なら${terminal_x}、偶数なら${terminal_y}」**と両系統の端子番号を伝え、シリアル銘板の下1桁で選ぶこと・${sheet_circuit}で端子番号と配線色の対応を探すことを促す"
hint_l3 = "系統の選び方(シリアル銘板の下1桁。奇数=X / 偶数=Y)と対応の読み方を具体的に説明してよい。**ただし色名は最後まで言わず、系統もこちらで決めない**"
