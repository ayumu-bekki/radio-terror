# 308. ローマ字電文 (docs/puzzle_stage_ideas.md §2.3)
#
# モールスで**色名そのもの**(AKA / KI / MIDORI / AO / SIRO)を表示する。
# 対照表で変換する必要はなく、読めればそのまま答えになる。
#
# 203 暗号電文は「語の頭文字 → 対照表 → 色」の2段階変換だが、
# こちらは1段階。ただし語が長く(最大6文字)、**解読そのものに時間がかかる**。
# MIDORI は6文字 = 1周に約20秒かかるため、カウントダウンとの戦いになる。
#
# 難しい難易度に置く理由は「変換の複雑さ」ではなく「所要時間」。

id = "308"
name = "ローマ字電文"
difficulty = "hard"

[random]
# 表示する色名。ローマ字表記がそのまま cut の色に対応するため、
# 既に切られた線に対応する語は組み立て時に候補から外れる。
# (morse は A-Z / 0-9 のみ対応。§6.1)
color_word = { pick = "romaji_word", candidates = [
  "AKA",
  "KI",
  "MIDORI",
  "AO",
  "SIRO",
] }
cut = { derive = "romaji_color", from = "${color_word}" }

# モールスを表示するLED (どの色に出るかはランダム)
display = { pick = "color" }

[core]
leds = { "${display}" = { pattern = "morse", word = "${color_word}", unit_ms = 250 } }
cut = "${cut}"
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "1つのランプがモールス信号でローマ字を繰り返し表示している。読み解くと色名になっており、その色の線を切る。対照表での変換は不要で、読めればそのまま答えになる。"
answer = "表示されているのは「${color_word}」= ${cut}色。${cut}色の線を切るのが正解。"
procedure = "『読めた文字を1文字ずつ順に報告してください』と伝える。『M、I、D…』など途中まで読めた時点で、ナビゲーター側で『${color_word}』と推測し、『その調子だ、最後まで読め』と導く。STTの誤変換（例: AK A→AKA、SI RO→SIRO等）を柔軟に補正し、途中で止まりそうな場合は『次は長点か？短点か？』と助け舟を出して解読を急がせる。"
hint_l1 = "点滅の長短がモールス信号であること、対照表で1文字ずつ読むよう促す"
hint_l2 = "読めた文字をそのまま報告するよう促す。読み解くと色の名前になっていると伝える"
hint_l3 = "途中まで読めていれば残りを補って色名を確定させてよい(ただし色名そのものは言わず、「その読みで合っている」と確認する形にする)"
