# 104. コール&レスポンス (docs/puzzle_stage_ideas.md §2.1)
# ナビゲーターとプレイヤーの対話で進める。正しい押下のたびに push_progress が届くため、
# ナビゲーターは実際の操作に反応できる (「今ので合ってる!」)。

id = "104"
name = "コール&レスポンス"
difficulty = "easy"

[random]
cut = { pick = "line" }
# 最初に報告させる点灯色は**切る線と別の色にする**。
# 同色だと leds が1エントリに潰れ (点灯が点滅で上書きされる)、
# 「点灯している色を報告 → 最後に点滅している色を切る」という
# このステージの対話が成立しなくなる。
lit = { pick = "color", exclude = ["${cut}"] }
# **押下色からも ${cut} を外す**。ボタンの色名はこちらから指示する仕様なので、
# 押下色に正解色が混ざると「次は赤色のボタンを押せ」で正解色を音として出し、
# 最後の「点滅している色の線を切れ」と繋がった瞬間に答えが割れる
# (シミュレーションで発生。102/201/305 と同じ構造)。
p1 = { pick = "color", exclude = ["${cut}"] }
p2 = { pick = "color", exclude = ["${cut}"] }

[core]
# 最初に点灯しているLEDと、最後に切る線のLEDを光らせる
leds = { "${lit}" = "on", "${cut}" = "blink" }
led_blink_ms = 700
cut = "${cut}"
precondition = { push_seq = { entries = [
  { push = "${p1}" },
  { push = "${p2}" },
], on_wrong_press = { action = "retry" } } }
on_wrong_cut = { action = "explode" }

[navigator]
briefing = "プレイヤーに点灯しているランプの色を報告させ、それに応じてボタンを押させる対話形式。最後に点滅しているランプと同じ色の線を切る。"
answer = "正解は${p1}色→${p2}色の順にボタンを押してから、点滅している${cut}色の線を切ること。点灯しているのは${lit}色。"
procedure = "まず「どのランプが点灯している?」と尋ね、報告を復唱してから「では${p1}色のボタンを押して」と指示する。押されたら反応を返し、続けて${p2}色を指示する。最後に「点滅しているランプと同じ色の線を切って」と伝える。"
hint_l1 = "点灯しているランプの色を報告させることから始める"
hint_l2 = "ボタンを1つずつ指示し、押せたことを確認しながら進める"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると読み落とされる。
hint_l3 = "最後に切る線は点滅しているランプと同じ色だと手順で伝えてよい。切る線の色名は言わないこと。点滅しているランプは1つだけなので、『点滅している色の線』と言えば伝わる"
