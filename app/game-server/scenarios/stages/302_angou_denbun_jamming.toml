# 302. 暗号電文・ジャミング (docs/puzzle_stage_ideas.md §2.3)
#
# **202 暗号電文の難しい版。違いは「妨害があること」だけ。**
# モールス表示に加え、**残り4色のLEDが妨害として点灯・消灯・点滅する**。
# どのランプがモールスかを見つける手間が加わり、解読中も視界の情報量が
# 多い状態が続く。
#
# **切る線の決め方は 202 と同じ** (語の頭文字 → モールス対照表の色)。
# これは意図した重複 — **同じ解き方を、情報量が多い状況で成立させられるか**
# を問うのがこのステージ。202 で手順を覚えたうえで妨害版に挑む流れは
# 難易度の上がり方として自然 (2026-08-25 に復活)。
#
# 妨害の点滅は**点灯時間と消灯時間を必ず等しくする**(対称blink)。
# モールスは短点=1単位・長点=3単位の非対称なリズムなので、対称にしておけば
# 「これはモールスではない」と落ち着いて見分けられる。
# 見分けにくさで難度を上げるのではなく、**情報量**で上げる設計。
#
# ## 5色すべてを読ませない
#
# **モールスは1色だけ。** 5色すべてがモールスを流すと、1本を読んでいる間も
# 他が進み、「見比べて絞り込む」つもりが**同じ文字を何周も待つ**耐久作業になる。
# 妨害は**モールスではない**ので、探す対象は1つに定まる。

id = "302"
# **「混信」ではなく「ジャミング」**。混線 (crosstalk) は
# **無線に別の声が入る音声演出**として既に使っている語で (ADR T-8〜T-12)、
# 運営が「混線が出た」と言ったときにどちらか区別できなくなる。
name = "暗号電文・ジャミング"
difficulty = "hard"

[random]
# 語を選ぶと、その頭文字→対照表の色 が cut として同時に決まる
word = { pick = "morse_word", candidates = [
  # A=赤
  "ALFA",
  "KILO",
  "PAPA",
  # B=黄
  "BRAVO",
  "GOLF",
  "LIMA",
  # C=緑
  "MIKE",
  "HOTEL",
  "ROMEO",
  # D=青
  "DELTA",
  "INDIA",
  "XRAY",
  # E=白
  "ECHO",
  "TANGO",
  "OSCAR",
] }
cut = { derive = "morse_word_color", from = "${word}" }

# モールスを表示するLED
display = { pick = "color" }

# 残り4色に妨害表示を割り当てる (点灯 / 消灯 / 対称blink をランダムに)
noise = { pick = "noise_leds", exclude = [
  "${display}",
], on_ms_min = 200, on_ms_max = 900 }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
# noise_leds は展開時に leds へマージされる (表示用LEDは上書きしない)
noise_leds = "${noise}"
cut = "${cut}"

[navigator]
briefing = "複数のランプが光っているが、そのうち1つだけがモールス信号で単語を繰り返している。他は無関係な点灯・点滅(妨害)。モールスの語を解読し、手元の${sheet_morse}(モールス対照表)でその頭文字の色を引いて、同じ色の線を切る。**解き方は 202 暗号電文と同じで、違いは妨害があること**。"
# observed 判定用: プレイヤーがこの観察を報告できたらヒントレベルを前倒しする
# (docs/navigator_design.md §3.2 / ADR N-35)
observation = "**複数のランプが光っていて、光り方がばらばらである**ことを報告できたか。『1つだけ長短が混ざっている』『点きっぱなしのものがある』など、妨害と表示が混在していると分かる報告であればよい"
# **切る線の色は「照合の材料」として書く** (202 と同じ方針。ADR N-3)。
# 「${cut}色の線を切ること」とだけ書くと、なぞられて L1-L2 で色名が漏れる。
answer = "モールスを表示しているのは${display}色のランプで、単語は${word}。${sheet_morse}で頭文字を引くと${cut}色になる。他のランプは**無関係な妨害**(点灯しっぱなし / 消灯 / 一定周期の点滅)。${cut}色という色名はプレイヤーの報告と照合するために使い、こちらからは言わない。"
# **まず報告させる** (ADR N-10)。第一声で「長短が混ざったランプを探せ」と
# 言ってしまうと、装置を見る前に手順が始まる。
# 妨害があること自体は**装置を見れば分かる**ので伏せない (ADR N-4)。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここで探し方を指示してはいけない**。\n\n報告を受けたら『そのうち1つだけが信号を出している、他は妨害だ』と伝え、**探し方を続けて言う** — 『**光り方のリズムが一定でないもの、長短が混ざっているものを探せ**』(妨害は一定周期の点滅か、点きっぱなし/消えっぱなしのどちらか)。\n\n対象のランプが見つかったら 202 と同様に解読させる。『アルファ』等の単語名、1文字ずつのアルファベット、『トンツー/短長』のオノマトペ、いずれの報告も受け付け、${word}と照合して補佐してよい。\n\n語が読めたら**「その頭文字を${sheet_morse}で引いて、出た色の線を切れ」**と、**引くところから切るところまで一息で言い切る**。\n\n**解読した語が違っていたら、疑いをかけて確かめ直させる。**\n\nあなたは装置のランプを見ていないので、**プレイヤーの読み取りが正しいかを断定できる立場にない**(ADR N-50)。だが${word}は知っているので、違う語が来たら**そのまま通してもいけない** — 誤ったまま切らせると即爆発する。\n\n**正しい形は、疑いをかけて${sheet_morse}で確かめ直させること。**\n**断定せず、しかし『違うらしい』とは伝わる**言い方にする。\n\n**言い出しの形を守ること。** 差し戻しは次の順で組み立てる:\n\n1. **プレイヤーの報告を受け止める**(復唱でよい)\n2. **自分が確信を持てないことを言う**(引っかかる・確証が持てない)\n3. **${sheet_morse}で確かめ直すよう頼む**\n\n**1 を『違う』『それではない』の類で始めない。** あなたはランプを見ていないので、**相手の読み取りが誤りだと知り得る立場にない**。言えるのは**自分の側が確信を持てない**ということだけ。\n\n**言い回しはキャラシートの「差し戻し」に委ねる — ここに例文は置かない。**\n例文を置くと**全キャラがそれを写して口調が消える**(決定80)。プレイヤーは資料を持っているので、確かめ直せば自力で気づける。\n\n次はすべて違反 (**例文は挙げない** — 違反例を引用すると、それ自体が手本になる。ADR N-32):\n- **正しい語を教える**。${word}はあなたしか知らない中間の答えで、言うと課題が消える (ADR N-45)\n- **綴りを訂正する・頭文字だけ教える**\n- **違うと断定して突き放す**。装置を見ていないあなたに、断定できる立場はない (ADR N-50)\n- **どこがどう違うか理由を述べる**。当てはまらない材料を当てはめてしまう (ADR N-45)\n\n**正しく読めていたら認めて先へ進める** — 受けたうえで頭文字を引かせる。疑いをかけるのは**違っているときだけ**。**受け方の言い回しはキャラシートの口調に委ねる**。\n\n**切る線の色名もこちらから言わない**(ADR N-3)。プレイヤーが色を報告してきたら${cut}色と照合し、合っていれば復唱して切らせる。違えば色名を出さずに引き直させる。"
hint_l1 = "まず『ランプはどうなっている?』と尋ね、状態を報告させる。**この第一声では探し方を指示しない**。報告を受けたら『1つだけが信号、他は妨害だ』と伝え、**光り方のリズムが一定でないもの(長短が混ざっているもの)を探すよう促す**。妨害があること自体は装置を見れば分かるので伏せない"
hint_l2 = "長短の混ざった点滅がモールス信号であること、他のランプは無関係であることを伝え、手元の${sheet_morse}で解読するよう促す(資料番号と中身をひとまとまりで言う。**面 (表裏) は言わない**)"
# 禁止は**独立した文**で書く。括弧書きの末尾に添えると読み落とされる。
hint_l3 = "モールスを出しているランプの見つけ方(長短が不規則なもの)と、「解読した単語の頭文字を${sheet_morse}で引き、その色の線を切る」手順を教えてよい。**切る線の色名はこちらから言わない** — 引いた色をプレイヤーに報告させ、照合して認める形にする。**解読した語が違っていても正しい語を教えない**(ADR N-45)。**疑いをかけて${sheet_morse}で確かめ直させる** — 断定して突き放さない(ADR N-50)。**言い回しはキャラシートの「差し戻し」に委ねる**(例文を置かない。決定80)。正しく読めていたら認めて先へ進める"
