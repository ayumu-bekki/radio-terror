# 302. 暗号電文・ジャミング (docs/puzzle_stage_ideas.md §2.3)
#
# **202 暗号電文の難しい版。違いは「妨害があること」だけ。**
# モールス表示に加え、**残り4色のLEDが妨害として点灯・消灯・点滅する**。
# どのランプがモールスかを見つける手間が加わり、解読中も視界の情報量が
# 多い状態が続く。
#
# **切る線の決め方は 202 と同じ** (語の頭文字 → モールス対照表の色)。
# これは意図した重複 — **同じ解き方を、情報量が多い状況で成立させられるか**
# を問うのがこのステージ。202 で手順を覚えたうえで妨害版に挑む流れは
# 難易度の上がり方として自然 (2026-08-25 に復活)。
#
# 妨害の点滅は**点灯時間と消灯時間を必ず等しくする**(対称blink)。
# モールスは短点=1単位・長点=3単位の非対称なリズムなので、対称にしておけば
# 「これはモールスではない」と落ち着いて見分けられる。
# 見分けにくさで難度を上げるのではなく、**情報量**で上げる設計。
#
# ## 5色すべてを読ませない
#
# **モールスは1色だけ。** 5色すべてがモールスを流すと、1本を読んでいる間も
# 他が進み、「見比べて絞り込む」つもりが**同じ文字を何周も待つ**耐久作業になる。
# 妨害は**モールスではない**ので、探す対象は1つに定まる。

id = "302"
# **「混信」ではなく「ジャミング」**。混線 (crosstalk) は
# **無線に別の声が入る音声演出**として既に使っている語で (ADR T-8〜T-12)、
# 運営が「混線が出た」と言ったときにどちらか区別できなくなる。
name = "暗号電文・ジャミング"
difficulty = "hard"

[random]
# 語を選ぶと、その頭文字→対照表の色 が cut として同時に決まる
word = { pick = "morse_word", candidates = [
  # A=赤
  "ALFA",
  "KILO",
  "PAPA",
  # B=黄
  "BRAVO",
  "GOLF",
  "LIMA",
  # C=緑
  "MIKE",
  "HOTEL",
  "ROMEO",
  # D=青
  "DELTA",
  "INDIA",
  "XRAY",
  # E=白
  "ECHO",
  "TANGO",
  "OSCAR",
] }
cut = { derive = "morse_word_color", from = "${word}" }

# モールスを表示するLED
display = { pick = "color" }

# 残り4色に妨害表示を割り当てる (点灯 / 消灯 / 対称blink をランダムに)
noise = { pick = "noise_leds", exclude = [
  "${display}",
], on_ms_min = 200, on_ms_max = 900 }

[core]
leds = { "${display}" = { pattern = "morse", word = "${word}", unit_ms = 300 } }
# noise_leds は展開時に leds へマージされる (表示用LEDは上書きしない)
noise_leds = "${noise}"
cut = "${cut}"

[navigator]
briefing = "複数のランプが光っているが、そのうち1つだけがモールス信号で単語を繰り返している。他は無関係な点灯・点滅(妨害)。モールスの語を解読し、手元の${sheet_morse}(モールス対照表)でその頭文字の色を引いて、同じ色の線を切る。**解き方は 202 暗号電文と同じで、違いは妨害があること**。"
# **切る線の色は「照合の材料」として書く** (202 と同じ方針。ADR N-3)。
# **正解の単語はナビから伏せる** (決定142。202 と同じ理由)。
secret_word = "${word}"
# ゴール (頭文字を引いて出た色の線を切る) を落とさない (決定144)
# プレイヤーがモールスだと知っていても、紙の表の作りとゴールは知り得ない (決定145)
must_say = "**${sheet_morse}の表は1行に「文字・モールス信号・フォネティックコード・色」が並んでいる**こと。長短を表の符号と照らして1文字ずつ読み、読めた単語の**頭文字の行に書かれている色の線を切る**こと"
# 資料1の表 (色の列を除く) と読み方をナビに渡す (決定143)
morse_sheet = "${sheet_morse}"
answer = "モールスを表示しているのは${display}色のランプで、単語は${word}(あなたには分からない)。プレイヤーが解読した単語の頭文字を${sheet_morse}で引くと、切る線の色になる。他のランプは**無関係な妨害**(点灯しっぱなし / 消灯 / 一定周期の点滅)。${cut}色という色名はプレイヤーの報告と照合するためだけに使い、プレイヤーより先に発話に入れない。"
# **まず報告させる** (ADR N-10)。第一声で「長短が混ざったランプを探せ」と
# 言ってしまうと、装置を見る前に手順が始まる。
# 妨害があること自体は**装置を見れば分かる**ので伏せない (ADR N-4)。
procedure = "**第一声はランプの状態を尋ねるだけにする**(『ランプはどうなっている?』)。**ここで探し方を指示してはいけない**。\n\n報告を受けたら、**そのうち1つだけが信号を出していて、他は妨害だ**と伝え、**探し方を続けて言う** — **光り方のリズムが一定でないもの、長短が混ざっているものを探す**(妨害は一定周期の点滅か、点きっぱなし/消えっぱなしのどちらか)。妨害があること自体は装置を見れば分かるので伏せない。\n\n対象のランプが見つかったら、**長短の混ざった点滅がモールス信号であること**、他のランプは無関係であることを伝え、**手元の${sheet_morse}**で解読するよう促す(資料番号と中身をひとまとまりで言う。**面 (表裏) は言わない**)。単語名(チャーリー等)、1文字ずつのアルファベット、長短のオノマトペ、いずれの報告も受け付ける。**あなたは正解の単語を知らない** — 解読するのはプレイヤーで、報告された単語が合っているかは**判定しない**。\n\n**モールス信号の読み方が分かるかを尋ねる**(決定149)。表の作りとゴールを伝えた発話の最後に尋ねる。**プレイヤーがすでに解読した綴りを報告している**なら、読めているので尋ねない。\n- **分からない**と答えたら、「モールスの読み方」の手順を**最初の1〜2ステップから**、見え方のたとえと数え方の工夫で丁寧に教える(秒数は言わない)。1発話に詰め込まず、プレイヤーが読み進めるのに合わせて次のステップへ進む\n- **分かる**と答えたら、そのまま1文字ずつ読んで報告するよう促す\n\n語が読めたら、**その頭文字を${sheet_morse}で引いて、出た色の線を切る**ことを、**引くところから切るところまで一息で言い切る**。\n\n**プレイヤーが手順を分かっていない様子なら**(「〜って何?」「どういうこと?」)、結論だけを言い換えず、**流れを1から順に説明し直す**: (1) 長短の混ざった点滅がモールス信号 (2) ${sheet_morse}の表の符号で1文字ずつ読む (3) 読めた文字を並べると単語になる (4) その単語の頭文字の行を表で探す (5) その行に書かれている色の線を切る。聞かれた言葉が流れのどこに当たるかを示す。**プレイヤーが自分からモールスだと言ってきた**なら、モールスの説明は省き、まだ伝えていない部分 (表の作りと、頭文字の行の色の線を切ること) を伝える。\n\n**報告された単語が表に載っていなければ**(表は「${sheet_morse}の表」に載せてある)、次の順で1つの発話にまとめる:\n\n1. 聞こえた綴り・単語を短く復唱し、表には載っていないと伝える\n2. **綴りの近い表の単語を1〜2語挙げてよい**。どれが正解かは分からないので、候補として挙げるだけにする\n3. **食い違っている文字の長短を、表の符号と見比べて確かめる**よう頼む\n\n**モールスの読み方は丁寧に教えてよい**(「モールスの読み方」の内容。とくに文字の区切りの見落とし)。何度も読めないときは、1文字ずつ長短を報告してもらい、表の符号と一緒に照らす。**言い回しはキャラシートの「差し戻し」に委ねる — ここに例文は置かない**(決定80)。\n\n**切る線の色名もプレイヤーより先に発話に入れない**(ADR N-3)。プレイヤーが引いた色を報告してきたら、復唱してその色の線を切らせる。"
