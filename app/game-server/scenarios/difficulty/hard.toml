# ハード (docs/scenario_design.md §4・§4.1)
# 構成: 普通 ×2 + 難しい ×2 (4ステージ)
#
# 配線は5本あるが、最大5ステージにすると全色を使い切ってしまい、
# 切断線の選択に余地が無くなる (抽選の幅が消え、色の制約を持つステージが
# 組み立て不能になる)。1本余らせて4ステージを上限とする。

name = "ハード"
countdown_ms = 600000 # 10分
detonate_delay_ms = 2000

[compose]
random = { normal = 2, hard = 2 }

[crosstalk]
jamming = 1
ambient = 1
uneasy = 1

[hints]
# ハードは L4 (正解の直言) を出さない (docs/navigator_design.md §3.2)
l2_pct = 25
l3_pct = 50
l4_pct = 0 # 0 = L4無効

# 難易度で変える入力量 (docs/scenario_design.md §4.2)。
# **ステージ定義に数値を直書きしない** — 直書きすると難易度を跨いで
# 同じ負荷になる。ステージ側は ${load_color_match_min} で参照する。
#
# 204 色合わせで押す回数。ハードは**覚えておく負荷**を上げる。ただし押し終えるまで手がかりが
# 増えないため、伸ばしすぎると「まだ終わらない」だけの時間になる。
# 12回でおよそ40秒前後 (1回3秒前後の想定)。
#
# **ナビゲーターは回数を案内しない** (ADR N-42)。装置を見ていないため
# 何回目かを追えず、「あと3回だ」と言えば嘘になる。
[load]
color_match_min = 9
color_match_max = 12

# 206 綱渡り の禁止位置の数。**ハードは2つ。** 配置によって質が変わる (隣接=連続通過 /
# 離れている=2段構え / 目的地を挟む=行き過ぎ厳禁)。
# 配置は成立するものだけを列挙して等確率で引く (ADR S-10)。
forbidden_rotary_count = 2

# 201 復唱 のボタン列の長さ。**ハードは8個。** これ以上伸ばすと記憶ではなく
# 「読み上げを何度も聞き直す」時間になる。
push_seq_len = 8

# 205 速さくらべ の点滅速度 (速い順に4段階、ミリ秒)。
# **隣接比を詰めるほど難しい**。**ハードは 隣接 1.4倍均一** — 全体でも 2.75倍しか開かず、
# 「一番遅いのが一目瞭然」が消える。104 早い者勝ち で決めた下限 (1.5倍) を
# **意図的に下回る**設定 (205 は4色を並べ替えるので同じ比でも難しい)。
# **実機で見え方を確認してから確定させること**。
speed_rank_ms = [150, 210, 294, 412]
