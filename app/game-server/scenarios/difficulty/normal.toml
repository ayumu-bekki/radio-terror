# ノーマル (docs/scenario_design.md §4・§4.1)
# 構成: 簡単 ×1 + 普通 ×2

name = "ノーマル"
countdown_ms = 420000 # 7分
detonate_delay_ms = 2000

[compose]
random = { easy = 1, normal = 2 }

[crosstalk]
jamming = 1 # ノーマル以上で邪魔者系を解禁
ambient = 1
uneasy = 0

[hints]
# **ノーマル以上は L4 (正解の直言) を出さない** (ADR N-39)。
#
# イージーは「解体を体験してもらう」場なので、行き詰まったら答えを教えて
# 成功体験を優先する。**ノーマル以上はより実践的な交信を狙う**ため、
# ナビゲーターが答えそのものを言ってしまう段階を置かない。
# L3 (手順は示すが色名・番号は言わない) が上限になる。
l2_pct = 25
l3_pct = 50
l4_pct = 0 # 0 = L4無効

# 難易度で変える入力量 (docs/scenario_design.md §4.2)。
# **ステージ定義に数値を直書きしない** — 直書きすると難易度を跨いで
# 同じ負荷になる。ステージ側は ${load_color_match_min} で参照する。
#
# 204 色合わせで押す回数。ノーマルは現行の 6〜9 を基準にする。
#
# **ナビゲーターは回数を案内しない** (ADR N-42)。装置を見ていないため
# 何回目かを追えず、「あと3回だ」と言えば嘘になる。
[load]
color_match_min = 6
color_match_max = 9

# 206 綱渡り の禁止位置の数。イージー・ノーマルは1つ。関門を1回通過する。
# 配置は成立するものだけを列挙して等確率で引く (ADR S-10)。
forbidden_rotary_count = 1

# 201 復唱 のボタン列の長さ。イージー・ノーマルは5個 (無線で1回聞いて覚えられる長さ)。
push_seq_len = 5

# 205 速さくらべ の点滅速度 (速い順に4段階、ミリ秒)。
# **隣接比を詰めるほど難しい**。イージー・ノーマルは 隣接 1.82〜2.0倍。
speed_rank_ms = [150, 300, 550, 1000]
