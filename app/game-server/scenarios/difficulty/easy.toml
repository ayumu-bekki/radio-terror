# イージー (docs/scenario_design.md §4・§4.1)
# 構成: 簡単 ×2 (101を先頭固定 + 残り抽選)

name = "イージー"
countdown_ms = 300000 # 5分
detonate_delay_ms = 2000

[compose]
fixed_head = ["101"] # 先頭固定 (解体デビュー)
random = { easy = 1 } # 残り枠を「簡単」タグから抽選

[crosstalk] # 混線の系統別再生回数上限
jamming = 0 # イージーは邪魔者系なし (誤切断explodeで即失敗する事故を防ぐ)
ambient = 1
uneasy = 0

[hints] # ステージ予算(countdown÷ステージ数)に対する比率(%)
l2_pct = 25
l3_pct = 50
l4_pct = 75

# 難易度で変える入力量 (docs/scenario_design.md §4.2)。
# **ステージ定義に数値を直書きしない** — 直書きすると難易度を跨いで
# 同じ負荷になる。ステージ側は ${load_color_match_min} で参照する。
#
# 204 色合わせで押す回数。イージーは**解体を体験してもらう**場なので短めにする。
# 押している間はナビゲーターが黙る (ADR N-26) ため、
# 長いほど無線が沈黙する時間が延びる。
#
# **ナビゲーターは回数を案内しない** (ADR N-42)。装置を見ていないため
# 何回目かを追えず、「あと3回だ」と言えば嘘になる。
[load]
color_match_min = 4
color_match_max = 6

# 206 綱渡り の禁止位置の数。イージー・ノーマルは1つ。関門を1回通過する。
# 配置は成立するものだけを列挙して等確率で引く (ADR S-10)。
forbidden_rotary_count = 1

# 201 復唱 のボタン列の長さ。イージー・ノーマルは5個 (無線で1回聞いて覚えられる長さ)。
push_seq_len = 5

# 205 速さくらべ の点滅速度 (速い順に4段階、ミリ秒)。
# **隣接比を詰めるほど難しい**。イージー・ノーマルは 隣接 1.82〜2.0倍。
speed_rank_ms = [150, 300, 550, 1000]
