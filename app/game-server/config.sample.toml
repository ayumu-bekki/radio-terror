# game-server 設定サンプル
# 設計: docs/game_session_design.md / docs/bridge_connection_design.md /
#       docs/scenario_design.md / docs/operation_flow.md

[radio_bridge]
# radio-bridge からのダイヤルインを受ける gRPC の listen アドレス。
# 接続方向は反転済みのため、個々の bridge のアドレスは設定しない
# (bridge を増設してもここは変更不要)。
listen_addr = ":50051"

[websocket]
# core-system デバイスとトランシーバークライアントが相乗りする WebSocket。
# マネージャー向け Web 画面も同じポートの /manager で提供される。
listen_addr = ":8080"

[gemini]
# 接続先: Gemini Enterprise Agent Platform (旧 Vertex AI)。
# 環境変数 GOOGLE_CLOUD_PROJECT / GOOGLE_CLOUD_LOCATION でも指定できるが、
# ここに書いた値が優先される。
#
# 認証は ADC。APIキーは使わない。事前に済ませておく:
#   ローカル … gcloud auth application-default login
#   Docker  … サービスアカウントJSONを GOOGLE_APPLICATION_CREDENTIALS で渡す
# 手順は docs/gemini_enterprise_setup.md を参照。
#
# location は全モデル(TTS・推論・文字起こし)が提供されているリージョンにする。
# 実測(2026-08-10): "global" のみ3モデルすべて利用可。
#   us-central1     … TTSのみ。推論/文字起こしは404
#   asia-northeast1 … 3モデルすべて404
project                = "radio-terror"
location               = "global"

transcribe_model       = "gemini-3.1-flash-lite"
# ナビゲーターの思考 (会話生成・意図理解)。会話ターンごとに呼ぶため低レイテンシ重視
reasoning_model        = "gemini-3.5-flash-lite"
tts_model              = "gemini-3.1-flash-tts-preview"
transcribe_prompt_file = "transcribe_prompt.txt"
transcribe_schema_file = "transcribe_schema.json"

# 各API呼び出しのタイムアウト (秒)。省略・0 なら既定値。
#
# 上限を切らないと、呼び出し側の ctx はプロセス終了まで生きるので無制限に待つ。
#
# TTS は**応答をストリーミングで受け取る**ようにしてから安定した。
# 一括受信では音声5秒ぶんに対し 24〜56秒待たされる回が混じっていたが
# (15回中4回が10秒超)、ストリーミングでは15回すべて 2.2〜3.8秒に収まった。
# そのため上限は 10 秒で足りる。打ち切った場合は tts_attempts 回まで作り直す。
transcribe_timeout_sec = 20
reply_timeout_sec      = 20
tts_timeout_sec        = 10

# TTS を試す回数 (初回を含む)。省略・0 なら既定値 3。
# 通常は1回で成功する。通信エラー時の保険。
tts_attempts = 3

[scenario]
# シナリオテンプレートの配置 (stages/ と difficulty/ を含むディレクトリ)
dir = "scenarios"

[navigator]
# ナビゲーター設定の配置 (prompt.toml と characters/ を含むディレクトリ)
# キャラクターの口調・プロンプトはここのTOMLを編集して再起動すれば反映される。
dir = "navigator"

[valkey]
# セッション状態・会話ログ・スコアの永続化先。
# 空文字またはセクションごと省略した場合はメモリのみで動作する
# (再起動での復帰はできない)。
addr = "valkey:6379"

[assets]
# 混線音声・効果音アセットの配置。
#   {dir}/crosstalk/{jamming,ambient,uneasy}/*.ogg
#   {dir}/sfx/success.ogg, {dir}/sfx/failure.ogg
# 未制作でもサーバーは起動する (該当の再生がスキップされる)。
dir = "assets"

[manager]
# 強制リセット(キルスイッチ)の秘密ワード。運営内でのみ共有する。
# 一致判定はかな正規化のゆるい一致 (認識ゆれで効かない事態を防ぐ)。
#
# **表記ゆれはカンマ区切りで全て並べる**。音声認識は同じ音を別の表記で返し、
# かな正規化では漢字をかなへ戻せないため、片方しか書かないと一致しない
# (「でんぱ」だけの設定で STT が「電波」と書き起こし、キルスイッチが
#  効かなかった実例がある)。漢字になりうる語は必ず両方書くこと。
secret_word = "でんぱ,電波"

[mission_sheet]
# 紙資料の物理定数 (docs/puzzle_stage_ideas.md §7)。
# シートを刷り直した場合はここを更新する。
# 07 運命の二択: シート上の記号の数と数字の合計
symbol_count = 28
number_sum   = 47

# E ブループリント: 回路図シートの端子番号 → 配線色 の対応
[mission_sheet.terminal_map]
T1 = "A"  # 赤
T2 = "B"  # 黄
T3 = "C"  # 緑
T4 = "D"  # 青
T5 = "E"  # 白

[log]
level = "info"
