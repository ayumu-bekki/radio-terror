services:
  game-server:
    build:
      context: .
      dockerfile: game-server/Dockerfile
    ports:
      - 8080:8080   # 通信用WebSocket (/ws) + マネージャー向け Web 画面 (/manager)
      - 50051:50051 # gRPC (radio-bridge からのダイヤルイン)
    volumes:
      - type: bind
        source: ./game-server/config.toml
        target: /app/config.toml
        read_only: true 
      - type: bind
        source: ./game-server/transcribe_prompt.txt
        target: /app/transcribe_prompt.txt
        read_only: true 
      - type: bind
        source: ./game-server/transcribe_schema.json
        target: /app/transcribe_schema.json
      - type: bind
        source: ./game-server/scenarios
        target: /app/scenarios
        read_only: true
      - type: bind
        source: ./game-server/navigator
        target: /app/navigator
        read_only: true
      - type: bind
        source: ./game-server/assets
        target: /app/assets
        read_only: true
      # Gemini Enterprise Agent Platform (旧 Vertex AI) を使う場合は
      # サービスアカウントキーをマウントする
      # (config.toml で backend="enterprise" を指定したとき必須)。
      # 鍵の発行と配置は docs/gemini_enterprise_setup.md を参照。
      - type: bind
        source: ./secrets/geap-sa.json
        target: /secrets/geap-sa.json
        read_only: true
    environment:
      # SDK がこの環境変数から鍵を読む (設定ファイルにパスは書かない)
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/geap-sa.json
    read_only: true
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      # /manager はマネージャー画面のトップページ。WSサーバー(8080)が
      # リクエストを処理できる状態になっているかで起動完了を判定する。
      test: ["CMD", "curl", "-f", "http://localhost:8080/manager"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - radio-terror-network

  radio-bridge-br01:
    build:
      context: .
      dockerfile: radio-bridge/Dockerfile
    environment:
      RADIO_BRIDGE_ID: BR01
      # デバイス名は実機で `aplay -l` / `arecord -l` で確認する。
      RADIO_BRIDGE_INPUT_DEVICE: "hw:0,0"
      RADIO_BRIDGE_OUTPUT_DEVICE: "plughw:0,0"
      # PTT制御用GPIOピン(BCM番号)。PCB配線はbridgeごとに異なる。
      RADIO_BRIDGE_PTT_PIN: "26"
    depends_on:
      game-server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./radio-bridge/config.toml
        target: /app/config.toml
        read_only: true
      #- type: bind
      #  source: ./radio-bridge/dump_audio
      #  target: /app/dump_audio
    privileged: true  # GPIO (/dev/gpiochip*) と ALSA (/dev/snd/*) へのアクセスに privileged が必要
    networks:
      - radio-terror-network

  #radio-bridge-br02:
  #  build:
  #    context: .
  #    dockerfile: radio-bridge/Dockerfile
  #  environment:
  #    RADIO_BRIDGE_ID: BR02
  #    # デバイス名は実機で `aplay -l` / `arecord -l` で確認する。
  #    RADIO_BRIDGE_INPUT_DEVICE: "hw:2,0"
  #    RADIO_BRIDGE_OUTPUT_DEVICE: "plughw:2,0"
  #    # PTT制御用GPIOピン(BCM番号)。PCB配線はbridgeごとに異なる。
  #    RADIO_BRIDGE_PTT_PIN: "16"
  #  depends_on:
  #    game-server:
  #      condition: service_healthy
  #  volumes:
  #    - type: bind
  #      source: ./radio-bridge/config.toml
  #      target: /app/config.toml
  #      read_only: true
  #    #- type: bind
  #    #  source: ./radio-bridge/dump_audio
  #    #  target: /app/dump_audio
  #  privileged: true  # GPIO (/dev/gpiochip*) と ALSA (/dev/snd/*) へのアクセスに privileged が必要
  #  networks:
  #    - radio-terror-network

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - radio-terror-network

volumes:
  valkey-data:

networks:
  radio-terror-network:

