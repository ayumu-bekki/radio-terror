services:
  wl-game-server:
    build:
      context: .
      dockerfile: wl-game-server/Dockerfile
    ports:
      - 8080:8080   # 通信用WebSocket (/ws) + マネージャー向け Web 画面 (/manager)
      - 50051:50051 # gRPC (radio-bridge からのダイヤルイン)
    volumes:
      - type: bind
        source: ./wl-game-server/config.toml
        target: /app/config.toml
        read_only: true 
      - type: bind
        source: ./wl-game-server/transcribe_prompt.txt
        target: /app/transcribe_prompt.txt
        read_only: true 
      - type: bind
        source: ./wl-game-server/transcribe_schema.json
        target: /app/transcribe_schema.json
      - type: bind
        source: ./wl-game-server/scenarios
        target: /app/scenarios
        read_only: true
      - type: bind
        source: ./wl-game-server/navigator
        target: /app/navigator
        read_only: true
      - type: bind
        source: ./wl-game-server/assets
        target: /app/assets
        read_only: true
    read_only: true 
    depends_on:
      - valkey
    networks:
      - whisperlink-network

  radio-bridge-br01:
    build:
      context: .
      dockerfile: radio-bridge/Dockerfile
    environment:
      RADIO_BRIDGE_ID: BR01
      # デバイス名は実機で `aplay -l` / `arecord -l` で確認する。
      RADIO_BRIDGE_INPUT_DEVICE: "hw:0,0"
      RADIO_BRIDGE_OUTPUT_DEVICE: "plughw:0,0"
    depends_on:
      - wl-game-server
    volumes:
      - type: bind
        source: ./radio-bridge/config.toml
        target: /app/config.toml
        read_only: true
      #- type: bind
      #  source: ./radio-bridge/dump_audio
      #  target: /app/dump_audio
    privileged: true  # GPIO (/dev/gpiochip*) と ALSA (/dev/snd/*) へのアクセスに privileged が必要
    networks:
      - whisperlink-network

  radio-bridge-br02:
    build:
      context: .
      dockerfile: radio-bridge/Dockerfile
    environment:
      RADIO_BRIDGE_ID: BR02
      # デバイス名は実機で `aplay -l` / `arecord -l` で確認する。
      RADIO_BRIDGE_INPUT_DEVICE: "hw:2,0"
      RADIO_BRIDGE_OUTPUT_DEVICE: "plughw:2,0"
    depends_on:
      - wl-game-server
    volumes:
      - type: bind
        source: ./radio-bridge/config.toml
        target: /app/config.toml
        read_only: true
      #- type: bind
      #  source: ./radio-bridge/dump_audio
      #  target: /app/dump_audio
    privileged: true  # GPIO (/dev/gpiochip*) と ALSA (/dev/snd/*) へのアクセスに privileged が必要
    networks:
      - whisperlink-network

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 60 1
    volumes:
      - valkey-data:/data
    networks:
      - whisperlink-network

volumes:
  valkey-data:

networks:
  whisperlink-network:

