syntax = "proto3";
package transceiver;

option go_package = "radio-bridge-test-client/proto";

service TransceiverService {
  // 双方向ストリーミング: クライアントから音声を送信し、サーバーからも音声を受信する
  rpc Connect(stream AudioChunk) returns (stream AudioChunk);
}

// 1 メッセージ = 1 再生サイクル (ワンショット)。
//
// かつては status / stream_id を付けて複数チャンクを 1 つの PTT 区間へ
// 束ねる分割送信を持っていたが、TTS をストリーミング受信して**分割せず
// 1 パケットで送る**方式に移行したため廃止した
// (docs/bridge_connection_design.md §2 決定14)。
message AudioChunk {
  bytes ogg_opus_data = 1;
}
