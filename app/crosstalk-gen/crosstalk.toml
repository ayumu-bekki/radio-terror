# ---------------------------------------------------------------------------
# 4. 自動送信局アナウンス (announce) — 1ファイル
#    docs/operation_flow.md §7.3
#
#    **これだけは混線ではない。** 他の3系統は「偶然漏れ聞こえた通信」だが、
#    これはこちらから聞き手へ**直接送る放送**。特小無線は共用チャンネルなので、
#    他の利用者へ「これは自動送信局である」と名乗り、譲る用意があると伝える。
#
#    そのため scene を上書きしている (共通 scene は傍受を前提にしているため)。
#
#    出力先が assets/crosstalk ではなく assets/announce になる点に注意:
#      go run . -category announce -out ../game-server/assets
# ---------------------------------------------------------------------------

[[announce]]
# このファイル名は固定。announce.go の announceFile が名前で参照する。
name = "station_id"
role = "自動送信局のアナウンス"
scene = """
業務用トランシーバー(特定小電力無線)による定時アナウンス。
録音された自動送信メッセージで、チャンネルの利用者へ向けて送信している。
傍受ではなく、聞き手に向けて直接送っている放送。
"""
context = """
機械的に繰り返される定時アナウンス。感情を込めず、事務的に読み上げる。
早口にならず、一語一語を明瞭に発音する。無線越しでも聞き取れるように。
不安を煽らず、淡々と用件だけを伝える。
"""
text = "こちらはカラス。本チャンネルはゲーム用自動送信局です。[pause] 他の通信のご迷惑となっている場合は、チャンネルを変更いたしますので本チャンネルへお知らせください。どうぞ。"
# カラスの声。疎通確認の応答者と同じ声にして、同一人物だと分かるようにする
# (game-server の testResponderTTSVoice と揃えること)。
voice = "Achird"

# ---------------------------------------------------------------------------
# 5. 聞き直し (reask) — キャラクターごとに2本 = 10ファイル
#
#    書き起こし・発話生成に失敗したとき、game-server が実行時のAPIを使わずに
#    流す「よく聞き取れなかったので、もう一度お願いします」。
#    ADR G-7 / docs/navigator_decisions.md 決定164。
#
#    **声と台詞は navigator/characters/*.toml の tts_voice / reask_lines と一致させる**
#    (name は <キャラクターID>_<n>。n は reask_lines の順。verify_test.go が検査する)。
#    このブロックは各キャラクター定義から作ってある。台詞を変えたら
#    キャラクター定義とここの両方を直し、音声を作り直す:
#
#      go run . -category reask -out ../game-server/assets -force
#
#    出力先は assets/crosstalk ではなく assets/reask になる点に注意 (announce と同じ)。
#
#    **context は tts_style だけにする。** 「聞き取れず頼む一言・申し訳なさそうに」といった
#    場面の指示を足すと、モズ2本とツグミ1本が 400 (INVALID_ARGUMENT) を返し続けた
#    (2026-09-30。外すと通る)。場面は Scene と台詞で足りる。
# ---------------------------------------------------------------------------
[[reask]]
name = "heron_1"
role = "アオサギの聞き直し (1)"
voice = "Kore"
scene = """
業務用トランシーバー(特定小電力無線)での交信。
ナビゲーターが、無線の向こうのプレイヤーへ直接話している。
"""
context = """
中音域の落ち着いた女性の声。平坦だが明瞭。感情を抑えた分析的な読み方で。
"""
text = "こちらアオサギ。よく聞き取れませんでした。もう一度お願いします。どうぞ"
# 生成後に加工する (3本目と同じ。degrade.go)。台詞の最初の間のあとの450msが聞こえない
degrade = { snr_db = 10, noise_swell = 1, band_limit = true, dropout_ms = 450, dropout_after_pause = 1 }

