#    解除・爆発の最終メッセージを、実行時の生成 (reply + TTS) ではなく**事前収録の
#    音声**で流す。生成に十数秒かかって終幕が遅れるのを避けるため。
#    ADR G-9 / docs/navigator_decisions.md 決定165。
#
#    **声と台詞は navigator/characters/*.toml の tts_voice / defused_lines /
#    exploded_lines と一致させる** (name は <キャラクターID>_<defused|exploded>_<n>。
#    n は台詞の順。verify_test.go が検査する)。台詞を変えたらキャラクター定義と
#    ここの両方を直し、音声を作り直す:
#
#      go run . -category ending -out ../game-server/assets -force
#
#    出力先は assets/ending になる (reask と同じ)。
