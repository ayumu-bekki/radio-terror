#   - **声は元と同じ音量** (帯域を絞ってこもらせても (band_limit) 元の大きさへ戻す)。
#     ノイズだけを SN比 (snr_db。10 = ノイズが目立つが言葉ははっきり分かる) で足し、
#     電波の揺れで膨らませる (noise_swell。1 で SN比が前後3dBほど動く)
# 聞いて、声とノイズのバランスを調整する (snr_db を下げるとノイズが増える)
degrade = { snr_db = 10, noise_swell = 1, band_limit = true, dropout_ms = 450, dropout_after_pause = 1 }

