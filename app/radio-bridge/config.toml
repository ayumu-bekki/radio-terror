[server]
# 接続先 game-server の gRPC エンドポイント。
# 接続方向は反転済みのため、bridge 側は listen しない
# (docs/bridge_connection_design.md §2 決定1)。
server_addr = "http://game-server:50051"

# この bridge の ID。環境変数 RADIO_BRIDGE_ID があればそちらが優先される。
# チーム(周波数)ごとに1プロセス動かすため、プロセスごとに異なるIDを付ける。
bridge_id = "BR01"

# 切断時の再接続待機間隔(秒)
reconnect_interval_secs = 5

[gpio]
# PTT制御に使うGPIOピン番号(BCM番号)。PCB配線はbridgeごとに異なるため、
# 環境変数 RADIO_BRIDGE_PTT_PIN があればそちらが優先される。
# ここの値は環境変数が無い場合のフォールバック。
ptt_pin = 26

[audio]
# オーディオインターフェースはチーム(周波数)ごとに変わるため、
# 環境変数 RADIO_BRIDGE_OUTPUT_DEVICE / RADIO_BRIDGE_INPUT_DEVICE を優先する。
# ここの値は環境変数が無い場合のフォールバック。
# 実機のデバイス名は `aplay -l` / `arecord -l` で確認する。
output_device       = "plughw:2,0"
input_device        = "hw:2,0"
input_threshold_rms      = 1000
input_silence_ms         = 2000
input_min_recording_ms   = 800   # これ未満の録音はブロードキャストしない
input_max_recording_secs = 30
dump_ogg_enabled = false
dump_ogg_dir     = "/app/dump_audio"

[timing]
ptt_on_delay_ms  = 500
ptt_off_delay_ms = 100
cooldown_ms      = 500

[queue]
max_audio_duration_secs = 40
max_queue_size          = 10
