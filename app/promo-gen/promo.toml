# 紹介動画用セリフ 生成設定
#
# ゲーム用の混線・終幕音声 (crosstalk-gen) とは別管理。出力は app/promo-gen/out/*.wav (PCM)。
# 声と話し方は navigator/characters/*.toml の tts_voice / tts_style に揃えてある。
#
#   go run . -list
#   go run . -dry-run
#   go run .                      # 生成 (既存は飛ばす)
#   go run . -only owl_pitch -force

[defaults]
project  = "radio-terror"
location = "global"
model    = "gemini-3.8-flash-lite-tts"
max_retries         = 3
request_interval_ms = 4000
skip_existing       = true

# --- 紹介用 (体験名を言う。各キャラ1本) ---

[[line]]
name = "owl_pitch"
role = "フクロウの紹介"
voice = "Charon"
scene = """
業務用トランシーバー(特定小電力無線)越しに、紹介動画の視聴者へ呼びかけている。
聞き手に挑むように、しかし落ち着いて語りかける。
"""
context = """
低音で落ち着いた男性の声。テンポは遅め。無駄なく淡々と、しかし芯のある話し方で。
"""
text = "[calm] 目の前の危険物、お前に解除できるか。「リアル危険物解除ゲーム」だ。無線越しに、俺が指示を出す。"

[[line]]
name = "shrike_pitch"
role = "モズの紹介"
voice = "Algieba"
scene = """
業務用トランシーバー(特定小電力無線)越しに、紹介動画の視聴者へ呼びかけている。
聞き手に挑むように、しかし落ち着いて語りかける。
"""
context = """
30代男性の声。関西のイントネーションで、テンポは速め。歯切れよく、語尾を跳ね上げるように。芝居がからず、現場で指示を飛ばす調子で。
"""
text = "[calm] 目の前の危険物、バラせるか? 「リアル危険物解除ゲーム」の始まりや。無線越しに、俺が段取りつけたるわ。"

[[line]]
name = "lark_pitch"
role = "ヒバリの紹介"
voice = "Leda"
scene = """
業務用トランシーバー(特定小電力無線)越しに、紹介動画の視聴者へ呼びかけている。
聞き手に挑むように、しかし落ち着いて語りかける。
"""
context = """
明るく若い女性の声。テンポは速め、抑揚は大きめ。元気よく、少し早口で。
"""
text = "[tense] 危険物の解除、心の準備はいいですか? 「リアル危険物解除ゲーム」、無線越しにわたしが全力でサポートします!"

