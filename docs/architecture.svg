<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%" height="auto" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif">
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="2" y="2" width="876" height="306" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== 左: core-system (複数台) ==================== -->
  <!-- 複数台を示す背面のカード -->
  <rect x="34" y="42" width="200" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="26" y="50" width="200" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="126" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">core-system</text>
  <rect x="86" y="92" width="80" height="20" rx="10" fill="#f1f5f9" />
  <text x="126" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">複数台</text>
  <text x="126" y="130" text-anchor="middle" font-size="12" fill="#475569">危険物デバイス (ESP32)</text>

  <!-- 接続線: core-system -> game-server -->
  <line x1="226" y1="98" x2="328" y2="98" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-right)" />
  <text x="278" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">WebSocket /ws</text>

  <!-- ==================== 中央: game-server ==================== -->
  <rect x="332" y="42" width="216" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="440" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">game-server</text>
  <text x="440" y="98" text-anchor="middle" font-size="12" fill="#1e40af">セッション組み立て・管理</text>
  <text x="440" y="118" text-anchor="middle" font-size="12" fill="#1e40af">ナビゲーター(生成AI)・混線演出</text>
  <text x="440" y="138" text-anchor="middle" font-size="12" fill="#1e40af">Management Console</text>

  <!-- ==================== 右: radio-bridge (複数) ==================== -->
  <!-- 接続線: radio-bridge -> game-server -->
  <line x1="654" y1="98" x2="552" y2="98" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-left)" />
  <text x="602" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">gRPC</text>

  <!-- 複数台を示す背面のカード -->
  <rect x="662" y="42" width="200" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="654" y="50" width="200" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="754" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">radio-bridge</text>
  <rect x="714" y="92" width="80" height="20" rx="10" fill="#f1f5f9" />
  <text x="754" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">複数</text>
  <text x="754" y="130" text-anchor="middle" font-size="12" fill="#475569">特小無線 PTT・音声I/O</text>

  <!-- ==================== 下: Valkey ==================== -->
  <line x1="440" y1="154" x2="440" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-down)" />
  <rect x="350" y="210" width="180" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="440" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Valkey</text>
  <text x="440" y="262" text-anchor="middle" font-size="12" fill="#475569">セッション・バインド永続化</text>
</svg>
